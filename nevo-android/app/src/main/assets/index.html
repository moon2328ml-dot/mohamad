<body>
<div class="app" id="app">
  <main class="screen" id="screen"></main>
  <nav class="bottom" id="bottom">
    <button class="nav active" data-view="home"><i>⌂</i><span>خانه</span></button>

  </nav>
</div>
<div class="modal" id="modal"></div>
<div class="date-picker" id="datePicker"></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), screen=$('#screen'), modal=$('#modal'), toast=$('#toast');
const KEY='nevo.local.v3';
const blank=()=>({view:'home',history:['home'],tasks:[],goals:[],income:[],allocations:[],debts:[],memories:[],events:[],memoryFolders:[],noteFolders:[],notes:[],profileName:'',self:{good:[],bad:[],targets:[]},couple:{goals:[],memories:[],myGood:[],myBad:[],partnerGood:[],partnerBad:[],habits:[]}});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');const b=blank();if(!x)return b;return {...b,...x,history:Array.isArray(x.history)&&x.history.length?x.history:['home'],tasks:Array.isArray(x.tasks)?x.tasks:[],goals:Array.isArray(x.goals)?x.goals:[],income:Array.isArray(x.income)?x.income:[],allocations:Array.isArray(x.allocations)?x.allocations:[],debts:Array.isArray(x.debts)?x.debts:[],memories:Array.isArray(x.memories)?x.memories:[],events:Array.isArray(x.events)?x.events:[],memoryFolders:Array.isArray(x.memoryFolders)?x.memoryFolders:[],noteFolders:Array.isArray(x.noteFolders)?x.noteFolders:[],notes:Array.isArray(x.notes)?x.notes:[],self:{...b.self,...x.self},couple:{...b.couple,...x.couple}}}catch(e){return blank()}}
const state=load(), periods={daily:'روزانه',weekly:'هفتگی',monthly:'ماهانه',mid:'میان‌مدت',long:'بلندمدت'}, visionPeriods={short:'کوتاه‌مدت',mid:'میان‌مدت',long:'بلندمدت'};let activeMission='daily',activeMissionDetail=null,activeVision='short',activeVisionDetail=null,activeFinance='overview',activeFinanceDetail=null,activeSelf='good',activeSelfDetail=null,activeCouple='goals',activeCoupleDetail=null,activeMemory=null,activeMemoryFolder=null,activeNote=null,activeNoteFolder=null,calendarDate=new Date();
const today=new Date(), faDate=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(today), faWeekDays=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toFa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function num(v){return Number(String(v||'').replace(/[^\d.]/g,''))||0}function money(n){return new Intl.NumberFormat('fa-IR').format(n||0)}function val(id){return ($('#'+id)?.value||'').trim()}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.nevoToast);window.nevoToast=setTimeout(()=>toast.classList.remove('show'),2300)}
const jalaliMonthNames=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],jalaliWeekNames=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
function jalaliToGregorian(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1,md=[0,31,28,31,30,31,30,31,31,30,31,30,31],leap=(gy%4===0&&gy%100!==0)||gy%400===0;if(leap)md[2]=29;let gm=1;while(gm<=12&&gd>md[gm])gd-=md[gm++];return [gy,gm,gd]}
function gregorianToJalali(gy,gm,gd){let gdm=[0,31,59,90,120,151,181,212,243,273,304,334],gy2=gm>2?gy+1:gy,days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1],jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),jd=1+(days<186?days%31:(days-186)%30);return {jy,jm,jd}}
function jalaliMonthDays(y,m){if(m<=6)return 31;if(m<=11)return 30;const a=jalaliToGregorian(y,m,1),b=jalaliToGregorian(y+1,1,1);return Math.round((new Date(...[b[0],b[1]-1,b[2]])-new Date(...[a[0],a[1]-1,a[2]]))/86400000)}
function jalaliFromIso(iso){if(!iso||!/^(\d{4})-(\d{2})-(\d{2})$/.test(iso))return null;const [y,m,d]=iso.split('-').map(Number);return gregorianToJalali(y,m,d)}
function isoFromJalali(y,m,d){const [gy,gm,gd]=jalaliToGregorian(y,m,d);return `${gy}-${String(gm).padStart(2,'0')}-${String(gd).padStart(2,'0')}`}
function jalaliDisplay(iso){const p=jalaliFromIso(iso);return p?`${toFa(p.jy)}/${toFa(String(p.jm).padStart(2,'0'))}/${toFa(String(p.jd).padStart(2,'0'))}`:''}
function dateInput(id,iso=''){return `<input id="${id}" class="date-input" type="text" readonly value="${esc(jalaliDisplay(iso))}" data-iso="${esc(iso||'')}" placeholder="تاریخ شمسی را انتخاب کن" onclick="openJalaliPicker('${id}')">`}
function dateVal(id){return $('#'+id)?.dataset.iso||''}
let pickerTarget='',picker={jy:1405,jm:1,jd:1};
function openJalaliPicker(id){pickerTarget=id;const input=$('#'+id),iso=input?.dataset.iso||'',d=iso?new Date(iso+'T12:00:00'):new Date(),p=gregorianToJalali(d.getFullYear(),d.getMonth()+1,d.getDate());picker={jy:p.jy,jm:p.jm,jd:p.jd};renderJalaliPicker()}
function renderJalaliPicker(){const targetIso=isoFromJalali(picker.jy,picker.jm,picker.jd),first=jalaliToGregorian(picker.jy,picker.jm,1),offset=(new Date(first[0],first[1]-1,first[2]).getDay()+1)%7,days=jalaliMonthDays(picker.jy,picker.jm),cells=[];for(let i=0;i<offset;i++)cells.push('<span></span>');for(let d=1;d<=days;d++){const iso=isoFromJalali(picker.jy,picker.jm,d);cells.push(`<button type="button" class="${iso===targetIso?'selected':''}" onclick="pickJalaliDay(${d})">${toFa(d)}</button>`)}document.querySelector('#datePicker').innerHTML=`<div class="date-picker-sheet"><div class="date-picker-head"><button type="button" onclick="shiftJalaliMonth(-1)">‹</button><strong>${jalaliMonthNames[picker.jm-1]} ${toFa(picker.jy)}</strong><button type="button" onclick="shiftJalaliMonth(1)">›</button></div><div class="jalali-week">${jalaliWeekNames.map(x=>`<span>${x}</span>`).join('')}</div><div class="jalali-days">${cells.join('')}</div><div class="date-picker-actions"><button type="button" onclick="closeDatePicker()">انصراف</button><button type="button" class="primary-date" onclick="confirmJalaliDate()">انتخاب تاریخ</button></div></div>`;document.querySelector('#datePicker').classList.add('show')}
function shiftJalaliMonth(delta){picker.jm+=delta;if(picker.jm<1){picker.jm=12;picker.jy--}if(picker.jm>12){picker.jm=1;picker.jy++}picker.jd=Math.min(picker.jd,jalaliMonthDays(picker.jy,picker.jm));renderJalaliPicker()}
function pickJalaliDay(day){picker.jd=day;renderJalaliPicker()}
function closeDatePicker(){document.querySelector('#datePicker').classList.remove('show');pickerTarget=''}
function confirmJalaliDate(){if(!pickerTarget)return;const input=$('#'+pickerTarget),iso=isoFromJalali(picker.jy,picker.jm,picker.jd);if(input){input.dataset.iso=iso;input.value=jalaliDisplay(iso)}closeDatePicker()}

function nav(){document.querySelectorAll('.nav[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view))}function shell(title,body){return `<div class="subpage"><div class="top"><div class="back-title"><button class="back" onclick="backOne()">‹</button><h1 class="page-title">${title}</h1></div><button class="icon-btn" onclick="showToast('این فضا برای نوشته‌های خودت آماده است')">⋮</button></div>${body}</div>`}
function home(){const total=state.tasks.length,done=state.tasks.filter(t=>t.done||t[3]).length,p=total?Math.round(done*100/total):0;return `<div class="top"><button class="icon-btn" onclick="showToast('منوی سریع آمادهٔ شخصی‌سازی است')">☰</button><div class="brand"><img src="assets/nevo-logo.jpg" alt="NEVo">NEVo</div><button class="icon-btn" onclick="showToast('اعلانی ثبت نشده')">♧</button></div><section class="hero"><img class="hero-logo" src="assets/nevo-logo.jpg" alt="NEVo"><h1 class="hello">${state.profileName?'سلام '+esc(state.profileName):'سلام'}</h1><p class="sub">هر روز یک قدم به نسخهٔ بهتر خودت نزدیک‌تر شو…</p><div class="quote"><b>✦</b><span>این فضا را با برنامه‌ها و هدف‌های خودت بساز</span><span style="margin-right:auto">›</span></div><div class="date-row"><strong>${faDate}</strong><span>☼ روز خوبی داشته باشی</span></div></section><div class="section-head"><h2>مسیرهای رشد</h2><button onclick="go('reports')">گزارش‌ها</button></div><div class="grid"><button class="tile" onclick="go('mission')"><span class="ico">🎯</span><strong>ماموریت</strong><small>برنامه و اجرای مسیر</small></button><button class="tile" onclick="go('vision')"><span class="ico">⛰</span><strong>ویژن</strong><small>تصویر آیندهٔ من</small></button><button class="tile" onclick="go('finance')"><span class="ico">🪙</span><strong>مسیر آزادی</strong><small>آرامش مالی</small></button><button class="tile" onclick="go('memories')"><span class="ico">📷</span><strong>خاطرات قشنگ</strong><small>لحظه‌های ارزشمند</small></button><button class="tile" onclick="go('self')"><span class="ico">🌿</span><strong>خودشناسی</strong><small>رشد فردی</small></button><button class="tile" onclick="go('couple')"><span class="ico">♥</span><strong>ما</strong><small>رابطه و احساسات</small></button><button class="tile" onclick="go('notes')"><span class="ico">📒</span><strong>دفترچه نکات</strong><small>یادگیری‌های من</small></button><button class="tile" onclick="go('cloud')"><span class="ico">☁️</span><strong>فضای ابری</strong><small>پشتیبان امن اطلاعات</small></button></div><div class="section-head"><h2>پیشرفت امروز</h2><button onclick="go('mission')">جزئیات ›</button></div><div class="progress-card"><div class="ring" style="--progress:${p}%"><b>${toFa(p)}٪</b></div><div class="progress-meta"><strong>${total?'پیشرفت برنامه‌ها':'شروع مسیر شخصی تو'}</strong><span>${total?`${toFa(done)} برنامه از ${toFa(total)} انجام شده`:'هنوز برنامه‌ای ثبت نشده؛ اولین مورد را خودت اضافه کن.'}</span></div></div>`}
function faParts(d){const ps=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).formatToParts(d);return Object.fromEntries(ps.map(x=>[x.type,x.value]))}function sameDay(a,b){return a.toDateString()===b.toDateString()}function moveMonth(n){calendarDate.setDate(calendarDate.getDate()+n*32);render()}
function calendarMarkup(){const cur=faParts(calendarDate),first=new Date(calendarDate);let g=0;while(!/^۱$|^1$/.test(faParts(first).day)&&g++<35)first.setDate(first.getDate()-1);const offset=(first.getDay()+1)%7,cells=Array.from({length:offset},()=>'<div class="day muted"></div>');for(let i=0;i<42-offset;i++){const d=new Date(first);d.setDate(first.getDate()+i);const p=faParts(d),muted=p.month!==cur.month||p.year!==cur.year,key=d.toISOString().slice(0,10),has=state.events.some(e=>e.date===key),cls=['day',muted?'muted':'',sameDay(d,new Date())?'today':'',has?'has-event':''].filter(Boolean).join(' ');cells.push(`<div class="${cls}" title="${esc(p.weekday)}">${p.day}</div>`)}return `<div class="calendar-card"><div class="month-head"><button class="arrow" onclick="moveMonth(-1)">‹</button><strong>${new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'long',year:'numeric'}).format(calendarDate)}</strong><button class="arrow" onclick="moveMonth(1)">›</button></div><div class="week">${faWeekDays.map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells.join('')}</div><div style="margin-top:12px;text-align:center;color:#6f8884;font-size:11px">امروز: ${cur.weekday}، ${cur.day} ${cur.month}</div></div>`}
function calendar(){return shell('تقویم',`<div class="pillbar"><button class="pill active">ماه</button><button class="pill">هفته</button><button class="pill">روز</button><button class="pill">روزهای شخصی</button></div>${calendarMarkup()}<div class="section-head"><h2>روزهای شخصی تو</h2><button onclick="eventForm()">＋ افزودن روز</button></div>${state.events.length?`<div class="list">${state.events.slice().reverse().map(e=>`<button class="task" onclick="eventForm('${e.id}')"><span class="task-emoji">✦</span><span class="task-info"><span class="task-name">${esc(e.title)}</span><span class="task-time">${esc(e.date?jalaliDisplay(e.date):'')}${e.note?' · '+esc(e.note):''}</span></span><span>›</span></button>`).join('')}</div>`:`<div class="panel" style="text-align:center;color:var(--muted);font-size:12px;line-height:2">هنوز روز خاصی ثبت نشده.<br>اسم روزهای مهمت را خودت اضافه کن.</div>`}`)}
function taskHTML(t){const done=t.done||t[3],title=t.title||t[0],time=t.time||t[1]||'',note=t.note||'';return `<button class="task ${done?'done':''}" onclick="toggleTask('${t.id||''}')"><span class="check">✓</span><span class="task-info"><span class="task-name">${esc(title)}</span><span class="task-time">${esc(t.date?jalaliDisplay(t.date):'بدون تاریخ')}${time?' · '+esc(time):''}${note?' · '+esc(note):''}</span></span><span class="task-emoji">${done?'✓':'✦'}</span></button>`}
function mission(){if(activeMissionDetail)return missionDetail();return shell('ماموریت',`<div class="feature mission-detail-glow"><h3>مسیر زندگی تو، پارت‌به‌پارت</h3><p>هر بازه صفحهٔ اختصاصی خودش را دارد. وارد هر پارت شو و جزئیات را خودت ثبت و پیگیری کن.</p></div><div class="list mission-parts" style="margin-top:14px">${Object.entries(periods).map(([k,v],i)=>{const count=state.tasks.filter(t=>(t.period||'daily')===k).length;const icons=['☼','◒','◈','⛰','✦'];return `<button class="mission-row" onclick="activeMissionDetail='${k}';activeMission='${k}';render()"><span class="mission-orb">${icons[i]}</span><span class="mission-copy"><strong>${v}</strong><small>ورود به پارت و ثبت جزئیات برنامه</small></span><span class="mission-count">${toFa(count)} مورد</span><span class="mission-arrow">‹</span></button>`}).join('')}</div><button class="primary" style="width:100%;padding:14px;margin-top:15px" onclick="activeMissionDetail='daily';activeMission='daily';taskForm()">＋ افزودن برنامه جدید</button>`)}
function missionDetail(){const k=activeMissionDetail,list=state.tasks.filter(t=>(t.period||'daily')===k);return shell(periods[k],`<div class="feature mission-detail-glow"><h3>${periods[k]}؛ صفحهٔ اختصاصی تو</h3><p>برنامه‌ها، تاریخ، ساعت و توضیحات این پارت را خودت وارد کن. هیچ موردی از قبل اضافه نشده.</p></div>${list.length?`<div class="list" style="margin-top:14px">${list.map(taskHTML).join('')}</div>`:`<div class="panel" style="margin-top:14px;text-align:center;color:var(--muted);font-size:12px;line-height:2">در پارت ${periods[k]} هنوز برنامه‌ای ثبت نشده.<br>اولین جزئیات را خودت اضافه کن.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:15px" onclick="taskForm()">＋ افزودن جزئیات به ${periods[k]}</button>`)}
function vision(){if(activeVisionDetail)return visionDetail();const entries=Object.entries(visionPeriods);return shell('ویژن',`<div class="feature"><h3>تصویر آیندهٔ تو؛ پارت‌به‌پارت</h3><p>هر بازه پوشهٔ اختصاصی خودش را دارد. وارد پوشه شو و هدف و تصویرش را فقط خودت ثبت کن.</p></div><div class="folder-list">${entries.map(([k,v],i)=>{const count=state.goals.filter(g=>(g.period||'short')===k).length;return `<button class="folder-row" onclick="activeVision='${k}';activeVisionDetail='${k}';render()"><span class="folder-orb">${['◷','◒','✦'][i]}</span><span class="folder-copy"><strong>${v}</strong><small>پوشهٔ هدف‌ها و تصویرهای ${v}</small></span><span class="folder-count">${toFa(count)} هدف</span><span class="folder-arrow">‹</span></button>`}).join('')}</div><button class="primary" style="width:100%;padding:14px;margin-top:15px" onclick="activeVision='short';activeVisionDetail='short';goalForm()">＋ افزودن هدف به پوشه</button>`)}
function visionDetail(){const k=activeVisionDetail,list=state.goals.filter(g=>(g.period||'short')===k);return shell(visionPeriods[k],`<div class="feature"><h3>پوشهٔ ${visionPeriods[k]}</h3><p>هدف‌ها، تصویرها و توضیحات این بازه را اینجا ثبت و مرور کن.</p></div>${list.length?`<div class="vision-grid" style="margin-top:14px">${list.map(g=>`<button class="vision-card" ${g.image?`style="background-image:url('${esc(g.image)}')"`:''} onclick="goalForm('${g.id}')"><div><strong>${esc(g.title)}</strong><small>${esc(g.note||'')}</small></div></button>`).join('')}</div>`:`<div class="folder-empty" style="margin-top:14px">این پوشه هنوز هدفی ندارد.<br>اولین هدف و تصویر آینده‌ات را خودت اضافه کن.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="goalForm()">＋ افزودن هدف به ${visionPeriods[k]}</button>`)}
function finance(){if(activeFinanceDetail)return financeDetail();const folders=[['overview','خلاصه و درصدبندی','درآمد، مانده و سهم‌های مالی'],['income','درآمدها','ثبت همهٔ درآمدهای شخصی'],['debts','تعهدات و قسط‌ها','بدهی‌ها، قسط‌ها و تسویه‌ها']];return shell('مسیر آزادی',`<div class="feature"><h3>مسیر آزادی؛ پارت‌به‌پارت</h3><p>مدیریت مالی‌ات را در پوشه‌های جدا نگه دار تا هر قسمت را با جزئیات خودت تکمیل کنی.</p></div><div class="folder-list">${folders.map(([k,t,d],i)=>{const n=k==='income'?state.income.length:k==='debts'?state.debts.filter(x=>!x.paid).length:(state.allocations||[]).length;return `<button class="folder-row" onclick="activeFinance='${k}';activeFinanceDetail='${k}';render()"><span class="folder-orb">${['◈','＋','▣'][i]}</span><span class="folder-copy"><strong>${t}</strong><small>${d}</small></span><span class="folder-count">${toFa(n)} مورد</span><span class="folder-arrow">‹</span></button>`}).join('')}</div><div class="export-row" style="margin-top:15px"><button onclick="openReport('finance')">گزارش مالی</button><button onclick="exportReport('finance','pdf')">ساخت PDF</button></div>`)}
function financeDetail(){const total=state.income.reduce((s,x)=>s+num(x.amount),0),pending=state.debts.filter(x=>!x.paid).reduce((s,x)=>s+num(x.amount),0),allocations=state.allocations||[],allocatedPct=allocations.reduce((s,x)=>s+num(x.percent),0),remaining=Math.max(0,100-allocatedPct);let body=activeFinance==='overview'?`<div class="money"><h3>خلاصهٔ مالی من</h3><div class="amount">${money(total)} <small>تومان</small></div><div class="bar"><i style="width:${total?100:0}%"></i></div><small>${total?'درآمد ثبت‌شده':'هنوز درآمدی ثبت نشده'}</small></div><div class="split"><div class="stat"><b>${money(pending)}</b><span>تعهد باز</span></div><div class="stat"><b>${state.debts.length}</b><span>قسط و بدهی</span></div><div class="stat"><b>${money(total-pending)}</b><span>مانده تقریبی</span></div><div class="stat"><b>${state.income.length}</b><span>درآمدها</span></div></div><div class="panel" style="margin-top:12px"><div class="section-head" style="margin-top:0"><h2>تقسیم درآمد</h2><button onclick="allocationForm()">＋ افزودن سهم</button></div>${allocations.length?`<div class="list">${allocations.map(a=>{const pct=num(a.percent),amount=Math.round(total*pct/100);return `<div class="task"><span class="task-emoji">◈</span><span class="task-info"><span class="task-name">${esc(a.name)}</span><span class="task-time">${toFa(pct)}٪ از درآمد · ${money(amount)} تومان</span></span></div>`}).join('')}</div><div class="feature" style="margin-top:11px"><p>جمع درصدها: ${toFa(allocatedPct)}٪ · باقی‌مانده: ${toFa(remaining)}٪</p></div>`:`<div class="folder-empty">هنوز سهمی تعریف نشده.<br>دسته‌ها و درصدهای دلخواهت را خودت اضافه کن.</div>`}<button class="gold-btn" style="width:100%;padding:13px;margin-top:12px" onclick="allocationForm()">＋ تعریف درصد جدید</button></div>`:activeFinance==='income'?`<div class="section-head"><h2>درآمدهای من</h2><button onclick="incomeForm()">＋ افزودن</button></div>${state.income.length?`<div class="list">${state.income.map(x=>`<div class="task"><span class="task-emoji">＋</span><span class="task-info"><span class="task-name">${esc(x.source||'درآمد')}</span><span class="task-time">${esc(x.date?jalaliDisplay(x.date):'بدون تاریخ')}</span></span><b style="color:#0b8d86">${money(x.amount)} تومان</b></div>`).join('')}</div>`:`<div class="folder-empty">هنوز درآمدی ثبت نشده.<br>اولین درآمدت را خودت وارد کن.</div>`}<button class="gold-btn" style="width:100%;padding:13px;margin-top:14px" onclick="incomeForm()">＋ ثبت درآمد</button>`:`<div class="section-head"><h2>تعهدات و قسط‌ها</h2><button onclick="debtForm()">＋ افزودن</button></div>${state.debts.length?`<div class="list">${state.debts.map(d=>`<button class="task ${d.paid?'done':''}" onclick="toggleDebt('${d.id}')"><span class="check">✓</span><span class="task-info"><span class="task-name">${esc(d.title)}</span><span class="task-time">در وجه ${esc(d.payee||'')} · ${esc(d.due?jalaliDisplay(d.due):'بدون تاریخ')}</span></span><b style="color:${d.paid?'#0b8d86':'#c55a42'}">${money(d.amount)}</b></button>`).join('')}</div>`:`<div class="folder-empty">این پوشه فعلاً خالی است.<br>مواردی که خودت وارد می‌کنی اینجا قرار می‌گیرند.</div>`}<button class="primary" style="width:100%;padding:13px;margin-top:14px" onclick="debtForm()">＋ ثبت بدهی یا قسط</button>`;return shell(activeFinance==='overview'?'خلاصهٔ مالی':activeFinance==='income'?'درآمدها':'تعهدات و قسط‌ها',`<div class="pillbar"><button class="pill ${activeFinance==='overview'?'active':''}" onclick="activeFinance='overview';render()">خلاصه</button><button class="pill ${activeFinance==='income'?'active':''}" onclick="activeFinance='income';render()">درآمد</button><button class="pill ${activeFinance==='debts'?'active':''}" onclick="activeFinance='debts';render()">تعهدات</button></div>${body}<div class="export-row"><button onclick="openReport('finance')">گزارش متنی</button><button onclick="exportReport('finance','pdf')">چاپ / PDF</button></div>`)}
function memoryFolderNames(){const names=[...(state.memoryFolders||[]).map(f=>typeof f==='string'?f:f.name),...state.memories.map(m=>(m.part||'بدون پارت').trim()||'بدون پارت')].filter(Boolean);return [...new Set(names)]}
function memories(){if(activeMemory)return shell('خاطره',memoryReader());if(activeMemoryFolder!==null)return memoryFolderDetail();const names=memoryFolderNames();return shell('خاطرات قشنگ',`<div class="feature"><h3>خاطراتت را مثل نامه، پارت‌به‌پارت نگه دار</h3><p>هر پوشه می‌تواند نام و حال‌وهوای خودش را داشته باشد؛ متن خاطره داخل خود برنامه مثل نامه باز می‌شود.</p></div><div class="folder-list">${names.length?names.map((name,i)=>{const count=state.memories.filter(m=>(m.part||'بدون پارت')===name).length;return `<button class="folder-row" onclick="activeMemoryFolder=${JSON.stringify(name)};render()"><span class="folder-orb">${['✉','❖','♡'][i%3]}</span><span class="folder-copy"><strong>${esc(name)}</strong><small>پوشهٔ خاطرات شخصی تو</small></span><span class="folder-count">${toFa(count)} خاطره</span><span class="folder-arrow">‹</span></button>`}).join(''):`<div class="folder-empty">هنوز پوشه‌ای ساخته نشده.<br>اولین پارت خاطراتت را خودت ایجاد کن.</div>`}</div><button class="primary" style="width:100%;padding:14px;margin-top:15px" onclick="memoryFolderForm()">＋ ساخت پوشهٔ خاطرات</button><div class="export-row"><button onclick="openReport('memory')">گزارش متنی</button><button onclick="exportReport('memory','pdf')">ساخت PDF</button></div>`)}
function memoryFolderDetail(){const name=activeMemoryFolder,list=state.memories.filter(m=>(m.part||'بدون پارت')===name);return shell(name,`<div class="feature"><h3>پوشهٔ ${esc(name)}</h3><p>خاطرات این پارت را با تاریخ، عنوان و متن نامه‌ای خودت ثبت کن.</p></div>${list.length?`<div class="list" style="margin-top:14px">${list.slice().reverse().map(m=>`<button class="task" onclick="activeMemory='${m.id}';render()"><span class="task-emoji">✉</span><span class="task-info"><span class="task-name">${esc(m.title)}</span><span class="task-time">${esc(m.date?jalaliDisplay(m.date):'بدون تاریخ')}</span></span><span>›</span></button>`).join('')}</div>`:`<div class="folder-empty" style="margin-top:14px">این پوشه هنوز خاطره‌ای ندارد.<br>اولین نامه‌ات را خودت ثبت کن.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="memoryForm(${JSON.stringify(name)})">＋ ثبت خاطره در این پوشه</button>`)}
function memoryReader(){const m=state.memories.find(x=>x.id===activeMemory);if(!m){activeMemory=null;return ''}return `<article class="panel" style="margin-top:13px;line-height:2"><small style="color:var(--muted)">${esc(m.date?jalaliDisplay(m.date):'بدون تاریخ')} · ${esc(m.part||'بدون پارت')}</small><h2 style="font-size:24px;margin:9px 0 14px;color:var(--deep)">${esc(m.title)}</h2><p style="white-space:pre-wrap;font-size:13px">${esc(m.body)}</p></article><div class="export-row"><button onclick="openReport('memory')">خروجی متنی</button><button onclick="exportReport('memory','pdf')">چاپ / PDF</button></div>`}
function self(){if(activeSelfDetail)return selfDetail();const labels=[['good','اخلاق‌های خوب','توانمندی‌ها و رفتارهای سازنده'],['bad','اخلاق‌های بد','چیزهایی که می‌خواهی اصلاح کنی'],['targets','عادت‌های هدف','نسخه‌ای که می‌خواهی بسازی']];return shell('خودشناسی',`<div class="feature"><h3>خودشناسی؛ پارت‌به‌پارت</h3><p>هر موضوع پوشهٔ خودش را دارد. واردش شو و فقط نوشته‌ها و عادت‌های خودت را ثبت کن.</p></div><div class="folder-list">${labels.map(([k,t,d],i)=>`<button class="folder-row" onclick="activeSelf='${k}';activeSelfDetail='${k}';render()"><span class="folder-orb">${['✦','◌','🌿'][i]}</span><span class="folder-copy"><strong>${t}</strong><small>${d}</small></span><span class="folder-count">${toFa((state.self[k]||[]).length)} مورد</span><span class="folder-arrow">‹</span></button>`).join('')}</div><div class="export-row"><button onclick="openReport('self')">گزارش متنی</button><button onclick="exportReport('self','pdf')">ساخت PDF</button></div>`)}
function selfDetail(){const labels={good:'اخلاق‌های خوب',bad:'اخلاق‌های بد',targets:'عادت‌های هدف'},arr=state.self[activeSelf]||[];return shell(labels[activeSelf],`<div class="feature"><h3>پوشهٔ ${labels[activeSelf]}</h3><p>این قسمت فقط با نوشته‌ها و پیگیری روزانهٔ خودت کامل می‌شود.</p></div>${arr.length?`<div class="list" style="margin-top:14px">${arr.map(x=>`<div class="task"><span class="task-emoji">🌿</span><span class="task-info"><span class="task-name">${esc(x.text)}</span><span class="task-time">ثبت‌شده توسط خودت</span></span></div>`).join('')}</div>`:`<div class="folder-empty" style="margin-top:14px">این پوشه هنوز چیزی ندارد.<br>اولین مورد را خودت بنویس.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="selfForm()">＋ افزودن به ${labels[activeSelf]}</button><div class="export-row"><button onclick="openReport('self')">گزارش متنی</button><button onclick="exportReport('self','pdf')">ساخت PDF</button></div>`)}
function couple(){if(activeCoupleDetail)return coupleDetail();const labels={goals:'اهداف ما',memories:'خاطرات ما',myGood:'خوبی‌های من',myBad:'بدی‌های من',partnerGood:'خوبی‌های پارتنر',partnerBad:'بدی‌های پارتنر',habits:'عادت‌های رابطه'},entries=Object.entries(labels);return shell('ما ♥',`<div class="couple"><h3>مسیر مشترک ما؛ پارت‌به‌پارت</h3><p>هر موضوع پوشهٔ خودش را دارد. واردش شوید و اطلاعات رابطه را فقط خودتان وارد کنید.</p></div><div class="folder-list">${entries.map(([k,v],i)=>`<button class="folder-row" onclick="activeCouple='${k}';activeCoupleDetail='${k}';render()"><span class="folder-orb">${['♥','✉','✦','◌','♡','◍','∞'][i]}</span><span class="folder-copy"><strong>${v}</strong><small>پوشهٔ اختصاصی ${v}</small></span><span class="folder-count">${toFa((state.couple[k]||[]).length)} مورد</span><span class="folder-arrow">‹</span></button>`).join('')}<button class="folder-row" onclick="activeCoupleDetail='analysis';render()"><span class="folder-orb">◉</span><span class="folder-copy"><strong>تحلیل کلی رابطه</strong><small>جمع‌بندی همهٔ پوشه‌های رابطه</small></span><span class="folder-count">${toFa(Object.values(state.couple).reduce((n,a)=>n+a.length,0))} مورد</span><span class="folder-arrow">‹</span></button></div>`)}
function coupleDetail(){const labels={goals:'اهداف ما',memories:'خاطرات ما',myGood:'خوبی‌های من',myBad:'بدی‌های من',partnerGood:'خوبی‌های پارتنر',partnerBad:'بدی‌های پارتنر',habits:'عادت‌های رابطه'};if(activeCoupleDetail==='analysis'){const total=Object.values(state.couple).reduce((n,a)=>n+a.length,0);return shell('تحلیل کلی رابطه',`<div class="feature"><h3>تحلیل مسیر مشترک شما</h3><p>این تحلیل از اطلاعاتی ساخته می‌شود که خودتان در پوشه‌های رابطه ثبت کرده‌اید.</p></div><div class="panel" style="margin-top:14px;font-size:13px;line-height:2;text-align:center">${total?`تا اینجا ${toFa(total)} مورد در پوشه‌های رابطه ثبت شده است. برای تحلیل کامل‌تر، هر دو نفر اطلاعات بیشتری وارد کنید.`:'هنوز اطلاعاتی برای تحلیل رابطه ثبت نشده است.'}</div><div class="export-row"><button onclick="openReport('couple')">گزارش متنی</button><button onclick="exportReport('couple','pdf')">ساخت PDF</button></div>`)}const arr=state.couple[activeCouple]||[];return shell(labels[activeCouple],`<div class="feature"><h3>پوشهٔ ${labels[activeCouple]}</h3><p>هر چیزی مربوط به این بخش را با جزئیات خودتان ثبت کنید.</p></div>${arr.length?`<div class="list" style="margin-top:14px">${arr.map(x=>`<div class="task"><span class="task-emoji">♥</span><span class="task-info"><span class="task-name">${esc(x.text)}</span><span class="task-time">${esc(x.date||'ثبت‌شده توسط شما')}</span></span></div>`).join('')}</div>`:`<div class="folder-empty" style="margin-top:14px">این پوشه هنوز چیزی ندارد.<br>اطلاعات را خودتان اضافه کنید.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="coupleForm()">＋ افزودن به ${labels[activeCouple]}</button>`)}
function noteFolderNames(){const names=[...(state.noteFolders||[]).map(f=>typeof f==='string'?f:f.name),...(state.notes||[]).map(n=>(n.folder||'بدون پوشه').trim()||'بدون پوشه')].filter(Boolean);return [...new Set(names)]}

function incomeForm(){form('ثبت درآمد',`<div class="field"><label>مبلغ به تومان</label><input id="iAmount" inputmode="numeric" placeholder="مبلغ را وارد کن" required></div><div class="field"><label>منبع درآمد</label><input id="iSource" placeholder="منبع را وارد کن"></div><div class="field"><label>تاریخ</label>${dateInput('iDate')}</div>`,()=>{state.income.unshift({id:id(),amount:num(val('iAmount')),source:val('iSource'),date:dateVal('iDate')});save();closeModal();render()})}function debtForm(){form('ثبت بدهی یا قسط',`<div class="field"><label>توضیح بدهی یا قسط</label><input id="dTitle" placeholder="توضیح را وارد کن" required></div><div class="field"><label>در وجه</label><input id="dPayee" placeholder="نام شخص، بانک یا اپلیکیشن"></div><div class="field"><label>مبلغ به تومان</label><input id="dAmount" inputmode="numeric" placeholder="مبلغ را وارد کن" required></div><div class="field"><label>تاریخ تسویه</label>${dateInput('dDue')}</div>`,()=>{state.debts.unshift({id:id(),title:val('dTitle'),payee:val('dPayee'),amount:num(val('dAmount')),due:dateVal('dDue'),paid:false});save();closeModal();render()})}
function memoryFolderForm(){form('ساخت پوشهٔ خاطرات',`<div class="field"><label>نام پوشه یا پارت</label><input id="folderName" placeholder="مثلاً سفرها، خانواده، سال ۱۴۰۵" required></div>`,()=>{const name=val('folderName');if(!name)return;if(!state.memoryFolders)state.memoryFolders=[];if(!state.memoryFolders.some(f=>(typeof f==='string'?f:f.name)===name)){state.memoryFolders.push({id:id(),name});save()}activeMemoryFolder=name;closeModal();render()})}function memoryForm(prefillPart=''){form('ثبت خاطره به شکل نامه',`<div class="field"><label>عنوان خاطره</label><input id="mTitle" placeholder="عنوان را وارد کن" required></div><div class="field"><label>تاریخ</label>${dateInput('mDate')}</div><div class="field"><label>نام پارت</label><input id="mPart" value="${esc(prefillPart)}" placeholder="نام پارت را خودت انتخاب کن"></div><div class="field"><label>متن خاطره</label><textarea id="mBody" placeholder="متن خاطره را اینجا بنویس" required></textarea></div>`,()=>{const part=val('mPart')||'بدون پارت';state.memories.unshift({id:id(),title:val('mTitle'),date:dateVal('mDate'),part,body:val('mBody')});if(part&&!memoryFolderNames().includes(part)){if(!state.memoryFolders)state.memoryFolders=[];state.memoryFolders.push({id:id(),name:part})}activeMemoryFolder=part;save();closeModal();render()})}function noteFolderForm(){form('ساخت پوشهٔ دفترچه',`<div class="field"><label>نام پوشه</label><input id="noteFolderName" placeholder="مثلاً اخلاقی، آموزشی، درس‌ها یا ایده‌ها" required></div>`,()=>{const name=val('noteFolderName');if(!name)return;if(!state.noteFolders)state.noteFolders=[];if(!state.noteFolders.some(f=>(typeof f==='string'?f:f.name)===name))state.noteFolders.push({id:id(),name});activeNoteFolder=name;save();closeModal();render()})}function noteForm(prefillFolder=''){form('افزودن نکته به دفترچه',`<div class="field"><label>عنوان نکته</label><input id="nTitle" placeholder="عنوان را خودت بنویس" required></div><div class="field"><label>پوشه</label><input id="nFolder" value="${esc(prefillFolder)}" placeholder="نام پوشه را وارد کن" required></div><div class="field"><label>تاریخ</label>${dateInput('nDate')}</div><div class="field"><label>متن نکته</label><textarea id="nBody" placeholder="نکته، درس یا چیزی که یاد گرفتی را بنویس" required></textarea></div>`,()=>{const folder=val('nFolder')||'بدون پوشه';if(!state.notes)state.notes=[];state.notes.unshift({id:id(),title:val('nTitle'),folder,date:dateVal('nDate'),body:val('nBody')});if(!noteFolderNames().includes(folder)){if(!state.noteFolders)state.noteFolders=[];state.noteFolders.push({id:id(),name:folder})}activeNoteFolder=folder;save();closeModal();render()})}function eventForm(existing){const e=state.events.find(x=>x.id===existing)||{};form('نام‌گذاری یک روز خاص',`<div class="field"><label>اسم روز</label><input id="eTitle" value="${esc(e.title||'')}" placeholder="اسم روز را وارد کن" required></div><div class="field"><label>تاریخ</label>${dateInput('eDate',e.date||'')}</div><div class="field"><label>توضیح</label><textarea id="eNote" placeholder="توضیح اختیاری">${esc(e.note||'')}</textarea></div>`,()=>{const o={id:e.id||id(),title:val('eTitle'),date:dateVal('eDate'),note:val('eNote')};if(e.id)state.events=state.events.map(x=>x.id===e.id?o:x);else state.events.unshift(o);save();closeModal();render()})}
function selfForm(){activeSelfDetail=activeSelf;form('افزودن به خودشناسی',`<div class="field"><label>متن</label><textarea id="sText" placeholder="خودت بنویس" required></textarea></div>`,()=>{state.self[activeSelf].unshift({id:id(),text:val('sText')});save();closeModal();render()})}function coupleForm(){activeCoupleDetail=activeCouple;form('افزودن به رابطه',`<div class="field"><label>متن</label><textarea id="cText" placeholder="خودتان بنویسید" required></textarea></div><div class="field"><label>تاریخ</label>${dateInput('cDate')}</div>`,()=>{state.couple[activeCouple].unshift({id:id(),text:val('cText'),date:dateVal('cDate')});save();closeModal();render()})}function saveProfile(){state.profileName=val('profileName');save();showToast('پروفایل ذخیره شد');render()}
function reportTitle(kind){return kind==='finance'?'گزارش مالی NEVo':kind==='memory'?'خاطرهٔ NEVo':kind==='self'?'گزارش خودشناسی NEVo':kind==='couple'?'تحلیل رابطه NEVo':kind==='notes'?'دفترچه نکات NEVo':'گزارش کامل NEVo'}
function reportText(title,kind='all'){const out=[title,'NEVo — نسخهٔ جدید ما','تاریخ: '+faDate,''];if(kind==='all'||kind==='tasks'){out.push('برنامه‌ها: '+state.tasks.length);state.tasks.forEach((t,i)=>out.push((i+1)+'. '+(t.title||'بدون عنوان')+' | '+(t.date?jalaliDisplay(t.date):'بدون تاریخ')+' | '+(t.done?'انجام شد':'انجام نشده')));out.push('')}if(kind==='all'||kind==='vision'){out.push('هدف‌ها: '+state.goals.length);state.goals.forEach((g,i)=>out.push((i+1)+'. '+(g.title||'بدون عنوان')+' | '+(g.note||'بدون توضیح')));out.push('')}if(kind==='all'||kind==='finance'){out.push('درآمدها: '+state.income.length,'تعهدات: '+state.debts.length,'');out.push('ردیف | عنوان | در وجه | مبلغ | وضعیت');out.push(state.debts.length?state.debts.map((d,i)=>(i+1)+' | '+(d.title||'—')+' | '+(d.payee||'—')+' | '+money(d.amount)+' تومان | '+(d.paid?'تسویه شد':'تسویه نشده')).join('\n'):'—');out.push('مجموع تعهدات باز: '+money(state.debts.filter(d=>!d.paid).reduce((s,d)=>s+num(d.amount),0))+' تومان','')}if(kind==='all'||kind==='memory'){out.push('خاطرات: '+state.memories.length);state.memories.forEach((m,i)=>out.push((i+1)+'. '+(m.title||'بدون عنوان')+' | '+(m.date?jalaliDisplay(m.date):'بدون تاریخ')));out.push('')}if(kind==='all'||kind==='notes'){out.push('دفترچه نکات: '+(state.notes||[]).length);(state.notes||[]).forEach((n,i)=>out.push((i+1)+'. '+(n.title||'بدون عنوان')+' | '+(n.folder||'بدون پوشه')+' | '+(n.body||'')));out.push('')}if(kind==='self'){const all=Object.values(state.self).flat();out.push('گزارش خودشناسی: '+all.length);all.forEach((x,i)=>out.push((i+1)+'. '+(x.text||'')));out.push('')}if(kind==='couple'){const all=Object.values(state.couple).flat();out.push('گزارش رابطه: '+all.length);all.forEach((x,i)=>out.push((i+1)+'. '+(x.text||'')));out.push('')}return out.join('\n')}
function reportHtml(title,text){return '<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>@page{size:A4;margin:16mm}*{box-sizing:border-box}body{font-family:"BYekan","Vazirmatn","IRANSans",Tahoma,sans-serif;color:#173f41;direction:rtl;padding:0;margin:0}h1{font-size:24px;color:#066662;margin:0 0 8px;font-weight:900;border-bottom:2px solid #20a99e;padding-bottom:10px}.meta{font-size:11px;color:#6f8884;margin-bottom:16px}pre{font:600 13px/2.1 "BYekan","Vazirmatn","IRANSans",Tahoma,sans-serif;white-space:pre-wrap;word-break:break-word}</style></head><body><h1>'+esc(title)+'</h1><div class="meta">NEVo · گزارش شخصی</div><pre>'+esc(text)+'</pre></body></html>'}
function openReport(kind){const title=reportTitle(kind),text=reportText(title,kind);modal.innerHTML=`<div class="sheet report-sheet"><div class="sheet-head"><h2 class="report-card-title">${esc(title)}</h2><button class="report-close" type="button" onclick="closeModal()">×</button></div><article class="report-document"><h1>${esc(title)}</h1><div class="report-meta">گزارش ساخته‌شده از اطلاعاتی که خودت وارد کرده‌ای · ${esc(faDate)}</div><pre>${esc(text)}</pre></article><div class="export-row"><button onclick="exportReport('${kind}','doc')">ذخیره متن</button><button onclick="exportReport('${kind}','pdf')">ساخت PDF</button></div></div>`;modal.classList.add('show')}
function exportReport(kind,type){const title=reportTitle(kind),text=reportText(title,kind);if(type==='doc'){if(window.NEVoAndroid&&NEVoAndroid.saveTextFile){NEVoAndroid.saveTextFile('NEVo-'+kind+'-report.doc',text,'application/msword');showToast('گزارش متنی در دانلود ذخیره می‌شود')}else{const b=new Blob([text],{type:'application/msword;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='NEVo-'+kind+'-report.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}}else{if(window.NEVoAndroid&&NEVoAndroid.savePdf){NEVoAndroid.savePdf(title,reportHtml(title,text));showToast('در حال ساخت PDF با فونت فارسی…')}else{openReport(kind);showToast('برای ساخت PDF باید داخل نسخهٔ اندروید استفاده شود')}}}
$('#addBtn').onclick=()=>state.view==='mission'?taskForm():state.view==='vision'?goalForm():state.view==='calendar'?eventForm():state.view==='finance'?incomeForm():state.view==='memories'?memoryForm(activeMemoryFolder||''):state.view==='notes'?noteForm(activeNoteFolder||''):state.view==='self'?selfForm():state.view==='couple'?coupleForm():taskForm();document.querySelectorAll('.nav[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.querySelector('#datePicker').addEventListener('click',e=>{if(e.target.id==='datePicker')closeDatePicker()});render();
</script>
</body></html>
