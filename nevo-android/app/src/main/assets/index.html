.calendar-card,.panel,.stat,.task,.cloud-card,.voice-card,.weight-card,.poetry-card,.ai-card,.report-document{box-shadow:var(--shadow)!important;border-color:var(--line)!important}.task{background:#fff!important}.task.done{background:#f4fbf9!important}.money{box-shadow:var(--shadow)!important}.modal{background:#1e383855!important}.sheet{box-shadow:0 -10px 30px rgba(31,61,61,.16)!important}
.ai-card{background:#fff!important}.ai-msg.assistant{background:#fafcfc!important;border-color:var(--line)!important}.ai-msg.user{background:#e7f5f2!important}.ai-quick button{background:#fff!important;box-shadow:0 2px 8px rgba(31,61,61,.06)!important;border-color:var(--line)!important}.ai-send{background:var(--teal)!important;box-shadow:none!important}.ai-online{background:#f2f8f7!important}.feature{display:block!important;background:#f7fbfa!important}

<body>
<div class="app" id="app">
  <main class="screen" id="screen"></main>
  <nav class="bottom" id="bottom">
    <button class="nav active" data-view="home"><i>⌂</i><span>خانه</span></button>
    <button class="nav" data-view="calendar"><i>◫</i><span>تقویم</span></button>
    <button class="nav plus" id="addBtn">＋<span>افزودن</span></button>
    <button class="nav" data-view="reports"><i>⌁</i><span>گزارش‌ها</span></button>
    <button class="nav" data-view="profile"><i>♙</i><span>پروفایل</span></button>
  </nav>
</div>
<div class="modal" id="modal"></div>
<div class="date-picker" id="datePicker"></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), screen=$('#screen'), modal=$('#modal'), toast=$('#toast');
const KEY='nevo.local.v3';
const blank=()=>({view:'home',history:['home'],tasks:[],goals:[],income:[],allocations:[],debts:[],memories:[],events:[],memoryFolders:[],noteFolders:[],notes:[],voiceSessions:[],moodEntries:[],aiChats:[],aiMemory:[],weightEntries:[],poems:[],profileName:'',self:{good:[],bad:[],targets:[]},couple:{goals:[],memories:[],myGood:[],myBad:[],partnerGood:[],partnerBad:[],habits:[]}});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');const b=blank();if(!x)return b;return {...b,...x,history:Array.isArray(x.history)&&x.history.length?x.history:['home'],tasks:Array.isArray(x.tasks)?x.tasks:[],goals:Array.isArray(x.goals)?x.goals:[],income:Array.isArray(x.income)?x.income:[],allocations:Array.isArray(x.allocations)?x.allocations:[],debts:Array.isArray(x.debts)?x.debts:[],memories:Array.isArray(x.memories)?x.memories:[],events:Array.isArray(x.events)?x.events:[],memoryFolders:Array.isArray(x.memoryFolders)?x.memoryFolders:[],noteFolders:Array.isArray(x.noteFolders)?x.noteFolders:[],notes:Array.isArray(x.notes)?x.notes:[],moodEntries:Array.isArray(x.moodEntries)?x.moodEntries:[],aiChats:Array.isArray(x.aiChats)?x.aiChats:[],aiMemory:Array.isArray(x.aiMemory)?x.aiMemory:[],self:{...b.self,...x.self},couple:{...b.couple,...x.couple}}}catch(e){return blank()}}
const state=load(), periods={daily:'روزانه',weekly:'هفتگی',monthly:'ماهانه'}, visionPeriods={short:'کوتاه‌مدت',mid:'میان‌مدت',long:'بلندمدت'};let activeMission='daily',activeMissionDetail=null,activeVision='short',activeVisionDetail=null,activeFinance='overview',activeFinanceDetail=null,activeSelf='good',activeSelfDetail=null,activeCouple='goals',activeCoupleDetail=null,activeMemory=null,activeMemoryFolder=null,activeNote=null,activeNoteFolder=null,calendarDate=new Date();
const today=new Date(), faDate=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(today), faWeekDays=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toFa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function num(v){return Number(String(v||'').replace(/[^\d.]/g,''))||0}function money(n){return new Intl.NumberFormat('fa-IR').format(n||0)}function val(id){return ($('#'+id)?.value||'').trim()}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.nevoToast);window.nevoToast=setTimeout(()=>toast.classList.remove('show'),2300)}
const jalaliMonthNames=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],jalaliWeekNames=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
function jalaliToGregorian(jy,jm,jd){jy+=1595;let days=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186),gy=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1,md=[0,31,28,31,30,31,30,31,31,30,31,30,31],leap=(gy%4===0&&gy%100!==0)||gy%400===0;if(leap)md[2]=29;let gm=1;while(gm<=12&&gd>md[gm])gd-=md[gm++];return [gy,gm,gd]}
function gregorianToJalali(gy,gm,gd){let gdm=[0,31,59,90,120,151,181,212,243,273,304,334],gy2=gm>2?gy+1:gy,days=355666+365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)+gd+gdm[gm-1],jy=-1595+33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30),jd=1+(days<186?days%31:(days-186)%30);return {jy,jm,jd}}
function jalaliMonthDays(y,m){if(m<=6)return 31;if(m<=11)return 30;const a=jalaliToGregorian(y,m,1),b=jalaliToGregorian(y+1,1,1);return Math.round((new Date(...[b[0],b[1]-1,b[2]])-new Date(...[a[0],a[1]-1,a[2]]))/86400000)}
function jalaliFromIso(iso){if(!iso||!/^(\d{4})-(\d{2})-(\d{2})$/.test(iso))return null;const [y,m,d]=iso.split('-').map(Number);return gregorianToJalali(y,m,d)}
function isoFromJalali(y,m,d){const [gy,gm,gd]=jalaliToGregorian(y,m,d);return `${gy}-${String(gm).padStart(2,'0')}-${String(gd).padStart(2,'0')}`}
function jalaliDisplay(iso){const p=jalaliFromIso(iso);return p?`${toFa(p.jy)}/${toFa(String(p.jm).padStart(2,'0'))}/${toFa(String(p.jd).padStart(2,'0'))}`:''}
function dateInput(id,iso=''){return `<input id="${id}" class="date-input" type="text" readonly value="${esc(jalaliDisplay(iso))}" data-iso="${esc(iso||'')}" placeholder="تاریخ شمسی را انتخاب کن" onclick="openJalaliPicker('${id}')">`}
function dateVal(id){return $('#'+id)?.dataset.iso||''}
let pickerTarget='',picker={jy:1405,jm:1,jd:1};
function openJalaliPicker(id){pickerTarget=id;const input=$('#'+id),iso=input?.dataset.iso||'',d=iso?new Date(iso+'T12:00:00'):new Date(),p=gregorianToJalali(d.getFullYear(),d.getMonth()+1,d.getDate());picker={jy:p.jy,jm:p.jm,jd:p.jd};renderJalaliPicker()}
function renderJalaliPicker(){const targetIso=isoFromJalali(picker.jy,picker.jm,picker.jd),first=jalaliToGregorian(picker.jy,picker.jm,1),offset=(new Date(first[0],first[1]-1,first[2]).getDay()+1)%7,days=jalaliMonthDays(picker.jy,picker.jm),cells=[];for(let i=0;i<offset;i++)cells.push('<span></span>');for(let d=1;d<=days;d++){const iso=isoFromJalali(picker.jy,picker.jm,d);cells.push(`<button type="button" class="${iso===targetIso?'selected':''}" onclick="pickJalaliDay(${d})">${toFa(d)}</button>`)}document.querySelector('#datePicker').innerHTML=`<div class="date-picker-sheet"><div class="date-picker-head"><button type="button" onclick="shiftJalaliMonth(-1)">‹</button><strong>${jalaliMonthNames[picker.jm-1]} ${toFa(picker.jy)}</strong><button type="button" onclick="shiftJalaliMonth(1)">›</button></div><div class="jalali-week">${jalaliWeekNames.map(x=>`<span>${x}</span>`).join('')}</div><div class="jalali-days">${cells.join('')}</div><div class="date-picker-actions"><button type="button" onclick="closeDatePicker()">انصراف</button><button type="button" class="primary-date" onclick="confirmJalaliDate()">انتخاب تاریخ</button></div></div>`;document.querySelector('#datePicker').classList.add('show')}
function shiftJalaliMonth(delta){picker.jm+=delta;if(picker.jm<1){picker.jm=12;picker.jy--}if(picker.jm>12){picker.jm=1;picker.jy++}picker.jd=Math.min(picker.jd,jalaliMonthDays(picker.jy,picker.jm));renderJalaliPicker()}
function pickJalaliDay(day){picker.jd=day;renderJalaliPicker()}
function closeDatePicker(){document.querySelector('#datePicker').classList.remove('show');pickerTarget=''}
function confirmJalaliDate(){if(!pickerTarget)return;const input=$('#'+pickerTarget),iso=isoFromJalali(picker.jy,picker.jm,picker.jd);if(input){input.dataset.iso=iso;input.value=jalaliDisplay(iso)}closeDatePicker()}

function nav(){document.querySelectorAll('.nav[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view))}function shell(title,body){return `<div class="subpage"><div class="top"><div class="back-title"><button class="back" onclick="backOne()">‹</button><h1 class="page-title">${title}</h1></div><button class="icon-btn" onclick="showToast('این فضا برای نوشته‌های خودت آماده است')">⋮</button></div>${body}</div>`}
function home(){const total=state.tasks.length,done=state.tasks.filter(t=>t.done||t[3]).length,p=total?Math.round(done*100/total):0;return `<div class="top"><button class="icon-btn" onclick="showToast('منوی سریع آمادهٔ شخصی‌سازی است')">☰</button><div class="brand"><img src="assets/nevo-logo.jpg" alt="NEVo">NEVo</div><button class="icon-btn" onclick="showToast('اعلانی ثبت نشده')">♧</button></div><section class="hero feature-board"><img class="hero-logo" src="assets/nevo-logo.jpg" alt="NEVo"><h1 class="hello">${state.profileName?'سلام '+esc(state.profileName):'سلام'}</h1><p class="sub">هر روز یک قدم به نسخهٔ بهتر خودت نزدیک‌تر شو…</p><div class="quote"><b>✦</b><span>این فضا را با برنامه‌ها و هدف‌های خودت بساز</span><span style="margin-right:auto">›</span></div><div class="date-row"><strong>${faDate}</strong><span>☼ روز خوبی داشته باشی</span></div></section><div class="section-head"><h2>مسیرهای رشد</h2><button onclick="go('reports')">گزارش‌ها</button></div><div class="grid"><button class="tile" onclick="go('mission')"><span class="ico">🎯</span><strong>ماموریت</strong><small>برنامه و اجرای مسیر</small></button><button class="tile" onclick="go('vision')"><span class="ico">⛰</span><strong>ویژن</strong><small>تصویر آیندهٔ من</small></button><button class="tile" onclick="go('finance')"><span class="ico">🪙</span><strong>مسیر آزادی</strong><small>آرامش مالی</small></button><button class="tile" onclick="go('memories')"><span class="ico">📷</span><strong>خاطرات قشنگ</strong><small>لحظه‌های ارزشمند</small></button><button class="tile" onclick="go('self')"><span class="ico">🌿</span><strong>خودشناسی</strong><small>رشد فردی</small></button><button class="tile ai-tile" onclick="go('companion')"><span class="ico">🧭</span><strong>همراه محمد</strong><small>گفت‌وگو و آرامش</small></button><button class="tile" onclick="go('couple')"><span class="ico">♥</span><strong>ما</strong><small>رابطه و احساسات</small></button><button class="tile" onclick="go('notes')"><span class="ico">📒</span><strong>دفترچه نکات</strong><small>یادگیری‌های من</small></button><button class="tile" onclick="go('cloud')"><span class="ico">☁️</span><strong>فضای ابری</strong><small>پشتیبان امن اطلاعات</small></button><button class="tile" onclick="go('voice')"><span class="ico">🎙️</span><strong>استودیو ویس</strong><small>صدای شخصی من</small></button><button class="tile" onclick="go('balance')"><span class="ico">⚖️</span><strong>تعادل وزن</strong><small>بدن و انرژی من</small></button><button class="tile" onclick="go('poetry')"><span class="ico">✍️</span><strong>شعر آهنگ</strong><small>دفتر شعرهای من</small></button></div><div class="section-head"><h2>پیشرفت امروز</h2><button onclick="go('mission')">جزئیات ›</button></div><div class="progress-card"><div class="ring" style="--progress:${p}%"><b>${toFa(p)}٪</b></div><div class="progress-meta"><strong>${total?'پیشرفت برنامه‌ها':'شروع مسیر شخصی تو'}</strong><span>${total?`${toFa(done)} برنامه از ${toFa(total)} انجام شده`:'هنوز برنامه‌ای ثبت نشده؛ اولین مورد را خودت اضافه کن.'}</span></div></div>`}
function faParts(d){const ps=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).formatToParts(d);return Object.fromEntries(ps.map(x=>[x.type,x.value]))}function sameDay(a,b){return a.toDateString()===b.toDateString()}function moveMonth(n){calendarDate.setDate(calendarDate.getDate()+n*32);render()}
function calendarMarkup(){const cur=faParts(calendarDate),first=new Date(calendarDate);let g=0;while(!/^۱$|^1$/.test(faParts(first).day)&&g++<35)first.setDate(first.getDate()-1);const offset=(first.getDay()+1)%7,cells=Array.from({length:offset},()=>'<div class="day muted"></div>');for(let i=0;i<42-offset;i++){const d=new Date(first);d.setDate(first.getDate()+i);const p=faParts(d),muted=p.month!==cur.month||p.year!==cur.year,key=d.toISOString().slice(0,10),has=state.events.some(e=>e.date===key),cls=['day',muted?'muted':'',sameDay(d,new Date())?'today':'',has?'has-event':''].filter(Boolean).join(' ');cells.push(`<div class="${cls}" title="${esc(p.weekday)}">${p.day}</div>`)}return `<div class="calendar-card"><div class="month-head"><button class="arrow" onclick="moveMonth(-1)">‹</button><strong>${new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'long',year:'numeric'}).format(calendarDate)}</strong><button class="arrow" onclick="moveMonth(1)">›</button></div><div class="week">${faWeekDays.map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells.join('')}</div><div style="margin-top:12px;text-align:center;color:#6f8884;font-size:11px">امروز: ${cur.weekday}، ${cur.day} ${cur.month}</div></div>`}
function calendar(){return shell('تقویم',`<div class="pillbar"><button class="pill active">ماه</button><button class="pill">هفته</button><button class="pill">روز</button><button class="pill">روزهای شخصی</button></div>${calendarMarkup()}<div class="section-head"><h2>روزهای شخصی تو</h2><button onclick="eventForm()">＋ افزودن روز</button></div>${state.events.length?`<div class="list">${state.events.slice().reverse().map(e=>`<button class="task" onclick="eventForm('${e.id}')"><span class="task-emoji">✦</span><span class="task-info"><span class="task-name">${esc(e.title)}</span><span class="task-time">${esc(e.date?jalaliDisplay(e.date):'')}${e.note?' · '+esc(e.note):''}</span></span><span>›</span></button>`).join('')}</div>`:`<div class="panel" style="text-align:center;color:var(--muted);font-size:12px;line-height:2">هنوز روز خاصی ثبت نشده.<br>اسم روزهای مهمت را خودت اضافه کن.</div>`}`)}
function taskHTML(t){const done=t.done||t[3],title=t.title||t[0],time=t.time||t[1]||'',note=t.note||'';return `<button class="task ${done?'done':''}" onclick="toggleTask('${t.id||''}')"><span class="check">✓</span><span class="task-info"><span class="task-name">${esc(title)}</span><span class="task-time">${esc(t.date?jalaliDisplay(t.date):'بدون تاریخ')}${time?' · '+esc(time):''}${note?' · '+esc(note):''}</span></span><span class="task-emoji">${done?'✓':'✦'}</span></button>`}
function mission(){if(activeMissionDetail)return missionDetail();return shell('ماموریت',`<div class="feature mission-detail-glow"><h3>مسیر زندگی تو، پارت‌به‌پارت</h3><p>هر بازه صفحهٔ اختصاصی خودش را دارد. وارد هر پارت شو و جزئیات را خودت ثبت و پیگیری کن.</p></div><div class="list mission-parts" style="margin-top:14px">${Object.entries(periods).map(([k,v],i)=>{const count=state.tasks.filter(t=>(t.period||'daily')===k).length;const icons=['☼','◒','◈','⛰','✦'];return `<button class="mission-row" onclick="activeMissionDetail='${k}';activeMission='${k}';render()"><span class="mission-orb">${icons[i]}</span><span class="mission-copy"><strong>${v}</strong><small>ورود به پارت و ثبت جزئیات برنامه</small></span><span class="mission-count">${toFa(count)} مورد</span><span class="mission-arrow">‹</span></button>`}).join('')}</div><button class="primary" style="width:100%;padding:14px;margin-top:15px" onclick="activeMissionDetail='daily';activeMission='daily';taskForm()">＋ افزودن برنامه جدید</button>`)}
function missionDetail(){const k=activeMissionDetail,list=state.tasks.filter(t=>(t.period||'daily')===k);return shell(periods[k],`<div class="feature mission-detail-glow"><h3>${periods[k]}؛ صفحهٔ اختصاصی تو</h3><p>برنامه‌ها، تاریخ، ساعت و توضیحات این پارت را خودت وارد کن. هیچ موردی از قبل اضافه نشده.</p></div>${list.length?`<div class="list" style="margin-top:14px">${list.map(taskHTML).join('')}</div>`:`<div class="panel" style="margin-top:14px;text-align:center;color:var(--muted);font-size:12px;line-height:2">در پارت ${periods[k]} هنوز برنامه‌ای ثبت نشده.<br>اولین جزئیات را خودت اضافه کن.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:15px" onclick="taskForm()">＋ افزودن جزئیات به ${periods[k]}</button>`)}

async function cloudSignUp(){const email=val('cloudEmail'),password=val('cloudPassword');if(!email||!password){showToast('ایمیل و رمز عبور را وارد کن');return}if(password.length<6){showToast('رمز عبور باید حداقل ۶ کاراکتر باشد');return}cloudSetBusy(true);try{const j=await cloudRequest(CLOUD_URL+'/auth/v1/signup',{method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})},false);if(j.access_token){cloudStoreSession(j);showToast('حساب ابری ساخته شد');render()}else{showToast('حساب ساخته شد؛ ایمیل تأیید را بررسی کن و بعد وارد شو')} }catch(e){showToast(e.message)}finally{cloudSetBusy(false)}}
async function cloudSignIn(){const email=val('cloudEmail'),password=val('cloudPassword');if(!email||!password){showToast('ایمیل و رمز عبور را وارد کن');return}cloudSetBusy(true);try{const j=await cloudRequest(CLOUD_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':CLOUD_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})},false);cloudStoreSession(j);showToast('ورود به فضای ابری انجام شد');render()}catch(e){showToast(e.message)}finally{cloudSetBusy(false)}}
async function cloudSignOut(){if(cloudSession?.access_token){try{await fetch(CLOUD_URL+'/auth/v1/logout',{method:'POST',headers:cloudHeaders(cloudSession.access_token)})}catch(e){}}cloudStoreSession(null);cloudStoreMeta(null);showToast('از فضای ابری خارج شد');render()}
async function cloudSave(){if(!cloudSession?.access_token){showToast('اول وارد فضای ابری شو');return}cloudSetBusy(true);try{const now=new Date().toISOString();await cloudRequest(CLOUD_URL+'/rest/v1/nevo_backups?on_conflict=user_id',{method:'POST',headers:cloudHeaders(cloudSession.access_token,{Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({user_id:cloudSession.user?.id||cloudSession.user_id,payload:cloudSnapshot(),schema_version:1,updated_at:now})});cloudStoreMeta({updatedAt:now,direction:'save'});showToast('اطلاعات این گوشی در ابر ذخیره شد')}catch(e){showToast(e.message)}finally{cloudSetBusy(false)}}
async function cloudLoad(){if(!cloudSession?.access_token){showToast('اول وارد فضای ابری شو');return}cloudSetBusy(true);try{const uid=cloudSession.user?.id||cloudSession.user_id,j=await cloudRequest(CLOUD_URL+'/rest/v1/nevo_backups?select=payload,updated_at,schema_version&user_id=eq.'+encodeURIComponent(uid),{method:'GET',headers:cloudHeaders(cloudSession.access_token)});if(!j.length){showToast('هنوز پشتیبانی در ابر نداری');return}const row=j[0],stamp=row.updated_at?new Date(row.updated_at).toLocaleString('fa-IR'):'';if(!window.confirm('اطلاعات فعلی این گوشی با نسخهٔ ابری جایگزین شود؟\nزمان آخرین ذخیره: '+stamp))return;const keepView=state.view,keepHistory=state.history.slice();const incoming=row.payload||{};Object.keys(blank()).forEach(k=>{if(k!=='view'&&k!=='history'&&incoming[k]!==undefined)state[k]=incoming[k]});state.view=keepView;state.history=keepHistory;save();cloudStoreMeta({updatedAt:row.updated_at||'',direction:'load'});showToast('اطلاعات از ابر بازیابی شد');render()}catch(e){showToast(e.message)}finally{cloudSetBusy(false)}}
function cloud(){const busy=cloudBusy?'در حال ارتباط…':'';if(!cloudSession?.access_token)return shell('فضای ابری',`<section class="cloud-card"><div class="cloud-icon">☁️</div><h2>پشتیبان امن NEVo</h2><p>با یک حساب ایمیل، اطلاعاتی که خودت وارد کرده‌ای را امن در ابر نگه دار و هر زمان خواستی روی دستگاهت برگردان.</p><div class="cloud-form"><div class="field"><label>ایمیل</label><input id="cloudEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>رمز عبور</label><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="حداقل ۶ کاراکتر"></div></div><div class="cloud-actions"><button class="primary" onclick="cloudSignIn()" ${cloudBusy?'disabled':''}>${busy||'ورود'}</button><button class="gold-btn" onclick="cloudSignUp()" ${cloudBusy?'disabled':''}>ساخت حساب</button></div><div class="cloud-status">بعد از ساخت حساب، اگر پیام تأیید آمد ایمیل را تأیید کن. برای جلوگیری از حذف ناخواسته، بازیابی اطلاعات همیشه با انتخاب خودت انجام می‌شود.</div></section>`);const email=cloudSession.user?.email||cloudSession.email||'';const last=cloudMeta?.updatedAt?new Date(cloudMeta.updatedAt).toLocaleString('fa-IR'):'هنوز ذخیره‌ای انجام نشده';return shell('فضای ابری',`<section class="cloud-card"><div class="cloud-icon">☁️</div><h2>فضای ابری فعال است</h2><p class="cloud-email">${esc(email)}</p><p>اطلاعات روی گوشی حفظ می‌شود. از دکمهٔ ذخیره برای فرستادن نسخهٔ فعلی و از بازیابی برای جایگزین‌کردن آگاهانهٔ اطلاعات استفاده کن.</p><div class="cloud-status">آخرین عملیات: ${esc(last)}</div><div class="cloud-actions"><button class="primary" onclick="cloudSave()" ${cloudBusy?'disabled':''}>☁️ ذخیره در ابر</button><button class="gold-btn" onclick="cloudLoad()" ${cloudBusy?'disabled':''}>↥ بازیابی از ابر</button></div><button class="cloud-actions cloud-danger" style="width:100%;margin-top:10px;padding:11px;border-radius:14px;font-weight:800" onclick="cloudSignOut()">خروج از حساب</button></section>`)}
function reports(){return shell('گزارش‌ها',`<div class="money"><h3>داشبورد شخصی</h3><div class="amount">${toFa(state.tasks.filter(t=>t.done||t[3]).length)} <small>برنامه انجام‌شده</small></div></div><div class="split"><div class="stat"><b>${toFa(state.tasks.length)}</b><span>برنامه‌ها</span></div><div class="stat"><b>${toFa(state.goals.length)}</b><span>هدف‌ها</span></div><div class="stat"><b>${toFa(state.memories.length)}</b><span>خاطرات</span></div><div class="stat"><b>${toFa(state.debts.filter(x=>!x.paid).length)}</b><span>تعهد باز</span></div></div><div class="export-row"><button onclick="openReport('all')">گزارش متنی کامل</button><button onclick="exportReport('all','pdf')">ساخت PDF</button></div>`)}
function profile(){return shell('پروفایل',`<div class="panel" style="display:flex;align-items:center;gap:14px"><img src="assets/nevo-logo.jpg" style="width:64px;height:64px;border-radius:21px;object-fit:cover;object-position:50% 20%"><div><h2 style="margin:0 0 6px;font-size:18px">${esc(state.profileName||'پروفایل شخصی')}</h2><span style="font-size:11px;color:var(--muted)">${state.profileName?'نام ثبت‌شده توسط خودت':'اطلاعاتت را خودت تکمیل کن'}</span></div></div><div class="panel" style="margin-top:12px"><label style="font-size:11px;color:var(--muted)">نام نمایشی</label><input id="profileName" value="${esc(state.profileName)}" placeholder="نام را وارد کن" style="width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:14px"><button class="primary" style="width:100%;padding:13px;margin-top:11px" onclick="saveProfile()">ذخیرهٔ پروفایل</button></div><div class="list" style="margin-top:12px"><div class="task"><span class="task-emoji">☁️</span><span class="task-info"><span class="task-name">ذخیره روی گوشی</span><span class="task-time">فعال و بدون دادهٔ نمونه</span></span><span>✓</span></div><div class="task"><span class="task-emoji">🔒</span><span class="task-info"><span class="task-name">حریم خصوصی</span><span class="task-time">اطلاعات داخل همین دستگاه</span></span><span>✓</span></div></div>`)}
function render(){const views={home,calendar,mission,vision,finance,memories,self,companion,couple,notes,cloud,reports,profile,voice,balance,poetry};screen.innerHTML=(views[state.view]||home)();nav();screen.scrollTop=0;window.scrollTo({top:0,behavior:'smooth'})}function go(v){if(state.view!==v){state.history.push(v);state.view=v;activeMemory=null;activeMemoryFolder=null;activeNote=null;activeNoteFolder=null;activeMissionDetail=null;activeVisionDetail=null;activeFinanceDetail=null;activeSelfDetail=null;activeCoupleDetail=null;save();render()}}function backOne(){if(document.querySelector('#datePicker').classList.contains('show')){closeDatePicker();return true}if(modal.classList.contains('show')){closeModal();return true}if(activeMissionDetail){activeMissionDetail=null;render();return true}if(activeVisionDetail){activeVisionDetail=null;render();return true}if(activeFinanceDetail){activeFinanceDetail=null;render();return true}if(activeSelfDetail){activeSelfDetail=null;render();return true}if(activeCoupleDetail){activeCoupleDetail=null;render();return true}if(activeMemory){activeMemory=null;render();return true}if(activeMemoryFolder!==null){activeMemoryFolder=null;render();return true}if(activeNote){activeNote=null;render();return true}if(activeNoteFolder!==null){activeNoteFolder=null;render();return true}if(state.history.length>1){state.history.pop();state.view=state.history[state.history.length-1];render();return true}return false}window.nevoBack=backOne;
function toggleTask(i){const t=state.tasks.find(x=>x.id===i);if(t){t.done=!t.done;save();render()}}function toggleDebt(i){const d=state.debts.find(x=>x.id===i);if(d){d.paid=!d.paid;save();render()}}function closeModal(){modal.classList.remove('show');modal.innerHTML=''}function form(title,body,fn){modal.innerHTML=`<div class="sheet"><div class="sheet-head"><h2>${title}</h2><button class="close" type="button" onclick="closeModal()">×</button></div><form id="f">${body}<button class="save" type="submit">ذخیره</button></form></div>`;modal.classList.add('show');$('#f').onsubmit=e=>{e.preventDefault();fn()}}
function taskForm(){const period=activeMissionDetail||activeMission;form('افزودن برنامه',`<div class="field"><label>عنوان برنامه</label><input id="tTitle" placeholder="عنوان را وارد کن" required></div><div class="field"><label>دوره</label><select id="tPeriod">${Object.entries(periods).map(([k,v])=>`<option value="${k}" ${k===period?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>تاریخ شمسی</label>${dateInput('tDate')}</div><div class="field"><label>ساعت</label><input id="tTime" type="time"></div><div class="field"><label>جزئیات</label><textarea id="tNote" placeholder="جزئیات این برنامه را خودت بنویس"></textarea></div>`,()=>{state.tasks.unshift({id:id(),title:val('tTitle'),period:val('tPeriod'),date:dateVal('tDate'),time:val('tTime'),note:val('tNote'),done:false});activeMission=val('tPeriod');activeMissionDetail=val('tPeriod');save();closeModal();render()})}
function previewGoalImage(input){const f=input.files&&input.files[0];if(!f)return;const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.82),image=$('#gImage'),preview=$('#gPreview');if(image)image.value=data;if(preview){preview.src=data;preview.classList.remove('hide')}};img.src=e.target.result};reader.readAsDataURL(f)}
function goalForm(existing){const g=state.goals.find(x=>x.id===existing)||{};form('افزودن هدف و تصویر',`<div class="field"><label>عنوان هدف</label><input id="gTitle" value="${esc(g.title||'')}" placeholder="عنوان هدف را وارد کن" required></div><div class="field"><label>بازه</label><select id="gPeriod">${Object.entries(visionPeriods).map(([k,v])=>`<option value="${k}" ${(g.period||activeVision)===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>تصویر هدف از گالری</label><label class="gallery-pick">＋ انتخاب عکس از گالری<input id="gImageFile" type="file" accept="image/*" onchange="previewGoalImage(this)"></label><img id="gPreview" class="gallery-preview ${g.image?'':'hide'}" src="${esc(g.image||'')}" alt="پیش‌نمایش تصویر هدف"><input id="gImage" value="${esc(g.image||'')}" placeholder="یا لینک تصویر را وارد کن" style="margin-top:8px"></div><div class="field"><label>توضیح</label><textarea id="gNote" placeholder="توضیح هدف را خودت بنویس">${esc(g.note||'')}</textarea></div>`,()=>{const o={id:g.id||id(),title:val('gTitle'),period:val('gPeriod'),image:val('gImage'),note:val('gNote')};if(g.id)state.goals=state.goals.map(x=>x.id===g.id?o:x);else state.goals.unshift(o);activeVision=o.period;activeVisionDetail=o.period;save();closeModal();render()})}

function memoryFolderForm(){form('ساخت پوشهٔ خاطرات',`<div class="field"><label>نام پوشه یا پارت</label><input id="folderName" placeholder="مثلاً سفرها، خانواده، سال ۱۴۰۵" required></div>`,()=>{const name=val('folderName');if(!name)return;if(!state.memoryFolders)state.memoryFolders=[];if(!state.memoryFolders.some(f=>(typeof f==='string'?f:f.name)===name)){state.memoryFolders.push({id:id(),name});save()}activeMemoryFolder=name;closeModal();render()})}function memoryForm(prefillPart=''){form('ثبت خاطره به شکل نامه',`<div class="field"><label>عنوان خاطره</label><input id="mTitle" placeholder="عنوان را وارد کن" required></div><div class="field"><label>تاریخ</label>${dateInput('mDate')}</div><div class="field"><label>نام پارت</label><input id="mPart" value="${esc(prefillPart)}" placeholder="نام پارت را خودت انتخاب کن"></div><div class="field"><label>متن خاطره</label><textarea id="mBody" placeholder="متن خاطره را اینجا بنویس" required></textarea></div>`,()=>{const part=val('mPart')||'بدون پارت';state.memories.unshift({id:id(),title:val('mTitle'),date:dateVal('mDate'),part,body:val('mBody')});if(part&&!memoryFolderNames().includes(part)){if(!state.memoryFolders)state.memoryFolders=[];state.memoryFolders.push({id:id(),name:part})}activeMemoryFolder=part;save();closeModal();render()})}function noteFolderForm(){form('ساخت پوشهٔ دفترچه',`<div class="field"><label>نام پوشه</label><input id="noteFolderName" placeholder="مثلاً اخلاقی، آموزشی، درس‌ها یا ایده‌ها" required></div>`,()=>{const name=val('noteFolderName');if(!name)return;if(!state.noteFolders)state.noteFolders=[];if(!state.noteFolders.some(f=>(typeof f==='string'?f:f.name)===name))state.noteFolders.push({id:id(),name});activeNoteFolder=name;save();closeModal();render()})}function noteForm(prefillFolder=''){form('افزودن نکته به دفترچه',`<div class="field"><label>عنوان نکته</label><input id="nTitle" placeholder="عنوان را خودت بنویس" required></div><div class="field"><label>پوشه</label><input id="nFolder" value="${esc(pref function reportTitle(kind){return kind==='finance'?'گزارش مالی NEVo':kind==='memory'?'خاطرهٔ NEVo':kind==='self'?'گزارش خودشناسی NEVo':kind==='couple'?'تحلیل رابطه NEVo':kind==='notes'?'دفترچه نکات NEVo':kind==='ai'?'گزارش همراه محمد':'گزارش کامل NEVo'}
function reportText(title,kind='all'){const out=[title,'NEVo — نسخهٔ جدید ما','تاریخ: '+faDate,''];if(kind==='all'||kind==='tasks'){out.push('برنامه‌ها: '+state.tasks.length);state.tasks.forEach((t,i)=>out.push((i+1)+'. '+(t.title||'بدون عنوان')+' | '+(t.date?jalaliDisplay(t.date):'بدون تاریخ')+' | '+(t.done?'انجام شد':'انجام نشده')));out.push('')}if(kind==='all'||kind==='vision'){out.push('هدف‌ها: '+state.goals.length);state.goals.forEach((g,i)=>out.push((i+1)+'. '+(g.title||'بدون عنوان')+' | '+(g.note||'بدون توضیح')));out.push('')}if(kind==='all'||kind==='finance'){out.push('درآمدها: '+state.income.length,'تعهدات: '+state.debts.length,'');out.push('ردیف | عنوان | در وجه | مبلغ | وضعیت');out.push(state.debts.length?state.debts.map((d,i)=>(i+1)+' | '+(d.title||'—')+' | '+(d.payee||'—')+' | '+money(d.amount)+' تومان | '+(d.paid?'تسویه شد':'تسویه نشده')).join('\n'):'—');out.push('مجموع تعهدات باز: '+money(state.debts.filter(d=>!d.paid).reduce((s,d)=>s+num(d.amount),0))+' تومان','')}if(kind==='all'||kind==='memory'){out.push('خاطرات: '+state.memories.length);state.memories.forEach((m,i)=>out.push((i+1)+'. '+(m.title||'بدون عنوان')+' | '+(m.date?jalaliDisplay(m.date):'بدون تاریخ')));out.push('')}if(kind==='all'||kind==='notes'){out.push('دفترچه نکات: '+(state.notes||[]).length);(state.notes||[]).forEach((n,i)=>out.push((i+1)+'. '+(n.title||'بدون عنوان')+' | '+(n.folder||'بدون پوشه')+' | '+(n.body||'')));out.push('')}if(kind==='self'){const all=Object.values(state.self).flat();out.push('گزارش خودشناسی: '+all.length);all.forEach((x,i)=>out.push((i+1)+'. '+(x.text||'')));out.push('')}if(kind==='couple'){const all=Object.values(state.couple).flat();out.push('گزارش رابطه: '+all.length);all.forEach((x,i)=>out.push((i+1)+'. '+(x.text||'')));out.push('')}if(kind==='ai'){const sum=aiWeeklySummary();out.push('گزارش همراه محمد','میانگین حال اخیر: '+(sum.avg||'ثبت نشده'),'برنامه‌های انجام‌شده: '+sum.done,'یادداشت‌های مرتبط با مطالعه: '+sum.bookNotes,'');(state.moodEntries||[]).slice(0,7).forEach((m,i)=>out.push((i+1)+'. حال: '+m.mood+'/5 | انرژی: '+m.energy+'/5 | '+(m.note||'بدون توضیح')+' | قدم: '+(m.step||'ثبت نشده')));out.push('');(state.aiChats||[]).slice(-12).forEach(m=>out.push((m.role==='user'?'محمد: ':'همراه محمد: ')+(m.text||'')))}return out.join('\n')}
function reportHtml(title,text){return '<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>@page{size:A4;margin:16mm}*{box-sizing:border-box}body{font-family:"BYekan","Vazirmatn","IRANSans",Tahoma,sans-serif;color:#173f41;direction:rtl;padding:0;margin:0}h1{font-size:24px;color:#066662;margin:0 0 8px;font-weight:900;border-bottom:2px solid #20a99e;padding-bottom:10px}.meta{font-size:11px;color:#6f8884;margin-bottom:16px}pre{font:600 13px/2.1 "BYekan","Vazirmatn","IRANSans",Tahoma,sans-serif;white-space:pre-wrap;word-break:break-word}</style></head><body><h1>'+esc(title)+'</h1><div class="meta">NEVo · گزارش شخصی</div><pre>'+esc(text)+'</pre></body></html>'}
function openReport(kind){const title=reportTitle(kind),text=reportText(title,kind);modal.innerHTML=`<div class="sheet report-sheet"><div class="sheet-head"><h2 class="report-card-title">${esc(title)}</h2><button class="report-close" type="button" onclick="closeModal()">×</button></div><article class="report-document"><h1>${esc(title)}</h1><div class="report-meta">گزارش ساخته‌شده از اطلاعاتی که خودت وارد کرده‌ای · ${esc(faDate)}</div><pre>${esc(text)}</pre></article><div class="export-row"><button onclick="exportReport('${kind}','doc')">ذخیره متن</button><button onclick="exportReport('${kind}','pdf')">ساخت PDF</button></div></div>`;modal.classList.add('show')}
function exportReport(kind,type){const title=reportTitle(kind),text=reportText(title,kind);if(type==='doc'){if(window.NEVoAndroid&&NEVoAndroid.saveTextFile){NEVoAndroid.saveTextFile('NEVo-'+kind+'-report.doc',text,'application/msword');showToast('گزارش متنی در دانلود ذخیره می‌شود')}else{const b=new Blob([text],{type:'application/msword;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='NEVo-'+kind+'-report.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}}else{if(window.NEVoAndroid&&NEVoAndroid.savePdf){NEVoAndroid.savePdf(title,reportHtml(title,text));showToast('در حال ساخت PDF با فونت فارسی…')}else{openReport(kind);showToast('برای ساخت PDF باید داخل نسخهٔ اندروید استفاده شود')}}}
function itemActions(editFn,deleteFn){return `<span class="item-actions"><button type="button" class="mini-btn mini-edit" onclick="event.stopPropagation();${editFn}">ویرایش</button><button type="button" class="mini-btn mini-delete" onclick="event.stopPropagation();${deleteFn}">حذف</button></span>`}
function toggleTimeField(period){const show=period==='daily',el=$('#tTimeWrap'),input=$('#tTime');if(el)el.classList.toggle('hide',!show);if(input){input.disabled=!show;if(!show)input.value=''}}
function taskHTML(t,idx=0){const done=!!(t.done||t[3]),title=t.title||t[0]||'',period=t.period||'daily',time=t.time||t[1]||'',note=t.note||'',key=t.id?`toggleTask('${t.id}')`:`toggleTaskIndex(${idx})`,edit=t.id?`taskForm('${t.id}')`:`taskFormIndex(${idx})`,del=t.id?`deleteTask('${t.id}')`:`deleteTaskIndex(${idx})`,showTime=period==='daily';return `<div class="task ${done?'done':''}"><button type="button" class="check" onclick="${key}">${done?'✓':''}</button><span class="task-info"><span class="task-name">${esc(title)}</span><span class="task-time">${esc(t.date?jalaliDisplay(t.date):'بدون تاریخ')}${showTime&&time?' · '+esc(time):''}${note?' · '+esc(note):''}</span></span>${itemActions(edit,del)}</div>`}
function toggleTaskIndex(i){const t=state.tasks[i];if(t){t.done=!(t.done||t[3]);save();render()}}
function taskFormIndex(i){const t=state.tasks[i];if(t)taskForm(t.id)}
function deleteTaskIndex(i){if(window.confirm('این برنامه حذف شود؟')){state.tasks.splice(i,1);save();render()}}
function deleteTask(idv){if(!window.confirm('این برنامه حذف شود؟'))return;state.tasks=state.tasks.filter(t=>t.id!==idv);save();render()}
function mission(){if(activeMissionDetail)return missionDetail();return shell('ماموریت',`<div class="list mission-parts" style="margin-top:14px">${Object.entries(periods).map(([k,v],i)=>{const count=state.tasks.filter(t=>(t.period||'daily')===k).length;const icons=['☼','◒','◈','⛰','✦'];return `<button class="mission-row" onclick="activeMissionDetail='${k}';activeMission='${k}';render()"><span class="mission-orb">${icons[i]}</span><span class="mission-copy"><strong>${v}</strong></span><span class="mission-count">${toFa(count)} مورد</span><span class="mission-arrow">‹</span></button>`}).join('')}</div><button class="primary" style="width:100%;padding:14px;margin-top:15px" onclick="activeMissionDetail='daily';activeMission='daily';taskForm()">＋ افزودن برنامه جدید</button>`)}
function missionDetail(){const k=activeMissionDetail,list=state.tasks.filter(t=>(t.period||'daily')===k);return shell(periods[k],`${list.length?`<div class="list" style="margin-top:14px">${list.map((t,i)=>taskHTML(t,i)).join('')}</div>`:`<div class="folder-empty" style="margin-top:14px">این پارت هنوز برنامه‌ای ندارد.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:15px" onclick="taskForm()">＋ افزودن به ${periods[k]}</button>`)}
function vision(){if(activeVisionDetail)return visionDetail();return shell('ویژن',`<div class="folder-list">${Object.entries(visionPeriods).map(([k,v],i)=>{const count=state.goals.filter(g=>(g.period||'short')===k).length;return `<button class="folder-row" onclick="activeVision='${k}';activeVisionDetail='${k}';render()"><span class="folder-orb">${['◷','◒','✦'][i]}</span><span class="folder-copy"><strong>${v}</strong></span><span class="folder-count">${toFa(count)} هدف</span><span class="folder-arrow">‹</span></button>`}).join('')}</div><button class="primary" style="width:100%;padding:14px;margin-top:15px" onclick="activeVision='short';activeVisionDetail='short';goalForm()">＋ افزودن هدف</button>`)}
function visionDetail(){const k=activeVisionDetail,list=state.goals.filter(g=>(g.period||'short')===k);return shell(visionPeriods[k],`${list.length?`<div class="vision-grid" style="margin-top:14px">${list.map(g=>`<div class="vision-card" ${g.image?`style="background-image:url('${esc(g.image)}')"`:''}><div><strong>${esc(g.title)}</strong><small>${esc(g.note||'')}</small><span class="card-actions">${itemActions(`goalForm('${g.id}')`,`deleteGoal('${g.id}')`)}</span></div></div>`).join('')}</div>`:`<div class="folder-empty" style="margin-top:14px">این پارت هنوز هدفی ندارد.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="goalForm()">＋ افزودن هدف</button>`)}
function finance(){if(activeFinanceDetail)return financeDetail();const folders=[['overview','خلاصه و درصدبندی'],['income','درآمدها'],['debts','تعهدات و قسط‌ها']];return shell('مسیر آزادی',`<div class="folder-list">${folders.map(([k,t],i)=>{const n=k==='income'?state.income.length:k==='debts'?state.debts.filter(x=>!x.paid).length:(state.allocations||[]).length;return `<button class="folder-row" onclick="activeFinance='${k}';activeFinanceDetail='${k}';render()"><span class="folder-orb">${['◈','＋','▣'][i]}</span><span class="folder-copy"><strong>${t}</strong></span><span class="folder-count">${toFa(n)} مورد</span><span class="folder-arrow">‹</span></button>`}).join('')}</div><div class="export-row" style="margin-top:15px"><button onclick="openReport('finance')">گزارش مالی</button><button onclick="exportReport('finance','pdf')">ساخت PDF</button></div>`)}
function financeDetail(){const total=state.income.reduce((s,x)=>s+num(x.amount),0),pending=state.debts.filter(x=>!x.paid).reduce((s,x)=>s+num(x.amount),0),allocations=state.allocations||[],allocatedPct=allocations.reduce((s,x)=>s+num(x.percent),0),remaining=Math.max(0,100-allocatedPct);let body;if(activeFinance==='overview')body=`<div class="money"><h3>خلاصهٔ مالی من</h3><div class="amount">${money(total)} <small>تومان</small></div><div class="bar"><i style="width:${total?100:0}%"></i></div></div><div class="split"><div class="stat"><b>${money(pending)}</b><span>تعهد باز</span></div><div class="stat"><b>${state.debts.length}</b><span>قسط و بدهی</span></div><div class="stat"><b>${money(total-pending)}</b><span>مانده تقریبی</span></div><div class="stat"><b>${state.income.length}</b><span>درآمدها</span></div></div><div class="panel" style="margin-top:12px"><div class="section-head" style="margin-top:0"><h2>تقسیم درآمد</h2><button onclick="allocationForm()">＋ افزودن سهم</button></div>${allocations.length?`<div class="list">${allocations.map(a=>{const pct=num(a.percent),amount=Math.round(total*pct/100);return `<div class="task"><span class="task-emoji">◈</span><span class="task-info"><span class="task-name">${esc(a.name)}</span><span class="task-time">${toFa(pct)}٪ · ${money(amount)} تومان</span></span>${itemActions(`allocationForm('${a.id}')`,`deleteAllocation('${a.id}')`)}</div>`}).join('')}</div><div class="panel" style="margin-top:11px;text-align:center;color:var(--muted)">جمع درصدها: ${toFa(allocatedPct)}٪ · باقی‌مانده: ${toFa(remaining)}٪</div>`:`<div class="folder-empty">هنوز سهمی ثبت نشده.</div>`}<button class="gold-btn" style="width:100%;padding:13px;margin-top:12px" onclick="allocationForm()">＋ تعریف درصد جدید</button></div>`;else if(activeFinance==='income')body=`<div class="section-head"><h2>درآمدهای من</h2><button onclick="incomeForm()">＋ افزودن</button></div>${state.income.length?`<div class="list">${state.income.map(x=>`<div class="task"><span class="task-emoji">＋</span><span class="task-info"><span class="task-name">${esc(x.source||'درآمد')}</span><span class="task-time">${esc(x.date?jalaliDisplay(x.date):'بدون تاریخ')} · ${money(x.amount)} تومان</span></span>${itemActions(`incomeForm('${x.id}')`,`deleteIncome('${x.id}')`)}</div>`).join('')}</div>`:`<div class="folder-empty">هنوز درآمدی ثبت نشده.</div>`}<button class="gold-btn" style="width:100%;padding:13px;margin-top:14px" onclick="incomeForm()">＋ ثبت درآمد</button>`;else body=`<div class="section-head"><h2>تعهدات و قسط‌ها</h2><button onclick="debtForm()">＋ افزودن</button></div>${state.debts.length?`<div class="list">${state.debts.map(d=>`<div class="task ${d.paid?'done':''}"><button type="button" class="check" onclick="toggleDebt('${d.id}')">${d.paid?'✓':''}</button><span class="task-info"><span class="task-name">${esc(d.title)}</span><span class="task-time">در وجه ${esc(d.payee||'')} · ${esc(d.due?jalaliDisplay(d.due):'بدون تاریخ')} · ${money(d.amount)} تومان</span></span>${itemActions(`debtForm('${d.id}')`,`deleteDebt('${d.id}')`)}</div>`).join('')}</div>`:`<div class="folder-empty">این پوشه فعلاً خالی است.</div>`}<button class="primary" style="width:100%;padding:13px;margin-top:14px" onclick="debtForm()">＋ ثبت بدهی یا قسط</button>`;return shell(activeFinance==='overview'?'خلاصهٔ مالی':activeFinance==='income'?'درآمدها':'تعهدات و قسط‌ها',`<div class="pillbar"><button class="pill ${activeFinance==='overview'?'active':''}" onclick="activeFinance='overview';render()">خلاصه</button><button class="pill ${activeFinance==='income'?'active':''}" onclick="activeFinance='income';render()">درآمد</button><button class="pill ${activeFinance==='debts'?'active':''}" onclick="activeFinance='debts';render()">تعهدات</button></div>${body}<div class="export-row"><button onclick="openReport('finance')">گزارش متنی</button><button onclick="exportReport('finance','pdf')">چاپ / PDF</button></div>`)}
function memories(){if(activeMemory)return shell('خاطره',memoryReader());if(activeMemoryFolder!==null)return memoryFolderDetail();const names=memoryFolderNames();return shell('خاطرات قشنگ',`<div class="folder-list">${names.length?names.map((name,i)=>{const count=state.memories.filter(m=>(m.part||'بدون پارت')===name).length;return `<button class="folder-row" onclick="activeMemoryFolder=${JSON.stringify(name)};render()"><span class="folder-orb">${['✉','❖','♡'][i%3]}</span><span class="folder-copy"><strong>${esc(name)}</strong></span><span class="folder-count">${toFa(count)} خاطره</span><span class="folder-arrow">‹</span></button>`}).join(''):`<div class="folder-empty">هنوز پوشه‌ای ساخته نشده.</div>`}</div><button class="primary" style="width:100%;padding:14px;margin-top:15px" onclick="memoryFolderForm()">＋ ساخت پوشهٔ خاطرات</button><div class="export-row"><button onclick="openReport('memory')">گزارش متنی</button><button onclick="exportReport('memory','pdf')">ساخت PDF</button></div>`)}
function memoryFolderDetail(){const name=activeMemoryFolder,list=state.memories.filter(m=>(m.part||'بدون پارت')===name);return shell(name,`${list.length?`<div class="list" style="margin-top:14px">${list.slice().reverse().map(m=>`<div class="task"><span class="task-emoji">✉</span><span class="task-info"><span class="task-name">${esc(m.title)}</span><span class="task-time">${esc(m.date?jalaliDisplay(m.date):'بدون تاریخ')}</span></span>${itemActions(`memoryForm('${m.id}')`,`deleteMemory('${m.id}')`)}</div>`).join('')}</div>`:`<div class="folder-empty" style="margin-top:14px">این پوشه هنوز خاطره‌ای ندارد.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="memoryForm(${JSON.stringify(name)})">＋ ثبت خاطره</button>`)}

function self(){if(activeSelfDetail)return selfDetail();const labels=[['good','اخلاق‌های خوب'],['bad','اخلاق‌های بد'],['targets','عادت‌های هدف']];return shell('خودشناسی',`<div class="folder-list">${labels.map(([k,t],i)=>`<button class="folder-row" onclick="activeSelf='${k}';activeSelfDetail='${k}';render()"><span class="folder-orb">${['✦','◌','🌿'][i]}</span><span class="folder-copy"><strong>${t}</strong></span><span class="folder-count">${toFa((state.self[k]||[]).length)} مورد</span><span class="folder-arrow">‹</span></button>`).join('')}</div><div class="export-row"><button onclick="openReport('self')">گزارش متنی</button><button onclick="exportReport('self','pdf')">ساخت PDF</button></div>`)}
function selfDetail(){const labels={good:'اخلاق‌های خوب',bad:'اخلاق‌های بد',targets:'عادت‌های هدف'},arr=state.self[activeSelf]||[];return shell(labels[activeSelf],`${arr.length?`<div class="list" style="margin-top:14px">${arr.map((x,i)=>`<div class="task"><span class="task-emoji">🌿</span><span class="task-info"><span class="task-name">${esc(x.text)}</span><span class="task-time">${x.done?'رعایت شد':'ثبت‌شده'}</span></span>${itemActions(`selfForm('${x.id}')`,`deleteSelf('${x.id}')`)}${activeSelf==='targets'?`<button type="button" class="mini-btn mini-check" onclick="toggleSelf('${x.id}')">${x.done?'✓':'تیک'}</button>`:''}</div>`).join('')}</div>`:`<div class="folder-empty" style="margin-top:14px">این پوشه هنوز چیزی ندارد.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="selfForm()">＋ افزودن به ${labels[activeSelf]}</button><div class="export-row"><button onclick="openReport('self')">گزارش متنی</button><button onclick="exportReport('self','pdf')">ساخت PDF</button></div>`)}
function couple(){if(activeCoupleDetail)return coupleDetail();const labels={goals:'اهداف ما',memories:'خاطرات ما',myGood:'خوبی‌های من',myBad:'بدی‌های من',partnerGood:'خوبی‌های پارتنر',partnerBad:'بدی‌های پارتنر',habits:'عادت‌های رابطه'},entries=Object.entries(labels);return shell('ما ♥',`<div class="folder-list">${entries.map(([k,v],i)=>`<button class="folder-row" onclick="activeCouple='${k}';activeCoupleDetail='${k}';render()"><span class="folder-orb">${['♥','✉','✦','◌','♡','◍','∞'][i]}</span><span class="folder-copy"><strong>${v}</strong></span><span class="folder-count">${toFa((state.couple[k]||[]).length)} مورد</span><span class="folder-arrow">‹</span></button>`).join('')}<button class="folder-row" onclick="activeCoupleDetail='analysis';render()"><span class="folder-orb">◉</span><span class="folder-copy"><strong>تحلیل کلی رابطه</strong></span><span class="folder-count">${toFa(Object.values(state.couple).reduce((n,a)=>n+a.length,0))} مورد</span><span class="folder-arrow">‹</span></button></div>`)}

function notes(){if(activeNote)return shell('یادداشت',noteReader());if(activeNoteFolder!==null)return noteFolderDetail();const names=noteFolderNames();return shell('دفترچه نکات',`<div class="folder-list">${names.length?names.map((name,i)=>{const count=(state.notes||[]).filter(n=>(n.folder||'بدون پوشه')===name).length;return `<button class="folder-row" onclick="activeNoteFolder=${JSON.stringify(name)};render()"><span class="folder-orb">${['✦','📘','☼'][i%3]}</span><span class="folder-copy"><strong>${esc(name)}</strong></span><span class="folder-count">${toFa(count)} نکته</span><span class="folder-arrow">‹</span></button>`}).join(''):`<div class="folder-empty">هنوز پوشه‌ای ساخته نشده.</div>`}</div><button class="primary" style="width:100%;padding:14px;margin-top:15px" onclick="noteFolderForm()">＋ ساخت پوشهٔ نکات</button>`)}
function noteFolderDetail(){const name=activeNoteFolder,list=(state.notes||[]).filter(n=>(n.folder||'بدون پوشه')===name);return shell(name,`${list.length?`<div class="list" style="margin-top:14px">${list.slice().reverse().map(n=>`<div class="task"><span class="task-emoji">✦</span><span class="task-info"><span class="task-name">${esc(n.title)}</span><span class="task-time">${esc(n.date?jalaliDisplay(n.date):'بدون تاریخ')}</span></span>${itemActions(`noteForm('${n.id}')`,`deleteNote('${n.id}')`)}</div>`).join('')}</div>`:`<div class="folder-empty" style="margin-top:14px">این پوشه هنوز نکته‌ای ندارد.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="noteForm(${JSON.stringify(name)})">＋ افزودن نکته</button>`)}
function noteReader(){const n=(state.notes||[]).find(x=>x.id===activeNote);if(!n){activeNote=null;return ''}return `<article class="note-card" style="margin-top:13px"><div class="note-meta">${esc(n.date?jalaliDisplay(n.date):'بدون تاریخ')} · ${esc(n.folder||'بدون پوشه')}</div><h3 style="font-size:23px;margin-bottom:13px">${esc(n.title)}</h3><p>${esc(n.body)}</p><div class="export-row">${itemActions(`noteForm('${n.id}')`,`deleteNote('${n.id}')`)}</div></article>`}

let voiceDraft={voiceData:'',musicData:'',voiceName:'',musicName:'',voiceVolume:1,musicVolume:.35};
let voiceRecording=false;
function volumeLabel(v){return toFa(Math.round(Number(v||0)*100))+'٪'}
function setDraftVolume(kind,v){const n=Math.max(0,Math.min(1,Number(v)||0));voiceDraft[kind+'Volume']=n;const player=$('#'+kind+'Preview');if(player)player.volume=n;const label=$('#'+kind+'VolumeValue');if(label)label.textContent=volumeLabel(n)}
function setSavedVolume(i,kind,v){const n=Math.max(0,Math.min(1,Number(v)||0)),item=state.voiceSessions[i];if(!item)return;item[kind+'Volume']=n;const player=$('#'+kind+'-'+i);if(player)player.volume=n;const label=$('#'+kind+'VolumeValue-'+i);if(label)label.textContent=volumeLabel(n);save()}
function updateRecordingUI(){const b=$('#recordBtn'),status=$('#recordStatus');if(b){b.textContent=voiceRecording?'■ توقف ضبط':'● شروع ضبط داخل اپ';b.classList.toggle('recording',voiceRecording)}if(status)status.textContent=voiceRecording?'در حال ضبط صدا… دوباره بزن تا ذخیره شود.':''}
function startNativeRecording(){if(voiceRecording)return;if(!window.NEVoAndroid||!NEVoAndroid.startVoiceRecording){showToast('ضبط مستقیم روی این نسخه فعال نیست');return}voiceRecording=true;updateRecordingUI();NEVoAndroid.startVoiceRecording()}
function stopNativeRecording(){if(!voiceRecording)return;voiceRecording=false;updateRecordingUI();if(window.NEVoAndroid&&NEVoAndroid.stopVoiceRecording)NEVoAndroid.stopVoiceRecording()}
function toggleNativeRecording(){voiceRecording?stopNativeRecording():startNativeRecording()}
window.nevoRecordingStarted=()=>{voiceRecording=true;updateRecordingUI();showToast('ضبط صدا شروع شد')};
window.nevoRecordingReady=data=>{voiceRecording=false;voiceDraft.voiceData=data;voiceDraft.voiceName='ضبط مستقیم داخل اپ';const player=$('#voicePreview');if(player){player.src=data;player.volume=voiceDraft.voiceVolume;player.classList.remove('hide');player.load()}updateRecordingUI();showToast('ضبط آماده شد؛ حالا ولوم و ذخیره را تنظیم کن')};

function loadAudioDraft(kind,input){const file=input&&input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{voiceDraft[kind+'Data']=e.target.result;voiceDraft[kind+'Name']=file.name;const player=$('#'+kind+'Preview');if(player){player.src=e.target.result;player.volume=voiceDraft[kind+'Volume'];player.classList.remove('hide');player.load()}showToast(kind==='voice'?'ویس آماده شد':'آهنگ زمینه آماده شد')};reader.readAsDataURL(file)}
function playMix(i){const x=state.voiceSessions[i],v=$('#voice-'+i),m=$('#music-'+i);if(!v)return;v.volume=Number(x.voiceVolume??1);if(m)m.volume=Number(x.musicVolume??.35);[v,m].forEach(a=>{if(a){a.currentTime=0;a.play().catch(()=>{})}})}
function saveVoiceMemo(){if(voiceRecording){showToast('اول ضبط را متوقف کن');return}const title=val('voiceTitle')||'ویس شخصی';if(!voiceDraft.voiceData){showToast('اول ویس ضبط یا انتخاب کن');return}try{state.voiceSessions.unshift({id:id(),title,voiceData:voiceDraft.voiceData,musicData:voiceDraft.musicData,voiceName:voiceDraft.voiceName,musicName:voiceDraft.musicName,voiceVolume:voiceDraft.voiceVolume,musicVolume:voiceDraft.musicVolume,date:new Date().toISOString()});save();voiceDraft={voiceData:'',musicData:'',voiceName:'',musicName:'',voiceVolume:1,musicVolume:.35};render();showToast('ویس در NEVo ذخیره شد')}catch(e){showToast('حجم ویس برای ذخیره روی گوشی زیاد است')}}
function deleteVoice(i){if(window.confirm('این ویس حذف شود؟')){state.voiceSessions.splice(i,1);save();render()}}
function voice(){const rows=(state.voiceSessions||[]).map((x,i)=>{const vv=Number(x.voiceVolume??1),mv=Number(x.musicVolume??.35);return `<div class="task" style="display:block"><div style="display:flex;align-items:center;gap:10px"><span class="task-emoji">🎙️</span><span class="task-info"><span class="task-name">${esc(x.title)}</span><span class="task-time">${esc(x.voiceName||'ویس شخصی')} ${x.musicName?' · آهنگ زمینه: '+esc(x.musicName):''}</span></span><button type="button" class="mini-btn mini-delete" onclick="deleteVoice(${i})">حذف</button></div><audio id="voice-${i}" class="audio-player" controls src="${esc(x.voiceData)}" onloadedmetadata="this.volume=${vv}"></audio><div class="volume-control"><span>ولوم ویس <b id="voiceVolumeValue-${i}">${volumeLabel(vv)}</b></span><input type="range" min="0" max="1" step=".01" value="${vv}" oninput="setSavedVolume(${i},'voice',this.value)"></div>${x.musicData?`<audio id="music-${i}" class="audio-player" controls src="${esc(x.musicData)}" onloadedmetadata="this.volume=${mv}"></audio><div class="volume-control"><span>ولوم آهنگ زمینه <b id="musicVolumeValue-${i}">${volumeLabel(mv)}</b></span><input type="range" min="0" max="1" step=".01" value="${mv}" oninput="setSavedVolume(${i},'music',this.value)"></div><button type="button" class="mini-gold" onclick="playMix(${i})">▶ پخش ویس با آهنگ زمینه</button>`:''}</div>`}).join('');return shell('استودیو ویس',`<div class="voice-card"><h3>صدای شخصی من</h3><p>همین‌جا داخل اپ ضبط کن، یا فایل ویس و آهنگ زمینه را از گوشی انتخاب کن؛ ولوم هرکدام جداگانه قابل تنظیم است.</p><input id="voiceTitle" class="soft-input" placeholder="عنوان ویس را بنویس"><button id="recordBtn" type="button" class="record-btn ${voiceRecording?'recording':''}" onclick="toggleNativeRecording()">${voiceRecording?'■ توقف ضبط':'● شروع ضبط داخل اپ'}</button><div id="recordStatus" class="record-status">${voiceRecording?'در حال ضبط صدا… دوباره بزن تا ذخیره شود.':''}</div><label class="audio-pick">＋ انتخاب ویس از گوشی<input type="file" accept="audio/*" onchange="loadAudioDraft('voice',this)"></label><audio id="voicePreview" class="audio-player hide" controls></audio><div class="volume-control"><span>ولوم ویس <b id="voiceVolumeValue">${volumeLabel(voiceDraft.voiceVolume)}</b></span><input type="range" min="0" max="1" step=".01" value="${voiceDraft.voiceVolume}" oninput="setDraftVolume('voice',this.value)"></div><label class="audio-pick">＋ انتخاب آهنگ زمینه از گوشی<input type="file" accept="audio/*" onchange="loadAudioDraft('music',this)"></label><audio id="musicPreview" class="audio-player hide" controls></audio><div class="volume-control"><span>ولوم آهنگ زمینه <b id="musicVolumeValue">${volumeLabel(voiceDraft.musicVolume)}</b></span><input type="range" min="0" max="1" step=".01" value="${voiceDraft.musicVolume}" oninput="setDraftVolume('music',this.value)"></div><button class="primary" style="width:100%;padding:13px;margin-top:12px" onclick="saveVoiceMemo()">ذخیره ویس و آهنگ</button></div>${rows?`<div class="list" style="margin-top:14px">${rows}</div>`:'<div class="folder-empty" style="margin-top:14px">هنوز ویسی ثبت نشده.</div>'}`)}
