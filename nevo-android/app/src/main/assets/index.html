-bottom:8px;font-weight:800}.week span{white-space:nowrap;overflow:hidden}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.day{height:37px;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12px;color:var(--deep);position:relative}.day.muted{color:#b8c4c1}.day.today{background:var(--teal);color:#fff;font-weight:bold;box-shadow:0 5px 12px #078f9144}.list{display:flex;flex-direction:column;gap:9px}.task{display:flex;align-items:center;gap:11px;padding:12px 10px;border:1px solid var(--line);border-radius:17px;background:#fbfefd}.check{width:28px;height:28px;border:1.5px solid #b7d8d2;border-radius:10px;display:grid;place-items:center;color:transparent;flex:0 0 auto;background:linear-gradient(145deg,#fff,#f2fbf8);box-shadow:inset 0 1px 2px #fff,0 4px 9px #08716d18;transition:.2s;position:relative;font-size:17px;font-weight:900}.task.done{background:linear-gradient(100deg,#f1fbf8,#fffdf7);border-color:#bfe5dc}.task.done .check{background:linear-gradient(145deg,#19b4a4,#057774);border-color:#0b8d86;color:#fff;box-shadow:0 6px 14px #078f9144}.task.done .check:before{content:"";position:absolute;inset:3px;border:1px solid #ffffff55;border-radius:7px}.task.done .task-name{text-decoration:none;color:var(--deep);font-weight:800}.task-info{flex:1}.task-name{display:block;font-size:13px;font-weight:700}.task-time{display:block;font-size:10px;color:#91a7a3;margin-top:4px}.task-emoji{font-size:21px}.feature{margin-top:13px;padding:15px;border-radius:20px;background:linear-gradient(110deg,#e7faf6,#fff9eb);border:1px solid #c9e7df}.feature h3{margin:0 0 7px;font-size:14px}.feature p{margin:0;color:#68817e;font-size:11px;line-height:1.8}.vision-grid,.memory-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.vision-card{height:142px;border-radius:20px;overflow:hidden;position:relative;color:#fff;background-size:cover;background-position:center}.vision-card:after{content:"";position:absolute; x 30px #003b3b44}.toast.show{transform:translateX(-50%) translateY(0)}.hide{display:none!important}@media(min-width:700px){body{padding:20px 0}.app{border-radius:30px;min-height:calc(100vh - 40px)}.bottom{position:absolute;border-radius:0 0 30px 30px}}

<body>
<div class="app" id="app">
  <main class="screen" id="screen"></main>
  <nav class="bottom" id="bottom">
    <button class="nav active" data-view="home"><i>⌂</i><span>خانه</span></button>
    <button class="nav" data-view="calendar"><i>◫</i><span>تقویم</span></button>
    <button class="nav plus" id="addBtn">＋<span>افزودن</span></button>
    <button class="nav" data-view="reports"><i>⌁</i><span>گزارش‌ها</span></button>
    <button class="nav" data-view="profile"><i>♙</i><span>پروفایل</span></button>
  </nav>
</div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), screen=$('#screen'), modal=$('#modal'), toast=$('#toast');
const KEY='nevo.local.v3';
const blank=()=>({view:'home',history:['home'],tasks:[],goals:[],income:[],allocations:[],debts:[],memories:[],events:[],profileName:'',self:{good:[],bad:[],targets:[]},couple:{goals:[],memories:[],myGood:[],myBad:[],partnerGood:[],partnerBad:[],habits:[]}});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');const b=blank();if(!x)return b;return {...b,...x,history:Array.isArray(x.history)&&x.history.length?x.history:['home'],tasks:Array.isArray(x.tasks)?x.tasks:[],goals:Array.isArray(x.goals)?x.goals:[],income:Array.isArray(x.income)?x.income:[],allocations:Array.isArray(x.allocations)?x.allocations:[],debts:Array.isArray(x.debts)?x.debts:[],memories:Array.isArray(x.memories)?x.memories:[],events:Array.isArray(x.events)?x.events:[],self:{...b.self,...x.self},couple:{...b.couple,...x.couple}}}catch(e){return blank()}}
const state=load(), periods={daily:'روزانه',weekly:'هفتگی',monthly:'ماهانه',mid:'میان‌مدت',long:'بلندمدت'}, visionPeriods={short:'کوتاه‌مدت',mid:'میان‌مدت',long:'بلندمدت'};let activeMission='daily',activeVision='short',activeFinance='overview',activeSelf='good',activeCouple='goals',activeMemory=null,calendarDate=new Date();
const today=new Date(), faDate=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(today), faWeekDays=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toFa(n){return String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function num(v){return Number(String(v||'').replace(/[^\d.]/g,''))||0}function money(n){return new Intl.NumberFormat('fa-IR').format(n||0)}function val(id){return ($('#'+id)?.value||'').trim()}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.nevoToast);window.nevoToast=setTimeout(()=>toast.classList.remove('show'),2300)}
function nav(){document.querySelectorAll('.nav[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view))}function shell(title,body){return `<div class="subpage"><div class="top"><div class="back-title"><button class="back" onclick="backOne()">‹</button><h1 class="page-title">${title}</h1></div><button class="icon-btn" onclick="showToast('این فضا برای نوشته‌های خودت آماده است')">⋮</button></div>${body}</div>`}
function home(){const total=state.tasks.length,done=state.tasks.filter(t=>t.done||t[3]).length,p=total?Math.round(done*100/total):0;return `<div class="top"><button class="icon-btn" onclick="showToast('منوی سریع آمادهٔ شخصی‌سازی است')">☰</button><div class="brand"><img src="assets/nevo-logo.jpg" alt="NEVo">NEVo</div><button class="icon-btn" onclick="showToast('اعلانی ثبت نشده')">♧</button></div><section class="hero"><img class="hero-logo" src="assets/nevo-logo.jpg" alt="NEVo"><h1 class="hello">${state.profileName?'سلام '+esc(state.profileName):'سلام'}</h1><p class="sub">هر روز یک قدم به نسخهٔ بهتر خودت نزدیک‌تر شو…</p><div class="quote"><b>✦</b><span>این فضا را با برنامه‌ها و هدف‌های خودت بساز</span><span style="margin-right:auto">›</span></div><div class="date-row"><strong>${faDate}</strong><span>☼ روز خوبی داشته باشی</span></div></section><div class="section-head"><h2>مسیرهای رشد</h2><button onclick="go('reports')">گزارش‌ها</button></div><div class="grid"><button class="tile" onclick="go('mission')"><span class="ico">🎯</span><strong>ماموریت</strong><small>برنامه و اجرای مسیر</small></button><button class="tile" onclick="go('vision')"><span class="ico">⛰</span><strong>ویژن</strong><small>تصویر آیندهٔ من</small></button><button class="tile" onclick="go('finance')"><span class="ico">🪙</span><strong>مسیر آزادی</strong><small>آرامش مالی</small></button><button class="tile" onclick="go('memories')"><span class="ico">📷</span><strong>خاطرات قشنگ</strong><small>لحظه‌های ارزشمند</small></button><button class="tile" onclick="go('self')"><span class="ico">🌿</span><strong>خودشناسی</strong><small>رشد فردی</small></button><button class="tile" onclick="go('couple')"><span class="ico">♥</span><strong>ما</strong><small>رابطه و احساسات</small></button></div><div class="section-head"><h2>پیشرفت امروز</h2><button onclick="go('mission')">جزئیات ›</button></div><div class="progress-card"><div class="ring" style="--progress:${p}%"><b>${toFa(p)}٪</b></div><div class="progress-meta"><strong>${total?'پیشرفت برنامه‌ها':'شروع مسیر شخصی تو'}</strong><span>${total?`${toFa(done)} برنامه از ${toFa(total)} انجام شده`:'هنوز برنامه‌ای ثبت نشده؛ اولین مورد را خودت اضافه کن.'}</span></div></div>`}
function faParts(d){const ps=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).formatToParts(d);return Object.fromEntries(ps.map(x=>[x.type,x.value]))}function sameDay(a,b){return a.toDateString()===b.toDateString()}function moveMonth(n){calendarDate.setDate(calendarDate.getDate()+n*32);render()}
function calendarMarkup(){const cur=faParts(calendarDate),first=new Date(calendarDate);let g=0;while(!/^۱$|^1$/.test(faParts(first).day)&&g++<35)first.setDate(first.getDate()-1);const offset=(first.getDay()+1)%7,cells=Array.from({length:offset},()=>'<div class="day muted"></div>');for(let i=0;i<42-offset;i++){const d=new Date(first);d.setDate(first.getDate()+i);const p=faParts(d),muted=p.month!==cur.month||p.year!==cur.year,key=d.toISOString().slice(0,10),has=state.events.some(e=>e.date===key),cls=['day',muted?'muted':'',sameDay(d,new Date())?'today':'',has?'has-event':''].filter(Boolean).join(' ');cells.push(`<div class="${cls}" title="${esc(p.weekday)}">${p.day}</div>`)}return `<div class="calendar-card"><div class="month-head"><button class="arrow" onclick="moveMonth(-1)">‹</button><strong>${new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'long',year:'numeric'}).format(calendarDate)}</strong><button class="arrow" onclick="moveMonth(1)">›</button></div><div class="week">${faWeekDays.map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells.join('')}</div><div style="margin-top:12px;text-align:center;color:#6f8884;font-size:11px">امروز: ${cur.weekday}، ${cur.day} ${cur.month}</div></div>`}
function calendar(){return shell('تقویم',`<div class="pillbar"><button class="pill active">ماه</button><button class="pill">هفته</button><button class="pill">روز</button><button class="pill">روزهای شخصی</button></div>${calendarMarkup()}<div class="section-head"><h2>روزهای شخصی تو</h2><button onclick="eventForm()">＋ افزودن روز</button></div>${state.events.length?`<div class="list">${state.events.slice().reverse().map(e=>`<button class="task" onclick="eventForm('${e.id}')"><span class="task-emoji">✦</span><span class="task-info"><span class="task-name">${esc(e.title)}</span><span class="task-time">${esc(e.date)}${e.note?' · '+esc(e.note):''}</span></span><span>›</span></button>`).join('')}</div>`:`<div class="panel" style="text-align:center;color:var(--muted);font-size:12px;line-height:2">هنوز روز خاصی ثبت نشده.<br>اسم روزهای مهمت را خودت اضافه کن.</div>`}`)}
function taskHTML(t){const done=t.done||t[3],title=t.title||t[0],time=t.time||t[1]||'';return `<button class="task ${done?'done':''}" onclick="toggleTask('${t.id||''}')"><span class="check">✓</span><span class="task-info"><span class="task-name">${esc(title)}</span><span class="task-time">${esc(t.date||'بدون تاریخ')}${time?' · '+esc(time):''}</span></span><span class="task-emoji">${done?'✓':'✦'}</span></button>`}
function mission(){const list=state.tasks.filter(t=>(t.period||'daily')===activeMission);return shell('ماموریت',`<div class="feature"><h3>برنامه‌ریزی و اجرای مسیر زندگی</h3><p>برنامه‌های روزانه، هفتگی، ماهانه، میان‌مدت و بلندمدت را خودت ثبت و پیگیری کن.</p></div><div class="pillbar" style="margin-top:12px">${Object.entries(periods).map(([k,v])=>`<button class="pill ${activeMission===k?'active':''}" onclick="activeMission='${k}';render()">${v}</button>`).join('')}</div>${list.length?`<div class="list">${list.map(taskHTML).join('')}</div>`:`<div class="panel" style="text-align:center;color:var(--muted);font-size:12px;line-height:2">در بخش ${periods[activeMission]} برنامه‌ای ثبت نشده.<br>اولین برنامه را خودت اضافه کن.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="taskForm()">＋ افزودن برنامه</button>`)}
function vision(){const list=state.goals.filter(g=>(g.period||'short')===activeVision);return shell('ویژن',`<div class="feature"><h3>تصویر آیندهٔ تو</h3><p>اهداف کوتاه‌مدت، میان‌مدت و بلندمدتت را با متن و تصویر خودت ثبت کن.</p></div><div class="pillbar" style="margin-top:12px">${Object.entries(visionPeriods).map(([k,v])=>`<button class="pill ${activeVision===k?'active':''}" onclick="activeVision='${k}';render()">${v}</button>`).join('')}</div>${list.length?`<div class="vision-grid">${list.map(g=>`<button class="vision-card" ${g.image?`style="background-image:url('${esc(g.image)}')"`:''} onclick="goalForm('${g.id}')"><div><strong>${esc(g.title)}</strong><small>${esc(g.note||'')}</small></div></button>`).join('')}</div>`:`<div class="panel" style="text-align:center;color:var(--muted);font-size:12px;line-height:2">در این بازه هدفی ثبت نشده.<br>هدف و تصویر آینده‌ات را خودت اضافه کن.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="goalForm()">＋ افزودن هدف و تصویر</button>`)}
function finance(){const total=state.income.reduce((s,x)=>s+num(x.amount),0),pending=state.debts.filter(x=>!x.paid).reduce((s,x)=>s+num(x.amount),0),allocations=state.allocations||[],allocatedPct=allocations.reduce((s,x)=>s+num(x.percent),0),remaining=Math.max(0,100-allocatedPct);let body=activeFinance==='overview'?`<div class="money"><h3>خلاصهٔ مالی من</h3><div class="amount">${money(total)} <small>تومان</small></div><div class="bar"><i style="width:${total?100:0}%"></i></div><small>${total?'درآمد ثبت‌شده':'هنوز درآمدی ثبت نشده'}</small></div><div class="split"><div class="stat"><b>${money(pending)}</b><span>تعهد باز</span></div><div class="stat"><b>${state.debts.length}</b><span>قسط و بدهی</span></div><div class="stat"><b>${money(total-pending)}</b><span>مانده تقریبی</span></div><div class="stat"><b>${state.income.length}</b><span>درآمدها</span></div></div><div class="panel" style="margin-top:12px"><div class="section-head" style="margin-top:0"><h2>تقسیم درآمد</h2><button onclick="allocationForm()">＋ افزودن سهم</button></div>${allocations.length?`<div class="list">${allocations.map(a=>{const pct=num(a.percent),amount=Math.round(total*pct/100);return `<div class="task"><span class="task-emoji">◈</span><span class="task-info"><span class="task-name">${esc(a.name)}</span><span class="task-time">${toFa(pct)}٪ از درآمد · ${money(amount)} تومان</span></span></div>`}).join('')}</div><div class="feature" style="margin-top:11px"><p>جمع درصدها: ${toFa(allocatedPct)}٪ · باقی‌مانده: ${toFa(remaining)}٪</p></div>`:`<div class="panel" style="text-align:center;color:var(--muted);font-size:12px;line-height:2;background:#f8fcfb">هنوز سهمی تعریف نشده.<br>دسته‌ها و درصدهای دلخواهت را خودت اضافه کن.</div>`}<button class="gold-btn" style="width:100%;padding:13px;margin-top:12px" onclick="allocationForm()">＋ تعریف درصد جدید</button></div>`:activeFinance==='income'?`<div class="section-head"><h2>درآمدها</h2><button onclick="incomeForm()">＋ افزودن</button></div>${state.income.length?`<div class="list">${state.income.map(x=>`<div class="task"><span class="task-emoji">＋</span><span class="task-info"><span class="task-name">${esc(x.source||'درآمد')}</span><span class="task-time">${esc(x.date||'بدون تاریخ')}</span></span><b style="color:#0b8d86">${money(x.amount)} تومان</b></div>`).join('')}</div>`:`<div class="panel" style="text-align:center;color:var(--muted);font-size:12px;line-height:2">هنوز درآمدی ثبت نشده.</div>`}<button class="gold-btn" style="width:100%;padding:13px;margin-top:14px" onclick="incomeForm()">＋ ثبت درآمد</button>`:`<div class="section-head"><h2>بدهی‌ها و قسط‌ها</h2><button onclick="debtForm()">＋ افزودن</button></div>${state.debts.length?`<div class="list">${state.debts.map(d=>`<button class="task ${d.paid?'done':''}" onclick="toggleDebt('${d.id}')"><span class="check">✓</span><span class="task-info"><span class="task-name">${esc(d.title)}</span><span class="task-time">در وجه ${esc(d.payee||'')} · ${esc(d.due||'بدون تاریخ')}</span></span><b style="color:${d.paid?'#0b8d86':'#c55a42'}">${money(d.amount)}</b></button>`).join('')}</div>`:`<div class="panel" style="text-align:center;color:var(--muted);font-size:12px;line-height:2">لیست تعهدات خالی است.<br>فقط مواردی که خودت وارد می‌کنی اینجا قرار می‌گیرند.</div>`}<button class="primary" style="width:100%;padding:13px;margin-top:14px" onclick="debtForm()">＋ ثبت بدهی یا قسط</button>`;return shell('مسیر آزادی',`<div class="pillbar"><button class="pill ${activeFinance==='overview'?'active':''}" onclick="activeFinance='overview';render()">خلاصه</button><button class="pill ${activeFinance==='income'?'active':''}" onclick="activeFinance='income';render()">درآمد</button><button class="pill ${activeFinance==='debts'?'active':''}" onclick="activeFinance='debts';render()">تعهدات</button></div>${body}<div class="export-row"><button onclick="exportReport('finance','doc')">گزارش متنی</button><button onclick="exportReport('finance','pdf')">چاپ / PDF</button></div>`)}
function memories(){return shell('خاطرات قشنگ',`<div class="feature"><h3>خاطراتت را مثل نامه نگه دار</h3><p>هر خاطره با تاریخ، عنوان بزرگ و متن خودت داخل برنامه باز می‌شود.</p></div>${activeMemory?memoryReader():`${state.memories.length?`<div class="list">${state.memories.slice().reverse().map(m=>`<button class="task" onclick="activeMemory='${m.id}';render()"><span class="task-emoji">✉</span><span class="task-info"><span class="task-name">${esc(m.title)}</span><span class="task-time">${esc(m.date||'بدون تاریخ')} · ${esc(m.part||'بدون پارت')}</span></span><span>›</span></button>`).join('')}</div>`:`<div class="panel" style="text-align:center;color:var(--muted);font-size:12px;line-height:2">هنوز خاطره‌ای ثبت نشده.<br>اولین نامهٔ شخصی‌ات را خودت بنویس.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="memoryForm()">＋ ثبت خاطره</button>`}`)}function memoryReader(){const m=state.memories.find(x=>x.id===activeMemory);if(!m){activeMemory=null;return ''}return `<article class="panel" style="margin-top:13px;line-height:2"><small style="color:var(--muted)">${esc(m.date||'بدون تاریخ')} · ${esc(m.part||'بدون پارت')}</small><h2 style="font-size:24px;margin:9px 0 14px;color:var(--deep)">${esc(m.title)}</h2><p style="white-space:pre-wrap;font-size:13px">${esc(m.body)}</p></article><div class="export-row"><button onclick="exportReport('memory','doc')">خروجی متنی</button><button onclick="exportReport('memory','pdf')">چاپ / PDF</button></div>`}
function self(){const arr=state.self[activeSelf]||[];return shell('خودشناسی',`<div class="feature"><h3>شناختن خودت، شروع تغییر است</h3><p>ویژگی‌ها و عادت‌های هدف خودت را بنویس و هر روز پیگیری کن.</p></div><div class="pillbar" style="margin-top:12px">${[['good','اخلاق‌های خوب'],['bad','اخلاق‌های بد'],['targets','عادت‌های هدف']].map(x=>`<button class="pill ${activeSelf===x[0]?'active':''}" onclick="activeSelf='${x[0]}';render()">${x[1]}</button>`).join('')}</div>${arr.length?`<div class="list">${arr.map(x=>`<div class="task"><span class="task-emoji">🌿</span><span class="task-info"><span class="task-name">${esc(x.text)}</span><span class="task-time">ثبت‌شده توسط خودت</span></span></div>`).join('')}</div>`:`<div class="panel" style="text-align:center;color:var(--muted);font-size:12px;line-height:2">در این بخش چیزی ثبت نشده.<br>شناخت خودت را از نوشته‌های خودت بساز.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="selfForm()">＋ افزودن</button><div class="export-row"><button onclick="exportReport('self','doc')">گزارش متنی</button><button onclick="exportReport('self','pdf')">چاپ / PDF</button></div>`)}
function couple(){const arr=state.couple[activeCouple]||[],labels={goals:'اهداف ما',memories:'خاطرات',myGood:'خوبی‌های من',myBad:'بدی‌های من',partnerGood:'خوبی‌های پارتنر',partnerBad:'بدی‌های پارتنر',habits:'عادت‌های رابطه'};return shell('ما ♥',`<div class="couple"><h3>مسیر مشترک ما</h3><p>اهداف، خاطرات، ویژگی‌ها و عادت‌های رابطه را خودتان ثبت و پیگیری کنید.</p></div><div class="pillbar" style="margin-top:12px">${Object.entries(labels).map(([k,v])=>`<button class="pill ${activeCouple===k?'active':''}" onclick="activeCouple='${k}';render()">${v}</button>`).join('')}</div>${arr.length?`<div class="list">${arr.map(x=>`<div class="task"><span class="task-emoji">♥</span><span class="task-info"><span class="task-name">${esc(x.text)}</span><span class="task-time">${esc(x.date||'ثبت‌شده توسط شما')}</span></span></div>`).join('')}</div>`:`<div class="panel" style="text-align:center;color:var(--muted);font-size:12px;line-height:2">در این بخش چیزی ثبت نشده.<br>اطلاعات رابطه را خودتان وارد کنید.</div>`}<button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="coupleForm()">＋ افزودن</button><div class="section-head"><h2>تحلیل کلی رابطه</h2><button onclick="exportReport('couple','pdf')">گزارش</button></div><div class="panel" style="font-size:12px;line-height:2;color:var(--muted)">${Object.values(state.couple).reduce((n,a)=>n+a.length,0)?'تحلیل بر اساس اطلاعاتی که خودتان وارد کرده‌اید ساخته می‌شود.':'هنوز اطلاعاتی برای تحلیل رابطه ثبت نشده است.'}</div>`)}
function reports(){return shell('گزارش‌ها',`<div class="money"><h3>داشبورد شخصی</h3><div class="amount">${toFa(state.tasks.filter(t=>t.done||t[3]).length)} <small>برنامه انجام‌شده</small></div><small>گزارش‌ها از اطلاعاتی ساخته می‌شوند که خودت وارد کرده‌ای.</small></div><div class="split"><div class="stat"><b>${state.tasks.length}</b><span>برنامه‌ها</span></div><div class="stat"><b>${state.goals.length}</b><span>هدف‌ها</span></div><div class="stat"><b>${state.memories.length}</b><span>خاطرات</span></div><div class="stat"><b>${state.debts.filter(x=>!x.paid).length}</b><span>تعهد باز</span></div></div><div class="export-row"><button onclick="exportReport('all','doc')">گزارش متنی کامل</button><button onclick="exportReport('all','pdf')">چاپ / PDF</button></div>`)}
function profile(){return shell('پروفایل',`<div class="panel" style="display:flex;align-items:center;gap:14px"><img src="assets/nevo-logo.jpg" style="width:64px;height:64px;border-radius:21px;object-fit:cover;object-position:50% 20%"><div><h2 style="margin:0 0 6px;font-size:18px">${esc(state.profileName||'پروفایل شخصی')}</h2><span style="font-size:11px;color:var(--muted)">${state.profileName?'نام ثبت‌شده توسط خودت':'اطلاعاتت را خودت تکمیل کن'}</span></div></div><div class="panel" style="margin-top:12px"><label style="font-size:11px;color:var(--muted)">نام نمایشی</label><input id="profileName" value="${esc(state.profileName)}" placeholder="نام را وارد کن" style="width:100%;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:14px"><button class="primary" style="width:100%;padding:13px;margin-top:11px" onclick="saveProfile()">ذخیرهٔ پروفایل</button></div><div class="list" style="margin-top:12px"><div class="task"><span class="task-emoji">☁️</span><span class="task-info"><span class="task-name">ذخیره روی گوشی</span><span class="task-time">فعال و بدون دادهٔ نمونه</span></span><span>✓</span></div><div class="task"><span class="task-emoji">🔒</span><span class="task-info"><span class="task-name">حریم خصوصی</span><span class="task-time">اطلاعات داخل همین دستگاه</span></span><span>✓</span></div></div>`)}
function render(){const views={home,calendar,mission,vision,finance,memories,self,couple,reports,profile};screen.innerHTML=(views[state.view]||home)();nav();screen.scrollTop=0;window.scrollTo({top:0,behavior:'smooth'})}function go(v){if(state.view!==v){state.history.push(v);state.view=v;activeMemory=null;save();render()}}function backOne(){if(modal.classList.contains('show')){closeModal();return true}if(activeMemory){activeMemory=null;render();return true}if(state.history.length>1){state.history.pop();state.view=state.history[state.history.length-1];render();return true}return false}window.nevoBack=backOne;
function toggleTask(i){const t=state.tasks.find(x=>x.id===i);if(t){t.done=!t.done;save();render()}}function toggleDebt(i){const d=state.debts.find(x=>x.id===i);if(d){d.paid=!d.paid;save();render()}}function closeModal(){modal.classList.remove('show');modal.innerHTML=''}function form(title,body,fn){modal.innerHTML=`<div class="sheet"><div class="sheet-head"><h2>${title}</h2><button class="close" type="button" onclick="closeModal()">×</button></div><form id="f">${body}<button class="save" type="submit">ذخیره</button></form></div>`;modal.classList.add('show');$('#f').onsubmit=e=>{e.preventDefault();fn()}}
function taskForm(){form('افزودن برنامه',`<div class="field"><label>عنوان برنامه</label><input id="tTitle" placeholder="عنوان را وارد کن" required></div><div class="field"><label>دوره</label><select id="tPeriod">${Object.entries(periods).map(([k,v])=>`<option value="${k}" ${k===activeMission?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>تاریخ</label><input id="tDate" type="date"></div><div class="field"><label>ساعت</label><input id="tTime" type="time"></div>`,()=>{state.tasks.unshift({id:id(),title:val('tTitle'),period:val('tPeriod'),date:val('tDate'),time:val('tTime'),done:false});activeMission=val('tPeriod');save();closeModal();render()})}
function goalForm(existing){const g=state.goals.find(x=>x.id===existing)||{};form('افزودن هدف و تصویر',`<div class="field"><label>عنوان هدف</label><input id="gTitle" value="${esc(g.title||'')}" placeholder="عنوان هدف را وارد کن" required></div><div class="field"><label>بازه</label><select id="gPeriod">${Object.entries(visionPeriods).map(([k,v])=>`<option value="${k}" ${(g.period||activeVision)===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>لینک تصویر هدف</label><input id="gImage" value="${esc(g.image||'')}" placeholder="لینک تصویر را وارد کن"></div><div class="field"><label>توضیح</label><textarea id="gNote" placeholder="توضیح هدف را خودت بنویس">${esc(g.note||'')}</textarea></div>`,()=>{const o={id:g.id||id(),title:val('gTitle'),period:val('gPeriod'),image:val('gImage'),note:val('gNote')};if(g.id)state.goals=state.goals.map(x=>x.id===g.id?o:x);else state.goals.unshift(o);activeVision=o.period;save();closeModal();render()})}
function allocationForm(){form('تقسیم درصدی درآمد',`<div class="field"><label>عنوان سهم</label><input id="aName" placeholder="مثلاً هزینه، پس‌انداز یا قسط" required></div><div class="field"><label>درصد از درآمد</label><input id="aPercent" type="number" min="0" max="100" step="1" placeholder="درصد را وارد کن" required></div>`,()=>{const pct=num(val('aPercent')),used=(state.allocations||[]).reduce((s,x)=>s+num(x.percent),0);if(pct>100||used+pct>100){showToast('جمع درصدها نباید بیشتر از ۱۰۰ باشد');return}state.allocations.unshift({id:id(),name:val('aName'),percent:pct});save();closeModal();render()})}
function incomeForm(){form('ثبت درآمد',`<div class="field"><label>مبلغ به تومان</label><input id="iAmount" inputmode="numeric" placeholder="مبلغ را وارد کن" required></div><div class="field"><label>منبع درآمد</label><input id="iSource" placeholder="منبع را وارد کن"></div><div class="field"><label>تاریخ</label><input id="iDate" type="date"></div>`,()=>{state.income.unshift({id:id(),amount:num(val('iAmount')),source:val('iSource'),date:val('iDate')});save();closeModal();render()})}function debtForm(){form('ثبت بدهی یا قسط',`<div class="field"><label>توضیح بدهی یا قسط</label><input id="dTitle" placeholder="توضیح را وارد کن" required></div><div class="field"><label>در وجه</label><input id="dPayee" placeholder="نام شخص، بانک یا اپلیکیشن"></div><div class="field"><label>مبلغ به تومان</label><input id="dAmount" inputmode="numeric" placeholder="مبلغ را وارد کن" required></div><div class="field"><label>تاریخ تسویه</label><input id="dDue" type="date"></div>`,()=>{state.debts.unshift({id:id(),title:val('dTitle'),payee:val('dPayee'),amount:num(val('dAmount')),due:val('dDue'),paid:false});save();closeModal();render()})}
function memoryForm(){form('ثبت خاطره به شکل نامه',`<div class="field"><label>عنوان خاطره</label><input id="mTitle" placeholder="عنوان را وارد کن" required></div><div class="field"><label>تاریخ</label><input id="mDate" type="date"></div><div class="field"><label>نام پارت</label><input id="mPart" placeholder="نام پارت را خودت انتخاب کن"></div><div class="field"><label>متن خاطره</label><textarea id="mBody" placeholder="متن خاطره را اینجا بنویس" required></textarea></div>`,()=>{state.memories.unshift({id:id(),title:val('mTitle'),date:val('mDate'),part:val('mPart'),body:val('mBody')});save();closeModal();render()})}function eventForm(existing){const e=state.events.find(x=>x.id===existing)||{};form('نام‌گذاری یک روز خاص',`<div class="field"><label>اسم روز</label><input id="eTitle" value="${esc(e.title||'')}" placeholder="اسم روز را وارد کن" required></div><div class="field"><label>تاریخ</label><input id="eDate" type="date" value="${esc(e.date||'')}" required></div><div class="field"><label>توضیح</label><textarea id="eNote" placeholder="توضیح اختیاری">${esc(e.note||'')}</textarea></div>`,()=>{const o={id:e.id||id(),title:val('eTitle'),date:val('eDate'),note:val('eNote')};if(e.id)state.events=state.events.map(x=>x.id===e.id?o:x);else state.events.unshift(o);save();closeModal();render()})}
function selfForm(){form('افزودن به خودشناسی',`<div class="field"><label>متن</label><textarea id="sText" placeholder="خودت بنویس" required></textarea></div>`,()=>{state.self[activeSelf].unshift({id:id(),text:val('sText')});save();closeModal();render()})}function coupleForm(){form('افزودن به رابطه',`<div class="field"><label>متن</label><textarea id="cText" placeholder="خودتان بنویسید" required></textarea></div><div class="field"><label>تاریخ</label><input id="cDate" type="date"></div>`,()=>{state.couple[activeCouple].unshift({id:id(),text:val('cText'),date:val('cDate')});save();closeModal();render()})}function saveProfile(){state.profileName=val('profileName');save();showToast('پروفایل ذخیره شد');render()}
function reportText(title,kind='all'){let out=`${title}\nNEVo — نسخهٔ جدید ما\nتاریخ: ${faDate}\n\nبرنامه‌ها: ${state.tasks.length}\nهدف‌ها: ${state.goals.length}\nدرآمدها: ${state.income.length}\nتعهدات: ${state.debts.length}\nخاطرات: ${state.memories.length}`;if(kind==='finance'){out+=`\n\nردیف | عنوان | در وجه | مبلغ | وضعیت\n${state.debts.length?state.debts.map((d,i)=>`${i+1} | ${d.title} | ${d.payee||'—'} | ${money(d.amount)} تومان | ${d.paid?'تسویه شد':'تسویه نشده'}`).join('\n'):'—'}\nمجموع تعهدات باز: ${money(state.debts.filter(d=>!d.paid).reduce((s,d)=>s+num(d.amount),0))} تومان`;if(state.allocations?.length)out+=`\n\nدرصدبندی درآمد\n${state.allocations.map(a=>`${a.name}: ${a.percent}%`).join('\n')}`}return out}
function exportReport(kind,type){const title=kind==='finance'?'گزارش مالی NEVo':kind==='memory'?'خاطرهٔ NEVo':kind==='self'?'گزارش خودشناسی NEVo':kind==='couple'?'تحلیل رابطه NEVo':'گزارش کامل NEVo';const text=reportText(title,kind);if(type==='doc'){const b=new Blob([text],{type:'application/msword'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='NEVo-report.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}else{const w=window.open('','_blank');if(w){w.document.write(`<html dir="rtl"><meta charset="utf-8"><body style="font-family:Tahoma;line-height:2;padding:30px;white-space:pre-wrap">${esc(text)}</body></html>`);w.document.close();w.print()}else showToast('صفحهٔ چاپ در دسترس نیست')}}
$('#addBtn').onclick=()=>state.view==='mission'?taskForm():state.view==='vision'?goalForm():state.view==='calendar'?eventForm():state.view==='finance'?incomeForm():state.view==='memories'?memoryForm():state.view==='self'?selfForm():state.view==='couple'?coupleForm():taskForm();document.querySelectorAll('.nav[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});render();
</script>
</body></html>
