<style>

button{font:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid #56d8c6;outline-offset:3px}.screen{padding:16px 18px 105px;min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;padding:4px 1px 12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.5px;font-size:23px;color:var(--deep)}.brand img{width:40px;height:40px;border-radius:13px;object-fit:cover;object-position:50% 20%;box-shadow:0 5px 16px #0a676622}.icon-btn{width:40px;height:40px;border-radius:14px;background:#fff;border:1px solid var(--line);color:var(--deep);font-size:20px;box-shadow:0 5px 16px #0a676611}.header-actions{display:flex;gap:8px}.hero{min-height:226px;border-radius:30px;overflow:hidden;position:relative;background:linear-gradient(145deg,#074e53,#0c837e);box-shadow:var(--shadow);color:#fff;padding:26px 22px;margin-bottom:14px}.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(4,49,55,.32),rgba(3,54,55,.78)),url('assets/nevo-mountains.jpg');background-size:cover;background-position:center 48%;opacity:.97}.hero>*{position:relative}.hero-logo{width:69px;height:69px;object-fit:cover;object-position:50% 20%;border-radius:21px;border:1px solid #f5d37f88;box-shadow:0 8px 20px #001d2d55;margin-bottom:13px}.hello{font-size:24px;font-weight:800;margin:0 0 6px}.sub{font-size:13px;color:#e6fffb;margin:0;opacity:.94}.quote{margin-top:20px;padding:12px 15px;border-radius:18px;background:#ffffff1a;border:1px solid #ffffff33;backdrop-filter:blur(8px);font-size:13px;display:flex;align-items:center;gap:9px}.quote b{color:#f8d176}.date-row{display:flex;align-items:center;justify-content:space-between;margin-top:18px;font-size:12px;color:#d8fff9}.date-row strong{font-size:14px;color:#fff}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 11px}.section-head h2{font-size:16px;margin:0}.section-head button{background:transparent;color:var(--teal);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{min-height:110px;border-radius:22px;padding:15px 10px 12px;color:#fff;text-align:center;background:linear-gradient(150deg,#087e7d,#075957);box-shadow:0 10px 22px #08716d25;border:1px solid #8ce6dc44;transition:.2s}.tile:nth-child(2),.tile:nth-child(5){background:linear-gradient(150deg,#0b8883,#0b6664)}.tile:nth-child(3){background:linear-gradient(150deg,#d7a23a,#a9781d)}.tile:nth-child(6){background:linear-gradient(150deg,#11a29a,#087d78)}.tile:hover{transform:translateY(-2px)}.tile .ico{display:block;font-size:28px;margin-bottom:8px}.tile strong{display:block;font-size:13px}.tile small{font-size:10px;opacity:.8;display:block;margin-top:4px}.progress-card{border-radius:25px;padding:17px;background:#fff;border:1px solid var(--line);box-shadow:0 12px 27px #0c77730f;display:flex;align-items:center;gap:15px}.ring{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--mint) 0 70%,#dff0ed 70% 100%);position:relative;flex:0 0 auto}.ring:after{content:"";width:56px;height:56px;background:#fff;border-radius:50%;position:absolute}.ring b{z-index:1;font-size:17px}.progress-meta{flex:1}.progress-meta strong{display:block;font-size:15px}.progress-meta span{display:block;font-size:11px;color:var(--muted);margin-top:6px}.metrics{display:flex;justify-content:space-between;margin-top:13px;gap:6px}.metric{flex:1;text-align:center;background:#f2faf8;border-radius:14px;padding:9px 4px}.metric b{display:block;color:var(--deep);font-size:14px}.metric small{color:var(--muted);font-size:10px}.bottom{position:fixed;bottom:0;z-index:30;width:min(100%,470px);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;gap:4px}.nav{background:transparent;color:#8ba29f;border-radius:16px;padding:7px 3px 5px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav i{font-style:normal;font-size:21px;line-height:1}.nav.active{color:var(--teal);font-weight:800}.nav.plus{margin-top:-27px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#fff;border:6px solid #fff;width:58px;height:58px;justify-self:center;border-radius:22px;box-shadow:0 10px 25px #c697303d;font-size:24px}.nav.plus span{display:none}.subpage .top{margin-bottom:4px}.back-title{display:flex;align-items:center;gap:10px}.back{background:transparent;font-size:24px;color:var(--deep)}.page-title{font-size:20px;font-weight:900;margin:0}.pillbar{display:flex;gap:8px;overflow:auto;padding:4px 1px 10px}.pill{white-space:nowrap;padding:9px 14px;border-radius:14px;background:#fff;color:var(--muted);border:1px solid var(--line);font-size:12px}.pill.active{background:var(--teal);color:white;border-color:var(--teal)}.calendar-card,.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 12px 25px #0c77730b}.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.month-head strong{font-size:18px}.arrow{width:32px;height:32px;border-radius:11px;background:#eaf7f4;color:var(--teal)}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;color:#577875;font-size:9px;margin-bottom:8px;font-weight:800}.week span{white-space:nowrap;overflow:hidden}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.day{height:37px;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:12px;color:var(--deep);position:relative}.day.muted{color:#b8c4c1}.day.today{background:var(--teal);color:#fff;font-weight:bold;box-shadow:0 5px 12px #078f9144}.list{display:flex;flex-direction:column;gap:9px}.task{display:flex;align-items:center;gap:11px;padding:12px 10px;border:1px solid var(--line);border-radius:17px;background:#fbfefd}.check{width:28px;height:28px;border:1.5px solid #b7d8d2;border-radius:10px;display:grid;place-items:center;color:transparent;flex:0 0 auto;background:linear-gradient(145deg,#fff,#f2fbf8);box-shadow:inset 0 1px 2px #fff,0 4px 9px #08716d18;transition:.2s;position:relative;font-size:17px;font-weight:900}.task.done{background:linear-gradient(100deg,#f1fbf8,#fffdf7);border-color:#bfe5dc}.task.done .check{background:linear-gradient(145deg,#19b4a4,#057774);border-color:#0b8d86;color:#fff;box-shadow:0 6px 14px #078f9144}.task.done .check:before{content:"";position:absolute;inset:3px;border:1px solid #ffffff55;border-radius:7px}.task.done .task-name{text-decoration:none;color:var(--deep);font-weight:800}.task-info{flex:1}.task-name{display:block;font-size:13px;font-weight:700}.task-time{display:block;font-size:10px;color:#91a7a3;margin-top:4px}.task-emoji{font-size:21px}.feature{margin-top:13px;padding:15px;border-radius:20px;background:linear-gradient(110deg,#e7faf6,#fff9eb);border:1px solid #c9e7df}.feature h3{margin:0 0 7px;font-size:14px}.feature p{margin:0;color:#68817e;font-size:11px;line-height:1.8}.vision-grid,.memory-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.vision-card{height:142px;border-radius:20px;overflow:hidden;position:relative;color:#fff;background-size:cover;background-position:center}.vision-card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#063e40e8,transparent 70%)}.vision-card div{position:absolute;bottom:12px;right:12px;left:8px;z-index:1}.vision-card strong{font-size:13px;display:block}.vision-card small{font-size:10px;color:#ddf6ed}.money{background:linear-gradient(145deg,#075451,#0a8d86);color:white;border-radius:23px;padding:18px;box-shadow:var(--shadow)}.money h3{margin:0;font-size:14px}.money .amount{font-size:31px;font-weight:900;color:#ffd36f;margin:9px 0}.bar{height:10px;background:#ffffff2a;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:64%;background:linear-gradient(90deg,#61ddd2,#f0c362);border-radius:inherit}.money small{display:block;color:#c8f6ef;margin-top:9px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.stat{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px}.stat b{font-size:19px;display:block}.stat span{font-size:11px;color:var(--muted);display:block;margin-top:5px}.memory{height:135px;border-radius:19px;overflow:hidden;position:relative;background-size:cover;background-position:center}.memory:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#063e40e5,transparent 75%)}.memory div{position:absolute;z-index:1;bottom:10px;right:11px;color:white}.memory strong{display:block;font-size:12px}.memory small{font-size:10px;color:#d1f2ea}.score{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:19px;margin-bottom:10px}.score-name{font-size:13px;font-weight:bold}.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:#dcebe7}.dots i.on{background:var(--teal)}.couple{background:linear-gradient(145deg,#fff8e8,#e9faf6);padding:20px;border-radius:24px;border:1px solid #e9dcba}.couple h3{margin:0 0 7px}.couple p{font-size:12px;line-height:1.8;color:#6f8581;margin:0}.add-box{display:flex;gap:9px;margin-top:14px}.input{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;color:var(--ink);outline:none}.primary{background:linear-gradient(135deg,var(--teal),var(--emerald));color:white;border-radius:14px;padding:0 15px;font-weight:bold}.modal{position:fixed;inset:0;background:#023c3c66;backdrop-filter:blur(8px);z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(100%,470px);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px #003b3b33}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheet h2{font-size:18px;margin:0}.close{background:#eff8f5;border-radius:12px;width:35px;height:35px;color:var(--deep);font-size:20px}.field{margin-top:11px}.field label{display:block;font-size:11px;color:#6f8884;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);font:inherit;outline:none;background:#fbfefd}.save{width:100%;padding:14px;margin-top:15px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:white;border-radius:15px;font-weight:bold}.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(120px);bottom:95px;background:#063e40;color:white;padding:12px 18px;border-radius:13px;font-size:12px;z-index:80;transition:.35s;box-shadow:0 10px 30px #003b3b44}.toast.show{transform:translateX(-50%) translateY(0)}.hide{display:none!important}@media(min-width:700px){body{padding:20px 0}.app{border-radius:30px;min-height:calc(100vh - 40px)}.bottom{position:absolute;border-radius:0 0 30px 30px}}
</style>
</head>
<body>
<div class="app" id="app">
  <main class="screen" id="screen"></main>
  <nav class="bottom" id="bottom">
    <button class="nav active" data-view="home"><i>⌂</i><span>خانه</span></button>
    <button class="nav" data-view="calendar"><i>◫</i><span>تقویم</span></button>
    <button class="nav plus" id="addBtn">＋<span>افزودن</span></button>
    <button class="nav" data-view="reports"><i>⌁</i><span>گزارش‌ها</span></button>
    <button class="nav" data-view="profile"><i>♙</i><span>پروفایل</span></button>
  </nav>
</div>
<div class="modal" id="modal"><div class="sheet"><div class="sheet-head"><h2>افزودن به امروز</h2><button class="close" id="closeModal">×</button></div><div class="field"><label>عنوان</label><input id="newTitle" placeholder="مثلاً ۳۰ دقیقه ورزش" /></div><div class="field"><label>نوع</label><select id="newType"><option>مأموریت</option><option>قرار</option><option>یادآوری</option><option>خاطره</option></select></div><div class="field"><label>ساعت</label><input id="newTime" type="time" value="09:00" /></div><button class="save" id="saveNew">ذخیره در برنامه</button></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), screen=$('#screen'), toast=$('#toast');
const state={view:'home',history:['home'],tasks:[['وزنه‌زدن صبحگاهی','07:00','🏋️',true],['مطالعه و آرامش','09:00','📚',false],['کار و پیگیری','10:30','🧳',true],['جلسه با پارتنر','14:00','💛',false],['برنامه غذایی','18:00','🍎',true]]};
const today=new Date();
const faDate=new Intl.DateTimeFormat('fa-IR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(today);
function nav(){document.querySelectorAll('.nav[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));}
function shell(title,body){return `<div class="subpage"><div class="top"><div class="back-title"><button class="back" onclick="backOne()">‹</button><h1 class="page-title">${title}</h1></div><div class="header-actions"><button class="icon-btn" onclick="showToast('این بخش آمادهٔ شخصی‌سازی است')">⋮</button></div></div>${body}</div>`}
function home(){return `<div class="top"><button class="icon-btn" onclick="showToast('منوی سریع به‌زودی باز می‌شود')">☰</button><div class="brand"><img src="assets/nevo-logo.jpg" alt="NEVo">NEVo</div><button class="icon-btn" onclick="showToast('اعلان جدیدی نداری')">♧</button></div><section class="hero"><img class="hero-logo" src="assets/nevo-logo.jpg" alt="NEVo"><h1 class="hello">سلام محمد جان</h1><p class="sub">هر روز یک قدم به نسخهٔ بهتر خودت نزدیک‌تر شو…</p><div class="quote"><b>✦</b><span>امروز فرصتی تازه برای بهتر شدن است ...</span><span style="margin-right:auto">›</span></div><div class="date-row"><strong>${faDate}</strong><span>☼ روز خوبی داشته باشی</span></div></section><div class="section-head"><h2>مسیرهای رشد</h2><button onclick="go('reports')">نمایش همه</button></div><div class="grid"><button class="tile" onclick="go('mission')"><span class="ico">🎯</span><strong>ماموریت</strong><small>برنامه و هدف</small></button><button class="tile" onclick="go('vision')"><span class="ico">⛰</span><strong>ویژن</strong><small>آیندهٔ من</small></button><button class="tile" onclick="go('finance')"><span class="ico">🪙</span><strong>مسیر آزادی</strong><small>مدیریت مالی</small></button><button class="tile" onclick="go('memories')"><span class="ico">📷</span><strong>خاطرات</strong><small>لحظات ارزشمند</small></button><button class="tile" onclick="go('self')"><span class="ico">🌿</span><strong>خودشناسی</strong><small>رشد فردی</small></button><button class="tile" onclick="go('couple')"><span class="ico">♥</span><strong>ما</strong><small>روابط و احساسات</small></button></div><div class="section-head"><h2>پیشرفت امروز</h2><button onclick="go('mission')">جزئیات ›</button></div><div class="progress-card"><div class="ring"><b>70%</b></div><div class="progress-meta"><strong>امروز را ساختی</strong><span>۳ هدف از ۵ هدف روزانه انجام شد</span><div class="metrics"><div class="metric"><b>۵/۷</b><small>ورزش</small></div><div class="metric"><b>۲/۸</b><small>مطالعه</small></div><div class="metric"><b>۹/۸</b><small>تمرکز</small></div><div class="metric"><b>۷/۹</b><small>خواب</small></div></div></div></div>`}
const faDigits='۰۱۲۳۴۵۶۷۸۹';
const faWeekDays=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const calendarDate=new Date();
function toFa(n){return String(n).replace(/\d/g,d=>faDigits[d])}
function toEn(v){return String(v).replace(/[۰-۹]/g,d=>String(faDigits.indexOf(d)))}
function persianParts(date){
  const parts=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric',weekday:'long'}).formatToParts(date);
  return Object.fromEntries(parts.filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function calendarMarkup(){
  const current=persianParts(calendarDate), currentMonth=toEn(current.month);
  const first=new Date(calendarDate); let guard=0;
  while(toEn(persianParts(first).day)!=='1' && guard++<35) first.setDate(first.getDate()-1);
  const offset=(first.getDay()+1)%7;
  const cells=[];
  for(let i=0;i<42;i++){
    const d=new Date(first); d.setDate(first.getDate()+i);
    const p=persianParts(d); const muted=toEn(p.month)!==currentMonth;
    const cls=['day',muted?'muted':'',sameDay(d,new Date())?'today':''].filter(Boolean).join(' ');
    cells.push(`<div class="${cls}" title="${p.weekday} ${p.day} ${p.month}">${p.day}</div>`);
  }
  return `<div class="calendar-card"><div class="month-head"><button class="arrow" onclick="moveMonth(-1)">‹</button><strong>${new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'long',year:'numeric'}).format(calendarDate)}</strong><button class="arrow" onclick="moveMonth(1)">›</button></div><div class="week">${faWeekDays.map(d=>`<span>${d}</span>`).join('')}</div><div class="days">${cells.join('')}</div><div style="margin-top:12px;text-align:center;color:#6f8884;font-size:11px">امروز: ${current.weekday}، ${current.day} ${current.month}</div></div>`;
}
function moveMonth(delta){calendarDate.setDate(calendarDate.getDate()+delta*32);render()}
function calendar(){return shell('تقویم',`<div class="pillbar"><button class="pill active">ماه</button><button class="pill">هفته</button><button class="pill">روز</button><button class="pill">یادآوری‌ها</button></div>${calendarMarkup()}<div class="section-head"><h2>برنامه‌های امروز</h2><button onclick="openModal()">＋ جدید</button></div><div class="list">${state.tasks.slice(0,4).map(taskHTML).join('')}</div>`)}
function taskHTML(t,i){return `<button class="task ${t[3]?'done':''}" onclick="toggleTask(${i})"><span class="check">✓</span><span class="task-info"><span class="task-name">${t[0]}</span><span class="task-time">${t[1]}</span></span><span class="task-emoji">${t[2]}</span></button>`}
function mission(){return shell('ماموریت',`<div class="feature"><h3>برنامه‌ات برای بهتر شدن زندگی</h3><p>هر هدف بزرگ با یک کار کوچک امروز شروع می‌شود. انجام‌های خودت را ثبت کن و مسیر را ادامه بده.</p></div><div class="pillbar" style="margin-top:12px"><button class="pill active">امروز</button><button class="pill">این هفته</button><button class="pill">اهداف من</button></div><div class="list">${state.tasks.map(taskHTML).join('')}</div><button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="openModal()">＋ افزودن مأموریت</button>`)}
function vision(){return shell('ویژن',`<div class="feature"><h3>تصویر آیندهٔ تو</h3><p>چیزهایی را که می‌خواهی بسازی، واضح ببین؛ بعد هر روز یک قدم به آن نزدیک شو.</p></div><div class="section-head"><h2>تابلو آینده</h2><button onclick="showToast('قابلیت افزودن تصویر آماده می‌شود')">＋ افزودن</button></div><div class="vision-grid"><div class="vision-card" style="background-image:url('assets/nevo-mountains.jpg')"><div><strong>زندگی آرام</strong><small>خانه‌ای نزدیک طبیعت</small></div></div><div class="vision-card" style="background-image:url('assets/nevo-home-reference.jpg')"><div><strong>سبک زندگی من</strong><small>آزاد، منظم، سالم</small></div></div><div class="vision-card" style="background-image:url('assets/nevo-screens.jpg');background-position:30% 20%"><div><strong>نسخهٔ بهتر من</strong><small>تمرکز روی رشد</small></div></div><div class="vision-card" style="background-image:url('assets/nevo-logo.jpg')"><div><strong>مسیر NEVo</strong><small>New Evolution</small></div></div></div><button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="showToast('هدف جدید به ویژن اضافه شد')">＋ افزودن هدف جدید</button>`)}
function finance(){return shell('مسیر آزادی',`<div class="money"><h3>دارایی خالص برنامه‌ریزی‌شده</h3><div class="amount">۵۰,۰۰۰,۰۰۰ <small>تومان</small></div><div class="bar"><i></i></div><small>۶۴٪ از هدف این ماه پیش رفته‌ای</small></div><div class="split"><div class="stat"><b>۳۵٪</b><span>پس‌انداز ماهانه</span></div><div class="stat"><b>۱۲٪</b><span>هزینهٔ ثابت</span></div><div class="stat"><b>۸.۵M</b><span>موجودی آزاد</span></div><div class="stat"><b>۴</b><span>هدف مالی</span></div></div><div class="section-head"><h2>تقسیم‌بندی درآمد</h2><button onclick="showToast('ویرایش بودجه')">ویرایش</button></div><div class="panel"><div class="task"><span class="task-emoji">🏡</span><span class="task-info"><span class="task-name">آینده و خانه</span><span class="task-time">۴۰٪ از درآمد</span></span><strong>۲۰M</strong></div><div class="task"><span class="task-emoji">📈</span><span class="task-info"><span class="task-name">سرمایه‌گذاری</span><span class="task-time">۲۵٪ از درآمد</span></span><strong>۱۲.۵M</strong></div><div class="task"><span class="task-emoji">🌱</span><span class="task-info"><span class="task-name">رشد و یادگیری</span><span class="task-time">۱۰٪ از درآمد</span></span><strong>۵M</strong></div></div>`)}
function memories(){return shell('خاطرات قشنگ',`<div class="pillbar"><button class="pill active">همه</button><button class="pill">سفر</button><button class="pill">ما</button><button class="pill">خودم</button></div><div class="memory-grid"><div class="memory" style="background-image:url('assets/nevo-mountains.jpg')"><div><strong>سفر به شمال</strong><small>۲۸ شهریور ۱۴۰۵</small></div></div><div class="memory" style="background-image:url('assets/nevo-home-reference.jpg');background-position:center"><div><strong>اولین قرار خاص</strong><small>۱۹ شهریور ۱۴۰۵</small></div></div><div class="memory" style="background-image:url('assets/nevo-logo.jpg')"><div><strong>یک شروع تازه</strong><small>۱۵ مهر ۱۴۰۵</small></div></div><div class="memory" style="background-image:url('assets/nevo-screens.jpg');background-position:40% 60%"><div><strong>روزهای خوب کار</strong><small>امروز</small></div></div></div><button class="primary" style="width:100%;padding:14px;margin-top:14px" onclick="showToast('خاطرهٔ جدید آمادهٔ ثبت است')">＋ ثبت خاطره</button>`)}
function self(){return shell('خودشناسی',`<div class="feature"><h3>شناختن خودت، شروع تغییر است</h3><p>هر روز چند دقیقه مکث کن و ببین چه چیزی به تو انرژی می‌دهد و چه چیزی تو را از مسیرت دور می‌کند.</p></div><div class="section-head"><h2>نبض امروز</h2><button onclick="showToast('گزارش هفتگی آماده می‌شود')">گزارش هفتگی</button></div>${[['سردرگمی','۷۰٪','teal'],['ورزش و انرژی','۸۵٪','gold'],['مطالعه','۶۰٪','red'],['کنترل احساسات','۷۵٪','teal'],['مدیریت زمان','۵۵٪','gold'],['شکرگزاری','۹۰٪','teal']].map((x,i)=>`<div class="score"><span class="score-name">${x[0]}</span><span class="dots">${Array.from({length:7},(_,j)=>`<i class="${j<Math.round(parseInt(x[1])/15)?'on':''}" style="${x[2]==='gold'&&j<Math.round(parseInt(x[1])/15)?'background:#e1b34e':''}"></i>`).join('')}</span><b>${x[1]}</b></div>`).join('')}`)}
function couple(){return shell('ما ♥',`<div class="couple"><h3>مسیر مشترک ما</h3><p>اینجا برای گفتگو، خاطرات مشترک و ساختن آینده‌ای که هر دو دوستش دارید.</p><div class="add-box"><input class="input" placeholder="یک یادداشت برای ما…" /><button class="primary" onclick="showToast('یادداشت مشترک ذخیره شد')">ثبت</button></div></div><div class="section-head"><h2>برنامه‌های مشترک</h2><button onclick="openModal()">＋ جدید</button></div><div class="list"><button class="task done"><span class="check">✓</span><span class="task-info"><span class="task-name">گفتگوی آرام امشب</span><span class="task-time">امروز · ۲۰:۳۰</span></span><span class="task-emoji">💬</span></button><button class="task"><span class="check">✓</span><span class="task-info"><span class="task-name">برنامه‌ریزی سفر بعدی</span><span class="task-time">جمعه · ۱۷:۰۰</span></span><span class="task-emoji">🗺️</span></button></div><div class="section-head"><h2>خاطرات مشترک</h2><button onclick="go('memories')">همه</button></div><div class="memory-grid"><div class="memory" style="background-image:url('assets/nevo-home-reference.jpg')"><div><strong>یک روز خاص</strong></div></div><div class="memory" style="background-image:url('assets/nevo-mountains.jpg')"><div><strong>سفر دونفره</strong></div></div></div>`)}
function reports(){return shell('گزارش‌ها',`<div class="money"><h3>خلاصهٔ این هفته</h3><div class="amount">۷۲٪ <small>پیشرفت کلی</small></div><small>از ۲۱ هدف، ۱۵ هدف انجام شده</small></div><div class="section-head"><h2>گزارش‌های سریع</h2></div><div class="split"><button class="stat" onclick="showToast('گزارش رشد باز شد')"><b>🌿</b><span>رشد فردی</span></button><button class="stat" onclick="showToast('گزارش مالی باز شد')"><b>🪙</b><span>مسیر مالی</span></button><button class="stat" onclick="showToast('گزارش رابطه باز شد')"><b>♥</b><span>ما</span></button><button class="stat" onclick="showToast('گزارش عادت‌ها باز شد')"><b>⌁</b><span>عادت‌ها</span></button></div><div class="section-head"><h2>یادآوری</h2></div><div class="panel"><p style="font-size:12px;line-height:2;color:var(--muted);margin:0">سه قدم کوچک امروزت را ثبت کن تا گزارش هفته دقیق‌تر شود.</p></div>`)}
function profile(){return shell('پروفایل',`<div class="panel" style="display:flex;align-items:center;gap:14px"><img src="assets/nevo-logo.jpg" style="width:64px;height:64px;border-radius:21px;object-fit:cover;object-position:50% 20%"><div><h2 style="margin:0 0 6px;font-size:18px">محمد بهرامی</h2><span style="font-size:11px;color:var(--muted)">در مسیر نسخهٔ بهتر خودم</span></div></div><div class="section-head"><h2>تنظیمات فضای شخصی</h2></div><div class="list"><button class="task" onclick="showToast('همگام‌سازی فعال است')"><span class="task-emoji">☁️</span><span class="task-info"><span class="task-name">فضای ابری و همگام‌سازی</span><span class="task-time">اطلاعاتت همیشه همراهت باشد</span></span><strong style="color:var(--teal)">روشن</strong></button><button class="task" onclick="showToast('اعلان‌ها مدیریت شدند')"><span class="task-emoji">🔔</span><span class="task-info"><span class="task-name">یادآوری‌ها</span><span class="task-time">برنامه، هدف و پرداخت‌ها</span></span><strong style="color:var(--teal)">روشن</strong></button><button class="task" onclick="showToast('پشتیبان‌گیری انجام شد')"><span class="task-emoji">🔒</span><span class="task-info"><span class="task-name">امنیت و حریم خصوصی</span><span class="task-time">کنترل اطلاعات شخصی</span></span><span>›</span></button></div><div class="feature"><h3>NEVo</h3><p>New Evolution · نسخهٔ جدید ما<br>هر روز، یک قدم.</p></div>`)}
function render(){const views={home,calendar,mission,vision,finance,memories,self,couple,reports,profile};screen.innerHTML=views[state.view]();nav();screen.scrollTop=0;window.scrollTo({top:0,behavior:'smooth'})}
function go(v){if(state.view===v)return;state.history.push(v);state.view=v;render()}; function backOne(){if($('#modal')?.classList.contains('show')){closeModal();return true}if(state.history.length>1){state.history.pop();state.view=state.history[state.history.length-1];render();return true}return false}; window.nevoBack=backOne; function toggleTask(i){state.tasks[i][3]=!state.tasks[i][3];render()}; function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toast.classList.remove('show'),2200)}
function openModal(){ $('#modal').classList.add('show'); setTimeout(()=>$('#newTitle').focus(),100)} function closeModal(){ $('#modal').classList.remove('show') }
$('#addBtn').onclick=openModal;$('#closeModal').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});$('#saveNew').onclick=()=>{const title=$('#newTitle').value.trim()||'کار جدید';state.tasks.unshift([title,$('#newTime').value||'09:00','✦',false]);closeModal();showToast('به برنامه اضافه شد');go('mission')};document.querySelectorAll('.nav[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));render();
</script>
</body></html>
