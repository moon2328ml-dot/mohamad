function aiNormalize(text){return String(text||'').toLowerCase().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/‌/g,' ')}
function aiResponseFor(message){
  const t=aiNormalize(message);
  if(/خودکشی|خودمو بکشم|به خودم آسیب|نمی ?خوام زنده|زنده نباشم|خودم را بکشم/.test(t)) return 'محمد، الان مهم‌ترین چیز امنیت توست. لطفاً تنها نمان و همین حالا با مادرت یا یک آدم قابل اعتماد تماس بگیر و واضح بگو که حالت امن نیست. اگر خطر فوری وجود دارد، با اورژانس محل تماس بگیر یا به نزدیک‌ترین مرکز درمانی برو. من کنار گفت‌وگو با تو هستم، اما در این لحظه کمک انسانی لازم است.';
  if(/خیلی حالم بده|حالم بده|ناامید|تنها|گریه|بی ?انگیزه|خسته ام|خسته‌ام/.test(t)) return 'می‌فهمم داداش؛ لازم نیست همین الان همه‌چیز را حل کنی. اول فقط اسم حس اصلی‌ات را بگو: غم، خشم، ترس، خستگی یا تنهایی؟ بعد با هم یک قدم کوچک برای همین امشب انتخاب می‌کنیم.';
  if(/استرس|اضطراب|ترس|نگران|فشار ذهنی|ذهنم شلوغ/.test(t)) return 'بیا اول فشار را یک پله پایین بیاوریم: چهار ثانیه دم، شش ثانیه بازدم، پنج بار. بعد روی کاغذ یا همین‌جا دو ستون بساز: «در کنترل من» و «خارج از کنترل من». فقط از ستون اول یک کار کوچک انتخاب کن.';
  if(/مرز|گمرک|کار|همکار|هادی|خسروی/.test(t)) return 'فشار کاری‌ات واقعی است. امروز لازم نیست کل محیط را تغییر بدهی؛ فقط اتفاق را از برداشتت جدا کن: چه چیزی واقعاً رخ داد، چه چیزی در ذهنت معنا شد و قدم حرفه‌ای بعدی چیست؟ اگر خواستی، ماجرا را در سه خط برایم بنویس تا با هم مرتبش کنیم.';
  if(/پول|مالی|بدهی|قسط|درآمد|خرج/.test(t)) return 'برای اینکه فشار مالی مبهم نماند، فقط یک عدد و یک اقدام مشخص کن: مبلغ تعهد بعدی و کوچک‌ترین کاری که امروز برای درآمد یا کاهش خرج انجام می‌دهی. تصمیم‌های بزرگ را وقتی ذهنت آرام‌تر است بگیر.';
  if(/رابطه|لیلا|جدایی|تنها.*عشق|پارتنر/.test(t)) return 'درد رابطه را نمی‌شود با عجله حذف کرد. امشب فقط بنویس: «چه چیزی را از دست دادم؟ چه چیزی درباره خودم یاد گرفتم؟ از این به بعد چه مرزی لازم دارم؟» لازم نیست جوابش را برای هیچ‌کس بفرستی.';
  if(/کتاب|مطالعه|خواندن|صفحه/.test(t)) return 'برای امروز هدف کوچک بگذار: ده صفحه یا پانزده دقیقه. بعد فقط یک جمله بنویس که چه چیزی به زندگی واقعی‌ات مربوط است. مطالعه وقتی رشد می‌سازد که به یک رفتار تبدیل شود.';
  if(/صبح|امروز چه کار|برنامه امروز|برنامه ام/.test(t)) return 'برنامه سبک امروز: یک کار ضروری، یک کار مالی، پانزده دقیقه مطالعه و یک کار برای آرامش. اگر انرژی‌ات پایین است، نسخه نصفه را انجام بده؛ استمرار از کامل‌بودن مهم‌تر است.';
  return 'من اینجام داداش. حرفت را بدون قضاوت می‌شنوم. اگر بخواهی دقیق‌تر کمک کنم، بگو الان بیشتر دنبال شنیده‌شدن هستی، راه‌حل می‌خواهی یا یک برنامه کوچک برای قدم بعدی؟';
}
function aiTimeLabel(iso){try{return new Intl.DateTimeFormat('fa-IR',{hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}catch(e){return ''}}
function aiSpeak(text){try{if('speechSynthesis' in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fa-IR';u.rate=.92;window.speechSynthesis.speak(u)}else showToast('پخش صوتی روی این گوشی در دسترس نیست')}catch(e){showToast('پخش صوتی آماده نشد')}}
function aiContext(){return {profileName:state.profileName||'',memory:(state.aiMemory||[]).slice(0,12),moods:(state.moodEntries||[]).slice(0,7),recentChats:(state.aiChats||[]).slice(-12),tasks:(state.tasks||[]).slice(0,20).map(t=>({title:t.title||t[0]||'',period:t.period||'',date:t.date||'',done:!!(t.done||t[3])})),goals:(state.goals||[]).slice(0,12).map(g=>({title:g.title||'',note:g.note||'',period:g.period||''}))}}
async function aiRemoteReply(message){const endpoint=aiEndpoint(),providerKey=aiProviderKey();if(!providerKey)throw new Error('کلید مدل هنوز تنظیم نشده؛ از دکمهٔ «تنظیم مدل» استفاده کن');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),35000);try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','apikey':AI_SUPABASE_ANON,'Authorization':'Bearer '+AI_SUPABASE_ANON},body:JSON.stringify({message,context:aiContext(),locale:'fa-IR',apiKey:providerKey}),signal:controller.signal});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||data.message||'خطای سرور '+response.status);const reply=typeof data==='string'?data:(data.reply||data.message||data.output||data.text||'');if(!String(reply).trim())throw new Error('پاسخ خالی از سرور دریافت شد');return String(reply).trim()}catch(e){if(e.name==='AbortError')throw new Error('پاسخ سرور بیش از ۳۵ ثانیه طول کشید');throw e}finally{clearTimeout(timer)}}
function setAiProviderKey(){const current=aiProviderKey();const value=window.prompt('کلید API مدل را وارد کن. این کلید فقط روی همین گوشی ذخیره می‌شود؛ اگر روی سرور تنظیم شده، خالی بگذار.',current?'••••••••••••':'');if(value===null)return;const key=value.trim();if(key)localStorage.setItem(AI_PROVIDER_KEY,key);else localStorage.removeItem(AI_PROVIDER_KEY);showToast(key?'کلید مدل ذخیره شد':'کلید محلی پاک شد');render()}
function setAiEndpoint(){const current=aiEndpoint();const value=window.prompt('آدرس HTTPS سرور هوش مصنوعی را وارد کن (بدون کلید API):',current);if(value===null)return;const endpoint=value.trim();if(endpoint&&!/^https:\/\//i.test(endpoint)){showToast('برای امنیت فقط آدرس HTTPS قبول می‌شود');return}if(endpoint)localStorage.setItem(AI_ENDPOINT_KEY,endpoint);else localStorage.removeItem(AI_ENDPOINT_KEY);showToast(endpoint?'اتصال آنلاین ذخیره شد':'اتصال آنلاین پاک شد');render()}
async function aiSend(raw){const message=(raw||val('aiInput')).trim();if(!message)return;if(localStorage.getItem(AI_CONSENT_KEY)!=='yes'){const ok=window.confirm('برای پاسخ هوشمند، پیام‌ها و خلاصهٔ شخصی‌سازی‌شدهٔ برنامه‌ها، هدف‌ها، حال‌ها و یادآوری‌ها به سرور NEVo و سرویس مدل آنلاین فرستاده می‌شوند. ادامه بدهم؟');if(!ok)return;localStorage.setItem(AI_CONSENT_KEY,'yes')}state.aiChats=state.aiChats||[];const pending={role:'assistant',text:'دارم از سرور آنلاین جواب می‌گیرم…',pending:true,at:aiNow()};state.aiChats.push({role:'user',text:message,at:aiNow()});state.aiChats.push(pending);save();render();setTimeout(()=>{const box=$('#aiChat');if(box)box.scrollTop=box.scrollHeight},30);try{pending.text=await aiRemoteReply(message);pending.online=true}catch(e){pending.text='به هوش مصنوعی آنلاین وصل نشدم. '+(e.message||'خطای نامشخص')+'\n\nپیام را نگه داشتم؛ پس از فعال‌شدن سرویس دوباره بفرست.';pending.online=false}pending.pending=false;pending.at=aiNow();save();render();if(!pending.online)showToast('اتصال هوش مصنوعی برقرار نشد');setTimeout(()=>{const box=$('#aiChat');if(box)box.scrollTop=box.scrollHeight;$('#aiInput')?.focus()},30)}
function aiQuick(type){const prompts={mood:'امروز حالم را بررسی کن',calm:'الان یک تمرین کوتاه برای آرام‌شدن بده',plan:'برای امروز با انرژی فعلی‌ام یک برنامه سبک بده',book:'برای مطالعه امروز یک برنامه کوتاه بده',weekly:'یک مرور هفتگی از مسیرم با من انجام بده'};if(type==='checkin'){moodCheckin();return}if(type==='memory'){aiMemoryForm();return}aiSend(prompts[type]||'کمکم کن قدم بعدی‌ام را پیدا کنم')}
function moodCheckin(){form('ثبت حال امروز',`<div class="field"><label>حال کلی من</label><select id="moodLevel"><option value="1">خیلی سخت</option><option value="2">سخت</option><option value="3" selected>معمولی</option><option value="4">خوب</option><option value="5">خیلی خوب</option></select></div><div class="field"><label>انرژی امروز</label><select id="energyLevel"><option value="1">خیلی کم</option><option value="2">کم</option><option value="3" selected>متوسط</option><option value="4">خوب</option><option value="5">زیاد</option></select></div><div class="field"><label>چه چیزی بیشتر روی تو اثر گذاشت؟</label><textarea id="moodNote" placeholder="خودت بنویس"></textarea></div><div class="field"><label>یک قدم کوچک برای امشب</label><input id="moodStep" placeholder="مثلاً ۱۵ دقیقه مطالعه"></div>`,()=>{state.moodEntries=state.moodEntries||[];state.moodEntries.unshift({id:id(),mood:num(val('moodLevel'))||3,energy:num(val('energyLevel'))||3,note:val('moodNote'),step:val('moodStep'),date:aiNow()});save();closeModal();render();showToast('حال امروزت ثبت شد')})}
function aiMemoryForm(){form('چیزی که باید درباره من بداند',`<div class="field"><label>عنوان</label><input id="aiMemTitle" placeholder="مثلاً هدف اصلی من"></div><div class="field"><label>توضیح شخصی</label><textarea id="aiMemText" placeholder="چیزی که می‌خواهی همراه محمد به یاد داشته باشد" required></textarea></div>`,()=>{const text=val('aiMemText');if(!text){showToast('متن را وارد کن');return}state.aiMemory=state.aiMemory||[];state.aiMemory.unshift({id:id(),title:val('aiMemTitle')||'یادآوری شخصی',text,date:aiNow()});save();closeModal();render();showToast('یادآوری شخصی ذخیره شد')})}
function deleteAiMemory(idv){if(window.confirm('این یادآوری حذف شود؟')){state.aiMemory=(state.aiMemory||[]).filter(x=>x.id!==idv);save();render()}}
function aiWeeklySummary(){const moods=(state.moodEntries||[]).slice(0,7),avg=moods.length?Math.round(moods.reduce((s,x)=>s+num(x.mood),0)/moods.length*10)/10:0,done=state.tasks.filter(t=>t.done||t[3]).length,bookNotes=(state.notes||[]).filter(n=>/کتاب|مطالعه|خواندن/.test((n.title||'')+' '+(n.body||''))).length;return {moods,avg,done,bookNotes}}
function companion(){const chats=state.aiChats||[],sum=aiWeeklySummary(),messages=chats.length?chats.map((m,i)=>`<div class="ai-msg ${m.role==='user'?'user':'assistant'}">${m.role==='assistant'?`<button class="ai-speak" onclick="aiSpeak(${JSON.stringify(m.text)})">🔊</button>`:''}${esc(m.text)}<small>${m.role==='user'?'تو':'همراه محمد'} · ${aiTimeLabel(m.at)}</small></div>`).join(''):`<div class="ai-msg assistant"><button class="ai-speak" onclick="aiSpeak('من اینجام داداش. از حال امروزت شروع کنیم.')">🔊</button>من اینجام داداش. قرار نیست همه‌چیز را یک‌جا حل کنیم؛ فقط یک قدم واقعی برای امروز پیدا می‌کنیم.<small>همراه محمد</small></div>`;const memories=(state.aiMemory||[]).map(x=>`<div class="ai-memory"><span>🧠</span><div class="task-info"><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p></div><button class="mini-btn mini-delete" onclick="deleteAiMemory('${x.id}')">حذف</button></div>`).join('');return shell('همراه محمد',`<div class="ai-card"><span class="ai-badge">🧭 برادر بزرگ‌تر دیجیتال · خصوصی</span><div class="ai-online"><span>● ${aiEndpointLabel()}</span><button onclick="setAiProviderKey()">تنظیم مدل</button><button onclick="localStorage.removeItem(AI_CONSENT_KEY);showToast('تأیید ارسال داده پاک شد')">حریم خصوصی</button></div><h3>اینجام داداش؛ قدم بعدی را با هم پیدا می‌کنیم</h3><p>این بخش برای شنیدن، آموزش مهارت‌های زندگی، آرام‌سازی و برنامه‌ریزی شخصی ساخته شده. گفت‌وگو روی گوشی می‌ماند. پس از تأیید تو، پیام و خلاصهٔ لازم برای شخصی‌سازی به مدل آنلاین ارسال می‌شود. کلید مدل را ترجیحاً در Secrets سرور تنظیم کن؛ اگر روی سرور نداری، دکمهٔ تنظیم مدل کلید را فقط روی همین گوشی نگه می‌دارد.</p><div class="ai-quick"><button onclick="aiQuick('checkin')">☀ ثبت حال امروز</button><button onclick="aiQuick('calm')">🌿 تمرین آرام‌سازی</button><button onclick="aiQuick('plan')">🎯 برنامه امروز</button><button onclick="aiQuick('book')">📖 برنامه مطالعه</button><button onclick="aiQuick('weekly')">📊 مرور هفتگی</button><button onclick="aiQuick('memory')">🧠 یادآوری شخصی</button></div><div class="ai-stat-grid"><div class="ai-stat"><b>${sum.avg?toFa(sum.avg):'—'}</b><span>میانگین حال اخیر</span></div><div class="ai-stat"><b>${toFa(sum.done)}</b><span>برنامه انجام‌شده</span></div><div class="ai-stat"><b>${toFa(sum.bookNotes)}</b><span>یادداشت مطالعه</span></div></div></div><div id="aiChat" class="ai-chat">${messages}</div><div class="ai-composer"><textarea id="aiInput" placeholder="هرچی توی دلت هست بنویس…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();aiSend()}"></textarea><button class="ai-send" onclick="aiSend()">➤</button></div><div class="ai-card"><div class="section-head" style="margin:0 0 4px"><h2 style="color:#075d5d">یادآوری‌های من</h2><button onclick="aiMemoryForm()">＋ افزودن</button></div>${memories||'<p>هنوز چیزی ثبت نشده؛ هر چیزی که می‌خواهی همراه محمد درباره‌ات بداند اینجا بنویس.</p>'}</div><div class="ai-danger">این همراه برای خودشناسی و آموزش مهارت‌های زندگی است و جای روانشناس یا کمک فوری انسانی را نمی‌گیرد. اگر احساس خطر فوری داری، همین حالا با یک آدم قابل اعتماد یا اورژانس محل تماس بگیر.</div><div class="export-row"><button onclick="openReport('ai')">گزارش همراه</button><button onclick="clearAiChats()">پاک‌کردن گفت‌وگو</button></div>`)}
function clearAiChats(){if(!window.confirm('گفت‌وگوهای همراه محمد پاک شوند؟'))return;state.aiChats=[];save();render();showToast('گفت‌وگوها پاک شدند')}

function saveWeight(){const weight=num(val('weightValue')),height=num(val('heightValue')),target=num(val('targetWeight')),note=val('weightNote');if(!weight){showToast('وزن فعلی را وارد کن');return}const bmi=height?Math.round(weight/((height/100)*(height/100))*10)/10:null;state.weightEntries.unshift({id:id(),date:new Date().toISOString(),weight,height,target,bmi,note});save();render();showToast('گزارش تعادل وزن ذخیره شد')}
function deleteWeight(i){if(window.confirm('این ثبت وزن حذف شود؟')){state.weightEntries.splice(i,1);save();render()}}
function balance(){const rows=(state.weightEntries||[]).map((x,i)=>`<div class="task"><span class="task-emoji">⚖️</span><span class="task-info"><span class="task-name">${toFa(x.weight)} کیلوگرم${x.bmi?' · BMI '+toFa(x.bmi):''}</span><span class="task-time">${x.target?`هدف: ${toFa(x.target)} کیلوگرم · `:''}${x.note?esc(x.note):'ثبت شخصی'}</span></span><button type="button" class="mini-btn mini-delete" onclick="deleteWeight(${i})">حذف</button></div>`).join('');return shell('تعادل وزن',`<div class="weight-card"><h3>تعادل بدن و انرژی</h3><p>این بخش برای ثبت روند وزن، قد، هدف و حال بدنت آماده است؛ عددها را فقط خودت وارد می‌کنی.</p><input id="weightValue" class="soft-input" inputmode="decimal" placeholder="وزن فعلی، کیلوگرم"><input id="heightValue" class="soft-input" inputmode="decimal" placeholder="قد، سانتی‌متر (اختیاری)"><input id="targetWeight" class="soft-input" inputmode="decimal" placeholder="وزن هدف (اختیاری)"><textarea id="weightNote" class="soft-input soft-textarea" placeholder="حس امروز، انرژی یا توضیح شخصی"></textarea><button class="primary" style="width:100%;padding:13px;margin-top:12px" onclick="saveWeight()">＋ ثبت وضعیت امروز</button></div>${rows?`<div class="list" style="margin-top:14px">${rows}</div>`:'<div class="folder-empty" style="margin-top:14px">هنوز گزارشی ثبت نشده.</div>'}`)}
function poemForm(existing){const p=(state.poems||[]).find(x=>x.id===existing)||{};form(p.id?'ویرایش شعر':'افزودن شعر آهنگ',`<div class="field"><label>عنوان</label><input id="poemTitle" value="${esc(p.title||'')}" placeholder="عنوان شعر"></div><div class="field"><label>متن شعر</label><textarea id="poemText" required placeholder="شعر آهنگت را اینجا بنویس">${esc(p.text||'')}</textarea></div>${p.id?`<button type="button" class="delete-full" onclick="deletePoem('${p.id}')">حذف شعر</button>`:''}`,()=>{const o={id:p.id||id(),title:val('poemTitle')||'بدون عنوان',text:val('poemText'),date:new Date().toISOString()};if(p.id)state.poems=state.poems.map(x=>x.id===p.id?o:x);else state.poems.unshift(o);save();closeModal();render()})}
function deletePoem(idv){if(window.confirm('این شعر حذف شود؟')){state.poems=state.poems.filter(x=>x.id!==idv);save();render()}}
function poetry(){const rows=(state.poems||[]).map(x=>`<article class="poetry-card"><h3>${esc(x.title)}</h3><p style="white-space:pre-wrap">${esc(x.text)}</p><div class="export-row">${itemActions(`poemForm('${x.id}')`,`deletePoem('${x.id}')`)}</div></article>`).join('');return shell('شعر آهنگ',`<div class="poetry-card"><h3>دفتر شعرهای من</h3><p>هر شعر، ورس، ترجیع‌بند یا ایده‌ای که خودت می‌نویسی اینجا بماند.</p><button class="primary" style="width:100%;padding:13px;margin-top:12px" onclick="poemForm()">＋ نوشتن شعر جدید</button></div>${rows||'<div class="folder-empty" style="margin-top:14px">هنوز شعری ثبت نشده.</div>'}`)}

function taskForm(existing){const t=state.tasks.find(x=>x.id===existing)||{},editing=!!t.id,period=t.period||activeMissionDetail||activeMission||'daily',showTime=period==='daily';form(editing?'ویرایش برنامه':'افزودن برنامه',`<div class="field"><label>عنوان برنامه</label><input id="tTitle" value="${esc(t.title||t[0]||'')}" placeholder="عنوان برنامه" required></div><div class="field"><label>دوره</label><select id="tPeriod" onchange="toggleTimeField(this.value)">${Object.entries(periods).map(([k,v])=>`<option value="${k}" ${k===period?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>تاریخ شمسی</label>${dateInput('tDate',t.date||'')}</div><div id="tTimeWrap" class="field ${showTime?'':'hide'}"><label>ساعت</label><input id="tTime" type="time" value="${esc(t.time||'')}" ${showTime?'':'disabled'}></div><div class="field"><label>جزئیات</label><textarea id="tNote" placeholder="جزئیات برنامه">${esc(t.note||'')}</textarea></div>${editing?`<button type="button" class="delete-full" onclick="deleteTask('${t.id}')">حذف برنامه</button>`:''}`,()=>{const o={id:t.id||id(),title:val('tTitle'),period:val('tPeriod'),date:dateVal('tDate'),time:val('tPeriod')==='daily'?val('tTime'): '',note:val('tNote'),done:!!t.done};if(t.id)state.tasks=state.tasks.map(x=>x.id===t.id?o:x);else state.tasks.unshift(o);activeMission=o.period;activeMissionDetail=o.period;save();closeModal();render()})}
function goalForm(existing){const g=state.goals.find(x=>x.id===existing)||{};form(g.id?'ویرایش هدف و تصویر':'افزودن هدف و تصویر',`<div class="field"><label>عنوان هدف</label><input id="gTitle" value="${esc(g.title||'')}" placeholder="عنوان هدف" required></div><div class="field"><label>بازه</label><select id="gPeriod">${Object.entries(visionPeriods).map(([k,v])=>`<option value="${k}" ${(g.period||activeVision)===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>تصویر هدف از گالری</label><label class="gallery-pick">＋ انتخاب یا تعویض عکس<input id="gImageFile" type="file" accept="image/*" onchange="previewGoalImage(this)"></label><img id="gPreview" class="gallery-preview ${g.image?'':'hide'}" src="${esc(g.image||'')}" alt=""><input id="gImage" value="${esc(g.image||'')}" placeholder="لینک تصویر اختیاری" style="margin-top:8px"><button type="button" class="clear-image" onclick="clearGoalImage()">پاک کردن عکس</button></div><div class="field"><label>توضیح هدف</label><textarea id="gNote" placeholder="توضیح">${esc(g.note||'')}</textarea></div>${g.id?`<button type="button" class="delete-full" onclick="deleteGoal('${g.id}')">حذف هدف</button>`:''}`,()=>{const o={id:g.id||id(),title:val('gTitle'),period:val('gPeriod'),image:val('gImage'),note:val('gNote')};if(g.id)state.goals=state.goals.map(x=>x.id===g.id?o:x);else state.goals.unshift(o);activeVision=o.period;activeVisionDetail=o.period;save();closeModal();render()})}
function clearGoalImage(){const input=$('#gImage'),preview=$('#gPreview');if(input)input.value='';if(preview){preview.src='';preview.classList.add('hide')}}
function deleteGoal(idv){if(window.confirm('این هدف و تصویرش حذف شود؟')){state.goals=state.goals.filter(x=>x.id!==idv);save();render()}}
function allocationForm(existing){const a=(state.allocations||[]).find(x=>x.id===existing)||{},editing=!!a.id;form(editing?'ویرایش سهم درآمد':'تقسیم درصدی درآمد',`<div class="field"><label>عنوان سهم</label><input id="aName" value="${esc(a.name||'')}" placeholder="عنوان سهم" required></div><div class="field"><label>درصد از درآمد</label><input id="aPercent" type="number" min="0" max="100" step="1" value="${a.percent??''}" placeholder="درصد" required></div>${editing?`<button type="button" class="delete-full" onclick="deleteAllocation('${a.id}')">حذف سهم</button>`:''}`,()=>{const pct=num(val('aPercent')),used=(state.allocations||[]).filter(x=>x.id!==a.id).reduce((s,x)=>s+num(x.percent),0);if(pct>100||used+pct>100){showToast('جمع درصدها نباید بیشتر از ۱۰۰ باشد');return}const o={id:a.id||id(),name:val('aName'),percent:pct};if(a.id)state.allocations=state.allocations.map(x=>x.id===a.id?o:x);else state.allocations.unshift(o);save();closeModal();render()})}
function deleteAllocation(idv){if(window.confirm('این سهم حذف شود؟')){state.allocations=state.allocations.filter(x=>x.id!==idv);save();render()}}
function incomeForm(existing){const x=state.income.find(i=>i.id===existing)||{},editing=!!x.id;form(editing?'ویرایش درآمد':'ثبت درآمد',`<div class="field"><label>مبلغ به تومان</label><input id="iAmount" inputmode="numeric" value="${x.amount||''}" placeholder="مبلغ" required></div><div class="field"><label>منبع درآمد</label><input id="iSource" value="${esc(x.source||'')}" placeholder="منبع درآمد"></div><div class="field"><label>تاریخ</label>${dateInput('iDate',x.date||'')}</div>${editing?`<button type="button" class="delete-full" onclick="deleteIncome('${x.id}')">حذف درآمد</button>`:''}`,()=>{const o={id:x.id||id(),amount:num(val('iAmount')),source:val('iSource'),date:dateVal('iDate')};if(x.id)state.income=state.income.map(i=>i.id===x.id?o:i);else state.income.unshift(o);save();closeModal();render()})}
function deleteIncome(idv){if(window.confirm('این درآمد حذف شود؟')){state.income=state.income.filter(x=>x.id!==idv);save();render()}}
function debtForm(existing){const d=state.debts.find(x=>x.id===existing)||{},editing=!!d.id;form(editing?'ویرایش بدهی یا قسط':'ثبت بدهی یا قسط',`<div class="field"><label>توضیح بدهی یا قسط</label><input id="dTitle" value="${esc(d.title||'')}" placeholder="توضیح" required></div><div class="field"><label>در وجه</label><input id="dPayee" value="${esc(d.payee||'')}" placeholder="شخص، بانک یا اپلیکیشن"></div><div class="field"><label>مبلغ به تومان</label><input id="dAmount" inputmode="numeric" value="${d.amount||''}" placeholder="مبلغ" required></div><div class="field"><label>تاریخ تسویه</label>${dateInput('dDue',d.due||'')}</div>${editing?`<button type="button" class="delete-full" onclick="deleteDebt('${d.id}')">حذف بدهی</button>`:''}`,()=>{const o={id:d.id||id(),title:val('dTitle'),payee:val('dPayee'),amount:num(val('dAmount')),due:dateVal('dDue'),paid:!!d.paid};if(d.id)state.debts=state.debts.map(x=>x.id===d.id?o:x);else state.debts.unshift(o);save();closeModal();render()})}
function deleteDebt(idv){if(window.confirm('این بدهی یا قسط حذف شود؟')){state.debts=state.debts.filter(x=>x.id!==idv);save();render()}}
function eventForm(existing){const e=state.events.find(x=>x.id===existing)||{},editing=!!e.id;form(editing?'ویرایش روز خاص':'نام‌گذاری یک روز خاص',`<div class="field"><label>اسم روز</label><input id="eTitle" value="${esc(e.title||'')}" placeholder="اسم روز" required></div><div class="field"><label>تاریخ</label>${dateInput('eDate',e.date||'')}</div><div class="field"><label>توضیح</label><textarea id="eNote" placeholder="توضیح">${esc(e.note||'')}</textarea></div>${editing?`<button type="button" class="delete-full" onclick="deleteEvent('${e.id}')">حذف روز</button>`:''}`,()=>{const o={id:e.id||id(),title:val('eTitle'),date:dateVal('eDate'),note:val('eNote')};if(e.id)state.events=state.events.map(x=>x.id===e.id?o:x);else state.events.unshift(o);save();closeModal();render()})}
function deleteEvent(idv){if(window.confirm('این روز حذف شود؟')){state.events=state.events.filter(x=>x.id!==idv);save();render()}}
function calendar(){return shell('تقویم',`<div class="pillbar"><button class="pill active">ماه</button><button class="pill">هفته</button><button class="pill">روز</button><button class="pill">روزهای شخصی</button></div>${calendarMarkup()}<div class="section-head"><h2>روزهای شخصی تو</h2><button onclick="eventForm()">＋ افزودن روز</button></div>${state.events.length?`<div class="list">${state.events.slice().reverse().map(e=>`<div class="task"><span class="task-emoji">✦</span><span class="task-info"><span class="task-name">${esc(e.title)}</span><span class="task-time">${esc(e.date?jalaliDisplay(e.date):'')} ${e.note?' · '+esc(e.note):''}</span></span>${itemActions(`eventForm('${e.id}')`,`deleteEvent('${e.id}')`)}</div>`).join('')}</div>`:`<div class="folder-empty">هنوز روز خاصی ثبت نشده.</div>`}`)}
function memoryForm(prefillOrId=''){const existing=state.memories.find(x=>x.id===prefillOrId)||{},prefill=existing.id?'':prefillOrId,editing=!!existing.id;form(editing?'ویرایش خاطره':'ثبت خاطره به شکل نامه',`<div class="field"><label>عنوان خاطره</label><input id="mTitle" value="${esc(existing.title||'')}" placeholder="عنوان خاطره" required></div><div class="field"><label>تاریخ</label>${dateInput('mDate',existing.date||'')}</div><div class="field"><label>نام پارت</label><input id="mPart" value="${esc(existing.part||prefill)}" placeholder="نام پارت"></div><div class="field"><label>متن خاطره</label><textarea id="mBody" placeholder="متن خاطره" required>${esc(existing.body||'')}</textarea></div>${editing?`<button type="button" class="delete-full" onclick="deleteMemory('${existing.id}')">حذف خاطره</button>`:''}`,()=>{const part=val('mPart')||'بدون پارت',o={id:existing.id||id(),title:val('mTitle'),date:dateVal('mDate'),part,body:val('mBody')};if(existing.id)state.memories=state.memories.map(x=>x.id===existing.id?o:x);else state.memories.unshift(o);if(part&&!memoryFolderNames().includes(part)){if(!state.memoryFolders)state.memoryFolders=[];state.memoryFolders.push({id:id(),name:part})}activeMemoryFolder=part;save();closeModal();render()})}
function deleteMemory(idv){if(window.confirm('این خاطره حذف شود؟')){state.memories=state.memories.filter(x=>x.id!==idv);activeMemory=null;save();render()}}
function selfForm(existing){const arr=state.self[activeSelf]||[],x=arr.find(v=>v.id===existing)||{},editing=!!x.id;form(editing?'ویرایش مورد خودشناسی':'افزودن به خودشناسی',`<div class="field"><label>متن</label><textarea id="sText" placeholder="متن خودت" required>${esc(x.text||'')}</textarea></div>${activeSelf==='targets'?`<div class="field"><label>وضعیت عادت</label><select id="sDone"><option value="0" ${!x.done?'selected':''}>رعایت نشده</option><option value="1" ${x.done?'selected':''}>رعایت شد</option></select></div>`:''}${editing?`<button type="button" class="delete-full" onclick="deleteSelf('${x.id}')">حذف مورد</button>`:''}`,()=>{const o={id:x.id||id(),text:val('sText'),done:activeSelf==='targets'?val('sDone')==='1':false};if(x.id)state.self[activeSelf]=arr.map(v=>v.id===x.id?o:v);else state.self[activeSelf].unshift(o);save();closeModal();render()})}
function deleteSelf(idv){if(window.confirm('این مورد حذف شود؟')){state.self[activeSelf]=(state.self[activeSelf]||[]).filter(x=>x.id!==idv);save();render()}}
function toggleSelf(idv){const x=(state.self[activeSelf]||[]).find(v=>v.id===idv);if(x){x.done=!x.done;save();render()}}
function coupleForm(existing){const arr=state.couple[activeCouple]||[],x=arr.find(v=>v.id===existing)||{},editing=!!x.id;form(editing?'ویرایش مورد رابطه':'افزودن به رابطه',`<div class="field"><label>متن</label><textarea id="cText" placeholder="متن خودتان" required>${esc(x.text||'')}</textarea></div><div class="field"><label>تاریخ</label>${dateInput('cDate',x.date||'')}</div>${editing?`<button type="button" class="delete-full" onclick="deleteCouple('${x.id}')">حذف مورد</button>`:''}`,()=>{const o={id:x.id||id(),text:val('cText'),date:dateVal('cDate')};if(x.id)state.couple[activeCouple]=arr.map(v=>v.id===x.id?o:v);else state.couple[activeCouple].unshift(o);save();closeModal();render()})}
function deleteCouple(idv){if(window.confirm('این مورد رابطه حذف شود؟')){state.couple[activeCouple]=(state.couple[activeCouple]||[]).filter(x=>x.id!==idv);save();render()}}
function noteForm(prefillOrId=''){const existing=(state.notes||[]).find(x=>x.id===prefillOrId)||{},prefill=existing.id?'':prefillOrId,editing=!!existing.id;form(editing?'ویرایش نکته':'افزودن نکته به دفترچه',`<div class="field"><label>عنوان نکته</label><input id="nTitle" value="${esc(existing.title||'')}" placeholder="عنوان نکته" required></div><div class="field"><label>پوشه</label><input id="nFolder" value="${esc(existing.folder||prefill)}" placeholder="نام پوشه" required></div><div class="field"><label>تاریخ</label>${dateInput('nDate',existing.date||'')}</div><div class="field"><label>متن نکته</label><textarea id="nBody" placeholder="متن نکته" required>${esc(existing.body||'')}</textarea></div>${editing?`<button type="button" class="delete-full" onclick="deleteNote('${existing.id}')">حذف نکته</button>`:''}`,()=>{const folder=val('nFolder')||'بدون پوشه',o={id:existing.id||id(),title:val('nTitle'),folder,date:dateVal('nDate'),body:val('nBody')};if(existing.id)state.notes=state.notes.map(n=>n.id===existing.id?o:n);else state.notes.unshift(o);if(!noteFolderNames().includes(folder)){if(!state.noteFolders)state.noteFolders=[];state.noteFolders.push({id:id(),name:folder})}activeNoteFolder=folder;save();closeModal();render()})}
function deleteNote(idv){if(window.confirm('این نکته حذف شود؟')){state.notes=(state.notes||[]).filter(x=>x.id!==idv);activeNote=null;save();render()}}


$('#addBtn').onclick=()=>state.view==='mission'?taskForm():state.view==='vision'?goalForm():state.view==='calendar'?eventForm():state.view==='finance'?incomeForm():state.view==='memories'?memoryForm(activeMemoryFolder||''):state.view==='notes'?noteForm(activeNoteFolder||''):state.view==='self'?selfForm():state.view==='couple'?coupleForm():state.view==='voice'?voice():state.view==='balance'?balance():state.view==='poetry'?poemForm():taskForm();document.querySelectorAll('.nav[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.querySelector('#datePicker').addEventListener('click',e=>{if(e.target.id==='datePicker')closeDatePicker()});render();
</script>
</body></html>
