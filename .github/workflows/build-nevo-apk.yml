name: Build NEVo Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'nevo-android/**'
      - '.github/workflows/build-nevo-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p nevo-android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NEVo-v0.17.0-debug
          path: nevo-android/app/build/outputs/apk/debug/app-debug.apk
