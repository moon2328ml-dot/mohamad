name: Build Mohammad Life OS APK
on:
  push:
    branches: [ lifeos-build-20260930 ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Life OS
        run: |
          mkdir -p /tmp/lifeos
          base64 -d ci/lifeos-source.zip.b64 > /tmp/lifeos.zip
          unzip -q /tmp/lifeos.zip -d /tmp/lifeos
      - name: Build APK
        run: |
          cd /tmp/lifeos/MohammadLifeOS
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Mohammad-Life-OS-v0.1-debug
          path: /tmp/lifeos/MohammadLifeOS/app/build/outputs/apk/debug/app-debug.apk
