name: Build BorderManager v1.8

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "border-manager-v1.3/**"
      - "border-manager-v1.3.1/**"
      - "border-manager-v1.3.2/**"
      - "border-manager-v1.4/**"
      - "border-manager-v1.5/**"
      - "border-manager-v1.6/**"
      - "border-manager-v1.7/**"
      - ".github/workflows/build-border-manager-v1.7.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct v1.1 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-src
          cat border-manager-v1.1/payload/part-* > /tmp/border-manager-v11.tar.gz.b64
          base64 -d /tmp/border-manager-v11.tar.gz.b64 > /tmp/border-manager-v11.tar.gz
          echo "253260aa306439d0f1756da287be1ae89240181675bfd817ab68810f5b5d0bf9  /tmp/border-manager-v11.tar.gz" | sha256sum -c -
          tar -xzf /tmp/border-manager-v11.tar.gz -C build-src

      - name: Recreate v1.1 database migration
        shell: python
        run: |
          from pathlib import Path
          p = Path("build-src/app/src/main/java/ir/bordermanager/data/DatabaseHelper.kt")
          s = p.read_text()
          s = s.replace("private const val DB_VERSION = 1", "private const val DB_VERSION = 2")
          s = s.replace(
              "override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) = Unit",
              """override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  if (oldVersion < 2) {
                      db.execSQL("UPDATE trucks SET status='UNLOADED' WHERE completed_at IS NOT NULL")
                  }
              }"""
          )
          p.write_text(s)

      - name: Apply v1.2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat border-manager-v1.2/patch/part-* > /tmp/border-manager-v1.2.patch.gz.b64
          base64 -d /tmp/border-manager-v1.2.patch.gz.b64 > /tmp/border-manager-v1.2.patch.gz
          echo "cfe69106fdd58ff1d8081e6c73b2f096188e07ee06dd454f946772ae652617ba  /tmp/border-manager-v1.2.patch.gz" | sha256sum -c -
          gunzip -c /tmp/border-manager-v1.2.patch.gz > /tmp/border-manager-v1.2.patch
          cd build-src
          patch -p2 < /tmp/border-manager-v1.2.patch

      - name: Apply v1.3 account patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d border-manager-v1.3/patch-v1.3.gz.b64 > /tmp/border-manager-v1.3.patch.gz
          echo "ecb458c2ad66a46ac5e4c6fc7682aff144ed926408a707820146dc939b55a62c  /tmp/border-manager-v1.3.patch.gz" | sha256sum -c -
          gunzip -c /tmp/border-manager-v1.3.patch.gz > /tmp/border-manager-v1.3.patch
          cd build-src
          patch -p1 < /tmp/border-manager-v1.3.patch
          grep -q 'versionName = "1.3.0"' app/build.gradle.kts
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          test -f app/src/main/java/ir/bordermanager/data/CloudSync.kt
          test -f app/src/main/java/ir/bordermanager/ui/AccountScreen.kt

      - name: Apply v1.3.1 full-bleed app icon
        shell: bash
        run: |
          set -euo pipefail
          cd build-src
          python - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace('versionCode = 130', 'versionCode = 131')
          s = s.replace('versionName = "1.3.0"', 'versionName = "1.3.1"')
          p.write_text(s)

          m = Path("app/src/main/AndroidManifest.xml")
          s = m.read_text()
          s = s.replace('android:icon="@drawable/ic_launcher"', 'android:icon="@mipmap/ic_launcher"')
          s = s.replace('android:roundIcon="@drawable/ic_launcher"', 'android:roundIcon="@mipmap/ic_launcher_round"')
          m.write_text(s)
          PY

          mkdir -p app/src/main/res/drawable-nodpi app/src/main/res/mipmap-anydpi app/src/main/res/mipmap-anydpi-v26
          base64 -d ../border-manager-v1.3.1/icon-256.webp.b64 > app/src/main/res/drawable-nodpi/app_icon_full.webp

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/app_icon_full"
              android:gravity="fill" />
          EOF

          cp app/src/main/res/mipmap-anydpi/ic_launcher.xml app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/app_icon_full" />
              <foreground android:drawable="@android:color/transparent" />
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          grep -q 'versionName = "1.3.1"' app/build.gradle.kts
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable-nodpi/app_icon_full.webp

      - name: Apply v1.3.2 full truck details
        shell: bash
        run: |
          set -euo pipefail
          base64 -d border-manager-v1.3.2/patch-v1.3.2.gz.b64 > /tmp/border-manager-v1.3.2.patch.gz
          echo "3d66085c05045588bbebd01d092fcc1d82d9d6ade2326047a57caf3ff090a8b1  /tmp/border-manager-v1.3.2.patch.gz" | sha256sum -c -
          gunzip -c /tmp/border-manager-v1.3.2.patch.gz > /tmp/border-manager-v1.3.2.patch
          cd build-src
          patch -p1 < /tmp/border-manager-v1.3.2.patch
          grep -q 'versionName = "1.3.2"' app/build.gradle.kts
          grep -q 'data class TruckDetail' app/src/main/java/ir/bordermanager/ui/AppViewModel.kt
          grep -q 'fun TruckDetailScreen' app/src/main/java/ir/bordermanager/ui/ScreensCore.kt

      - name: Apply v1.4 workflow and accounting patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            border-manager-v1.4/patch/part-00 \
            border-manager-v1.4/patch/part-01a \
            border-manager-v1.4/patch/part-01b \
            border-manager-v1.4/patch/part-02a \
            border-manager-v1.4/patch/part-02b \
            border-manager-v1.4/patch/part-03a \
            border-manager-v1.4/patch/part-03b \
            > /tmp/border-manager-v1.4.patch.gz.b64
          base64 -d /tmp/border-manager-v1.4.patch.gz.b64 > /tmp/border-manager-v1.4.patch.gz
          echo "bc56a11eb2376fe2526772dcef4be59e7f76cf64aa71c9a8b86fab01e64447e3  /tmp/border-manager-v1.4.patch.gz" | sha256sum -c -
          gunzip -c /tmp/border-manager-v1.4.patch.gz > /tmp/border-manager-v1.4.patch
          cd build-src
          patch -p1 < /tmp/border-manager-v1.4.patch
          grep -q 'versionName = "1.4.0"' app/build.gradle.kts
          grep -q 'WAITING_COTTAGE' app/src/main/java/ir/bordermanager/data/Models.kt
          grep -q 'truck_accounting' app/src/main/java/ir/bordermanager/data/DatabaseHelper.kt
          grep -q 'expert_checked_at' app/src/main/java/ir/bordermanager/data/DatabaseHelper.kt
          test -f app/src/main/java/ir/bordermanager/ui/ScreensWorkflow.kt

      - name: Apply v1.4 Kotlin typing fix
        shell: bash
        run: |
          set -euo pipefail
          cd build-src
          patch -p1 < ../border-manager-v1.4/fix-kotlin-array.patch

      - name: Apply v1.5 reports parts and navigation patch
        shell: bash
        run: |
          set -euo pipefail
          cat border-manager-v1.5/final/part-* > /tmp/border-manager-v1.5.patch.gz.b64
          base64 -d /tmp/border-manager-v1.5.patch.gz.b64 > /tmp/border-manager-v1.5.patch.gz
          echo "323eae7f3c83c9ea25b8b45c55cf5859a2b8a8c92659d8073b8685fa10d3cd0a  /tmp/border-manager-v1.5.patch.gz" | sha256sum -c -
          gunzip -c /tmp/border-manager-v1.5.patch.gz > /tmp/border-manager-v1.5.patch
          cd build-src
          patch -p1 < /tmp/border-manager-v1.5.patch
          sed -i 's/t\.unloadedAt/t.completedAt/g' app/src/main/java/ir/bordermanager/pdf/PdfExporter.kt
          grep -q 'versionName = "1.5.0"' app/build.gradle.kts
          grep -q 'private const val DB_VERSION = 5' app/src/main/java/ir/bordermanager/data/DatabaseHelper.kt
          grep -q 'data class CargoPart' app/src/main/java/ir/bordermanager/data/Models.kt
          grep -q 'fun DailyReportScreen' app/src/main/java/ir/bordermanager/ui/ScreensReports.kt
          grep -q 'fun statusReport' app/src/main/java/ir/bordermanager/pdf/PdfExporter.kt

      - name: Apply v1.6 daily cargo journey report patch
        shell: bash
        run: |
          set -euo pipefail
          cat border-manager-v1.6/patch/part-* > /tmp/border-manager-v1.6.patch.gz.b64
          base64 -d /tmp/border-manager-v1.6.patch.gz.b64 > /tmp/border-manager-v1.6.patch.gz
          echo "aec53ed7ba1d8140a945872c04a4baea0085475afcc7f65322d79c3421225e37  /tmp/border-manager-v1.6.patch.gz" | sha256sum -c -
          gunzip -c /tmp/border-manager-v1.6.patch.gz > /tmp/border-manager-v1.6.patch
          cd build-src/app
          patch -p2 < /tmp/border-manager-v1.6.patch
          grep -q 'versionName = "1.6.0"' build.gradle.kts
          grep -q 'private const val DB_VERSION = 6' src/main/java/ir/bordermanager/data/DatabaseHelper.kt
          grep -q 'object ReportLogic' src/main/java/ir/bordermanager/util/ReportLogic.kt
          grep -q 'fun dailyCargoStatusReport' src/main/java/ir/bordermanager/pdf/PdfExporter.kt
          grep -q 'fun ownerDailyJourneyReport' src/main/java/ir/bordermanager/pdf/PdfExporter.kt

      - name: Apply v1.7 colorful PDF report patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d border-manager-v1.7/patch-v1.7.gz.b64 > /tmp/border-manager-v1.7.patch.gz
          echo "deb7b46be3f6c1da23f3e30b917a1295a2dc43b7009006acdd532818d0d88483  /tmp/border-manager-v1.7.patch.gz" | sha256sum -c -
          gunzip -c /tmp/border-manager-v1.7.patch.gz > /tmp/border-manager-v1.7.patch
          cd build-src
          patch -p1 < /tmp/border-manager-v1.7.patch
          sed -i 's/drawStatusBand(page.canvas, "وضعیت پایان روز:/drawStatusBand(page.canvas, y, "وضعیت پایان روز:/' app/src/main/java/ir/bordermanager/pdf/PdfExporter.kt
          sed -i 's/drawStatusBand(page.canvas, truckStatusLabel(t),/drawStatusBand(page.canvas, y, truckStatusLabel(t),/' app/src/main/java/ir/bordermanager/pdf/PdfExporter.kt
          grep -q 'versionName = "1.7.0"' app/build.gradle.kts
          grep -q 'private const val DB_VERSION = 6' app/src/main/java/ir/bordermanager/data/DatabaseHelper.kt
          grep -q '"call_batches"' app/src/main/java/ir/bordermanager/data/DatabaseHelper.kt
          grep -q '"call_entries"' app/src/main/java/ir/bordermanager/data/DatabaseHelper.kt
          grep -q 'fun dailyCargoStatusReport' app/src/main/java/ir/bordermanager/pdf/PdfExporter.kt
          grep -q 'گزارش ماهانه وضعیت بار' app/src/main/java/ir/bordermanager/pdf/PdfExporter.kt
          grep -q 'drawOwnerBand' app/src/main/java/ir/bordermanager/pdf/PdfExporter.kt

      - name: Fix cloud backup export and bump v1.8
        shell: bash
        run: |
          set -euo pipefail
          cd build-src
          python - <<'PY'
          from pathlib import Path
          db = Path("app/src/main/java/ir/bordermanager/data/DatabaseHelper.kt")
          s = db.read_text()
          old = 'readableDatabase.rawQuery("SELECT * FROM $table ORDER BY id", null)'
          new = 'readableDatabase.rawQuery("SELECT * FROM $table ORDER BY rowid", null)'
          if old not in s:
              raise SystemExit("backup export query not found")
          db.write_text(s.replace(old, new))

          g = Path("app/build.gradle.kts")
          t = g.read_text()
          t = t.replace('versionCode = 170', 'versionCode = 180')
          t = t.replace('versionName = "1.7.0"', 'versionName = "1.8.0"')
          g.write_text(t)
          PY
          grep -q 'ORDER BY rowid' app/src/main/java/ir/bordermanager/data/DatabaseHelper.kt
          grep -q 'versionName = "1.8.0"' app/build.gradle.kts
          grep -q 'private const val DB_VERSION = 6' app/src/main/java/ir/bordermanager/data/DatabaseHelper.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: build-src
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build unsigned release APK
        working-directory: build-src
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Package outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f build-src/app/build/outputs/apk/debug/app-debug.apk
          test -f build-src/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"
          cp build-src/app/build/outputs/apk/debug/app-debug.apk BorderManager-v1.8.0-debug.apk
          cp build-src/app/build/outputs/apk/release/app-release-unsigned.apk BorderManager-v1.8.0-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
          tar -czf BorderManager-v1.8.0-source.tar.gz -C build-src .
          sha256sum BorderManager-v1.8.0-debug.apk BorderManager-v1.8.0-release-unsigned.apk BorderManager-v1.8.0-source.tar.gz

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BorderManager-v1.8.0-debug
          path: BorderManager-v1.8.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release signing tools
        uses: actions/upload-artifact@v4
        with:
          name: BorderManager-v1.8.0-release-tools
          path: |
            BorderManager-v1.8.0-release-unsigned.apk
            apksigner.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: BorderManager-v1.8.0-source
          path: BorderManager-v1.8.0-source.tar.gz
          if-no-files-found: error
          retention-days: 30
