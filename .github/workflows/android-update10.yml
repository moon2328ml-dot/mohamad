name: Build Update 10 APK

on:
  push:
    branches: [ update10-apk-20261002 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build Update 10
        working-directory: update10
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BorderManager-Update10-debug-apk
          path: update10/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
