name: Build Mohammad Life OS APK
on:
  push:
    branches: [ mohammad-lifeos-fresh, mohammad-lifeos-exact-ui ]
    paths:
      - 'lifeos/**'
      - '.github/workflows/mohammad-lifeos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate exact launcher PNGs
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open("lifeos/app/src/main/res/drawable-nodpi/app_logo.jpg").convert("RGB")
          sizes={"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density,size in sizes.items():
              d=Path(f"lifeos/app/src/main/res/mipmap-{density}")
              d.mkdir(parents=True,exist_ok=True)
              im=src.resize((size,size),Image.Resampling.LANCZOS)
              im.save(d/"ic_launcher.png",optimize=True)
              im.save(d/"ic_launcher_round.png",optimize=True)
          PY
      - name: Build debug APK
        working-directory: lifeos
        run: gradle assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test app launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r lifeos/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n ir.mohammad.lifeos/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q "ir.mohammad.lifeos"
            if adb logcat -d | grep -A 12 -B 4 "FATAL EXCEPTION" | grep -q "ir.mohammad.lifeos"; then
              echo "App crashed during smoke test"
              adb logcat -d | grep -A 20 -B 8 "FATAL EXCEPTION"
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: Mohammad-Life-OS-v1.0
          path: lifeos/app/build/outputs/apk/debug/app-debug.apk

      - name: Collect Android signing tools
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          mkdir -p signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" signing-tools/lib64/
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools-35
          path: signing-tools
