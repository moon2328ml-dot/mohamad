name: Build Fresh Mohammad Life OS APK
on:
  push:
    branches: [ mohammad-lifeos-fresh ]
    paths:
      - 'lifeos/**'
      - '.github/workflows/mohammad-lifeos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: lifeos
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Mohammad-Life-OS-v1.0
          path: lifeos/app/build/outputs/apk/debug/app-debug.apk
