name: Build BorderManager Main v1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "border-manager-v1/**"
      - ".github/workflows/build-border-manager-main-v1.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct source project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-src
          cat border-manager-v1/payload/part-* > /tmp/border-manager.tar.gz.b64
          base64 -d /tmp/border-manager.tar.gz.b64 > /tmp/border-manager.tar.gz
          echo "8f14e376efe3a22bee66e6c074adf291dd2276a1e00d7704b7632dc24e524e3b  /tmp/border-manager.tar.gz" | sha256sum -c -
          tar -xzf /tmp/border-manager.tar.gz -C build-src
          test -f build-src/settings.gradle.kts
          test -f build-src/app/src/main/AndroidManifest.xml
          sed -i 's/compileSdk = 37/compileSdk = 36/' build-src/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' build-src/app/build.gradle.kts
          sed -i '/id("org.jetbrains.kotlin.android")/d' build-src/app/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.08.00/' build-src/app/build.gradle.kts
          sed -i 's/androidx.core:core-ktx:1.19.1/androidx.core:core-ktx:1.16.0/' build-src/app/build.gradle.kts
          sed -i 's/androidx.activity:activity-compose:1.13.0/androidx.activity:activity-compose:1.10.1/' build-src/app/build.gradle.kts
          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0/androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2/' build-src/app/build.gradle.kts
          sed -i 's/androidx.lifecycle:lifecycle-runtime-compose:2.11.0/androidx.lifecycle:lifecycle-runtime-compose:2.9.2/' build-src/app/build.gradle.kts
          sed -i 's/arrayOf(status.dbValue, System.currentTimeMillis(), id)/arrayOf<Any?>(status.dbValue, System.currentTimeMillis(), id)/' build-src/app/src/main/java/ir/bordermanager/data/DatabaseHelper.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        working-directory: build-src
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -f build-src/app/build/outputs/apk/debug/app-debug.apk
          cp build-src/app/build/outputs/apk/debug/app-debug.apk BorderManager-v1.0.0-debug.apk
          sha256sum BorderManager-v1.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BorderManager-v1.0.0-APK
          path: BorderManager-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
