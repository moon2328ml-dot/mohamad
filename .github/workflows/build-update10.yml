name: Build Border Manager Update 10

on:
  workflow_dispatch:
  push:
    branches:
      - update10-apk-20261002

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build Update 10 debug APK
        working-directory: update10
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BorderManager-Update10-debug-apk
          path: update10/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
